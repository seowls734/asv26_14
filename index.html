<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1">
<title>게임 모음</title>
<script>/* 화면 배치(모바일/PC)를 첫 렌더 전에 정함 — 사이트 공통 키 games-layout
   PC 모드 + 기기 화면 폭 < 1024px 이면 viewport 를 width=1280 (데스크톱 사이트)으로 바꾸고,
   축소 배율을 --vp-zoom 으로 넘겨 화면 배치 버튼만 손가락 크기로 키운다.
   applyLayout(l) 는 본문 스크립트(화면 배치 버튼·storage 이벤트)에서도 그대로 다시 쓴다. */
window.applyLayout=function(l){var d=document.documentElement,w=0,vp=document.getElementById('vp');
d.dataset.layout=l;
try{w=screen.width}catch(e){}
if(l==='pc'&&w&&w<1024){vp.setAttribute('content','width=1280');d.style.setProperty('--vp-zoom',String(Math.min(1280/w,3)))}
else{vp.setAttribute('content','width=device-width, initial-scale=1');d.style.removeProperty('--vp-zoom')}
};
(function(){var l;
try{l=localStorage.getItem('games-layout')}catch(e){}
if(l!=='mobile'&&l!=='pc'){try{l=(matchMedia('(max-width: 820px)').matches||(matchMedia('(pointer: coarse)').matches&&Math.min(screen.width,screen.height)<=820))?'mobile':'pc'}catch(e){l='pc'}}
applyLayout(l);
})();
/* 허브 배경색 — 허브 전용 키 games-hub-bg (공 배틀과 공유 안 함). 첫 렌더 전에 저장값을 적용해 깜빡임 방지.
   applyPageBg(hex) 는 본문 스크립트(스와치·storage 이벤트)에서도 다시 씀. '' 이면 인라인 값을 지워 테마를 따름.
   글자색은 배경 휘도로 계산 (공 배틀 onPageColors 와 같은 방식) */
window.HUB_BG_RE=/^#[0-9a-f]{6}$/i;
window.onPageColors=function(hex){
var v=parseInt(hex.slice(1),16);
function lum(r,g,b){function f(c){c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)}return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b)}
function cr(a,b){return (Math.max(a,b)+0.05)/(Math.min(a,b)+0.05)}
var L=lum((v>>16)&255,(v>>8)&255,v&255),light=cr(1,L)>=cr(0,L);
/* 흰/검 중 대비가 큰 쪽 끝에서 배경 쪽으로 다가가며 목표 대비를 지키는 가장 부드러운 회색 */
function pick(target){var best=light?255:0;
for(var k=1;k<=255;k++){var g=light?255-k:k;if(cr(lum(g,g,g),L)<target)break;best=g}
return 'rgb('+best+', '+best+', '+best+')'}
return {main:pick(12),muted:pick(4.6)};
};
window.applyPageBg=function(hex){var st=document.documentElement.style;
if(!hex||!HUB_BG_RE.test(hex)){st.removeProperty('--page-bg');st.removeProperty('--on-page');st.removeProperty('--on-page-muted');return}
var c=onPageColors(hex);
st.setProperty('--page-bg',hex);st.setProperty('--on-page',c.main);st.setProperty('--on-page-muted',c.muted);
};
(function(){var b=null;
try{b=localStorage.getItem('games-hub-bg')}catch(e){}
try{applyPageBg(b&&HUB_BG_RE.test(b)?b.toLowerCase():'')}catch(e){}
})();</script>

    --primary: #b93a0a; --primary-hi: #c94a10; --primary-lo: #7a2606; --primary-text: #fff;

       JS 가 사용자 색을 고르면 documentElement.style 에 세 값을 덮어씀 (글자색은 배경 휘도로 계산) */

  }

    --stone-black: #111010; --stone-white: #ece6dc; --stone-edge: #6e6658; --win-line: #ff5a5a;
    --primary: #ff8a3d; --primary-hi: #ffa766; --primary-lo: #a8460f; --primary-text: #1c1a17;
    --accent-hi: #d9a06a; --accent-lo: #7a4f27;
    --btn-hi: #3d3831; --btn-edge: #15130f;

    --shadow: rgba(0, 0, 0, .45); --scrim: rgba(0, 0, 0, .6);
    --pattern: rgba(255, 235, 205, .045); --vignette: rgba(0, 0, 0, .35);
    --focus: #8ab4ff; --glow: rgba(255, 138, 61, .35);
    --title-from: #ffd27a; --title-to: #ff8a3d; --title-edge: #5a2a0a;
    --gold: #ffc94d; --gold-hi: #ffe08a; --gold-lo: #e09a1a; --ray: rgba(255, 201, 77, .16);

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background-color: var(--page-bg);
    background-image:
      radial-gradient(ellipse at 50% 0%, transparent 45%, var(--vignette) 100%),
      radial-gradient(var(--pattern) 1.5px, transparent 2px);
    background-size: 100% 100%, 22px 22px;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    min-height: 100vh;
    /* 좁은 폭 규칙은 @container 로 body 폭을 기준으로 적용 → 모바일 모드에서 body 폭을 줄이면 같은 규칙이 그대로 적용됨 */
    container-type: inline-size;
  }
  /* 화면 배치: 모바일 모드는 화면 폭과 관계없이 폭 480px 세로 배치, 가운데 정렬 */
  :root[data-layout="mobile"] body { max-width: 480px; margin: 0 auto; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  :focus:not(:focus-visible) { outline: none; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 48px; }

  /* ===== 타이틀 화면 헤더 ===== */
  .top {
    position: relative; display: flex; align-items: center; gap: 14px 16px; flex-wrap: wrap;
    margin-bottom: 30px; padding: 30px 22px 26px;
    border: 3px solid var(--frame); border-radius: 22px;
    background:
      radial-gradient(ellipse at 15% 0%, var(--panel-hi), transparent 65%),
      repeating-linear-gradient(135deg, var(--pattern) 0 10px, transparent 10px 20px),
      var(--panel);
    box-shadow: inset 0 1px 0 var(--frame-hi), 0 6px 0 var(--frame), 0 16px 32px var(--shadow);
  }
  /* 아케이드 마키 전구 (위·아래) */
  .top::before, .top::after {
    content: ""; position: absolute; left: 18px; right: 18px; height: 10px; pointer-events: none;
    background: radial-gradient(circle, var(--gold-hi) 0 2.5px, var(--gold) 2.5px 3.5px, transparent 4px) 0 50% / 16px 10px repeat-x;
    animation: gx-marquee 1.2s steps(2) infinite;
  }
  .top::before { top: 7px; }
  .top::after { bottom: 7px; animation-direction: reverse; }
  @keyframes gx-marquee { to { background-position: 16px 50%; } }
  .brand { min-width: 0; flex: 1 1 auto; }   /* 기준 폭 = 제목 길이 → 긴 제목(de)은 잘리지 않고 버튼 줄이 아래로 내려감 */
  h1 {
    font-size: clamp(32px, 8cqw, 46px); margin: 0; font-weight: 900; letter-spacing: .02em; line-height: 1.1;
    color: var(--title-to);
    filter: drop-shadow(0 3px 0 var(--title-edge)) drop-shadow(0 6px 8px var(--shadow));
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    h1 {
      background: linear-gradient(180deg, var(--title-from) 20%, var(--title-to) 85%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  }
  @media (forced-colors: active) { h1 { -webkit-text-fill-color: CanvasText; background: none; filter: none; } }
  .sub { color: var(--muted); margin: 10px 0 0; font-size: 15px; font-weight: 600; }
  /* 오른쪽 액션 영역: 언어 선택 + (예정) 로그인 프로필 칩 */
  .top-actions {
    margin-left: auto; display: flex; align-items: center; justify-content: flex-end;
    gap: 8px; flex-wrap: wrap; min-width: 0;
    position: relative; /* 배경색 팝오버 기준 (오른쪽 끝에 맞춤 → 좁은 화면에서도 안 넘침) */
  }
  select.lang {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--text);
    background: linear-gradient(180deg, var(--btn-hi), var(--btn));
    border: 2px solid var(--btn-edge); border-radius: 10px; padding: 8px 8px; min-height: 44px;
    box-shadow: 0 3px 0 var(--btn-edge); cursor: pointer;
  }
  /* 화면 배치 세그먼트 (언어 선택과 같은 버튼 모양) */
  .seg {
    display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    background: var(--btn); border: 2px solid var(--btn-edge); border-radius: 10px;
    padding: 0; gap: 2px; box-shadow: 0 3px 0 var(--btn-edge); overflow: hidden;
  }
  .seg button {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--text);
    background: transparent; border: 0; border-radius: 0;
    min-height: 44px; min-width: 52px; padding: 4px 10px; cursor: pointer; white-space: nowrap;
  }
  @media (hover: hover) { .seg button:hover { background: var(--btn-hi); } }
  /* 폰에서 PC 모드(viewport 1280 축소)일 때만 --vp-zoom 이 있음 → 실제 손가락 크기 유지 */
  :root[data-layout="pc"] .seg button {
    min-height: calc(44px * var(--vp-zoom, 1)); min-width: calc(52px * var(--vp-zoom, 1));
    font-size: calc(13px * min(var(--vp-zoom, 1), 2.8));
  }
  .seg button:focus-visible { outline-offset: -3px; } /* .seg 의 overflow 에 잘리지 않게 안쪽으로 */
  /* 선택 표시는 html[data-layout] 기준 (JS 연결 전에도 맞게 보임) */
  :root[data-layout="mobile"] .seg button[data-v="mobile"],
  :root[data-layout="pc"] .seg button[data-v="pc"] {
    background: linear-gradient(180deg, var(--primary-hi), var(--primary) 55%); color: var(--primary-text);
  }

  /* ===== 배경색 버튼 + 팝오버 (언어 선택 옆) ===== */
  /* 언어 선택과 같은 버튼 모양. 폰 PC 모드(--vp-zoom)에서도 손가락 크기 유지 */
  .hub-btn {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--text);
    background: linear-gradient(180deg, var(--btn-hi), var(--btn));
    border: 2px solid var(--btn-edge); border-radius: 10px; min-height: 44px; padding: 4px 12px;
    box-shadow: 0 3px 0 var(--btn-edge); cursor: pointer;
  }
  .hub-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--btn-edge); }
  .hub-btn:disabled { opacity: .5; cursor: default; transform: none; box-shadow: 0 3px 0 var(--btn-edge); }
  @media (hover: hover) { .hub-btn:not(:disabled):hover { background: var(--btn-hi); } }
  .hub-btn.icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; padding: 0;
  }
  .hub-btn.icon svg { width: 24px; height: 24px; display: block; }
  .hub-btn[aria-expanded="true"] { border-color: var(--primary); box-shadow: 0 3px 0 var(--primary-lo); }
  :root[data-layout="pc"] .hub-btn.icon {
    width: calc(44px * var(--vp-zoom, 1)); height: calc(44px * var(--vp-zoom, 1));
  }
  :root[data-layout="pc"] .hub-btn.icon svg { width: calc(24px * var(--vp-zoom, 1)); height: calc(24px * var(--vp-zoom, 1)); }
  .bg-pop {
    --hub-sw: 44px;
    position: absolute; top: calc(100% + 10px); right: 0; z-index: 20;
    width: calc(var(--hub-sw) * 5 + 8px * 4 + 28px); max-width: calc(100vw - 32px);
    padding: 12px; color: var(--text);
    background: var(--panel); border: 2px solid var(--frame); border-radius: 14px;
    box-shadow: inset 0 1px 0 var(--frame-hi), 0 4px 0 var(--frame), 0 14px 28px var(--shadow);
  }
  .bg-pop[hidden] { display: none; }
  :root[data-layout="pc"] .bg-pop { --hub-sw: calc(44px * var(--vp-zoom, 1)); }
  .bg-pop-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px;
  }
  .bg-pop-title { font-size: 14px; font-weight: 800; }
  :root[data-layout="pc"] .bg-pop-title,
  :root[data-layout="pc"] .bg-pop .hub-btn { font-size: calc(13px * min(var(--vp-zoom, 1), 2.8)); min-height: calc(44px * var(--vp-zoom, 1)); }
  .bg-pop .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .bg-pop .swatch, .bg-pop .swatch-custom {
    flex: none; width: var(--hub-sw); height: var(--hub-sw); padding: 0; margin: 0; border-radius: 50%;
    border: 1px solid var(--border); cursor: pointer; position: relative;
  }
  .bg-pop .swatch { background: var(--sw, var(--bg)); font: inherit; }
  /* 기본 스와치: 테마 배경 + 대각선 */
  .bg-pop .swatch.default {
    background:
      linear-gradient(135deg, transparent calc(50% - 1px), var(--muted) calc(50% - 1px), var(--muted) calc(50% + 1px), transparent calc(50% + 1px)),
      var(--bg);
  }
  .bg-pop .swatch[aria-pressed="true"], .bg-pop .swatch.on, .bg-pop .swatch-custom.on {
    box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--primary);
  }
  .bg-pop .swatch:focus-visible { outline-offset: 4px; }
  .bg-pop .swatch:active, .bg-pop .swatch-custom:active { transform: scale(.92); }
  @media (hover: hover) {
    .bg-pop .swatch:hover, .bg-pop .swatch-custom:hover { box-shadow: 0 0 0 2px var(--btn-edge); }
    .bg-pop .swatch[aria-pressed="true"]:hover, .bg-pop .swatch.on:hover, .bg-pop .swatch-custom.on:hover {
      box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--primary);
    }
  }
  /* 사용자 지정: 원형 color input + "+" 표식 */
  .bg-pop .swatch-custom { display: inline-block; overflow: hidden; background: var(--btn); }
  .bg-pop .swatch-custom:focus-within { outline: 3px solid var(--focus); outline-offset: 4px; }
  .bg-pop .swatch-custom:has(input:focus:not(:focus-visible)) { outline: none; }
  .bg-pop .swatch-custom input[type="color"] {
    position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px);
    padding: 0; border: 0; background: none; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .bg-pop .swatch-custom input[type="color"]:focus-visible { outline: none; }
  .bg-pop .swatch-custom input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .bg-pop .swatch-custom input[type="color"]::-webkit-color-swatch { border: 0; }
  .bg-pop .swatch-custom input[type="color"]::-moz-color-swatch { border: 0; }
  .bg-pop .swatch-custom::after {
    content: "+"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; line-height: 1; color: var(--text);
    pointer-events: none; text-shadow: 0 0 3px var(--panel), 0 0 2px var(--panel);
  }
  .bg-pop .swatch-custom.on::after { content: none; }

  /* ===== 게임 선택 카드 ===== */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px 18px; }
  a.card {
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--panel-hi), var(--panel) 40%);
    border: 3px solid var(--frame);
    border-radius: 18px;
    overflow: hidden;
    color: inherit;
    text-decoration: none;
    box-shadow: inset 0 1px 0 var(--frame-hi), 0 5px 0 var(--frame), 0 12px 24px var(--shadow);
    transition: transform .2s cubic-bezier(.2, 1.4, .4, 1), box-shadow .2s ease, border-color .2s ease;
  }
  a.card:focus-visible {
    transform: translateY(-6px);
    border-color: var(--primary);
    box-shadow: inset 0 1px 0 var(--frame-hi), 0 9px 0 var(--primary-lo), 0 0 0 5px var(--glow), 0 24px 38px var(--shadow);
  }
  @media (hover: hover) {
    a.card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: inset 0 1px 0 var(--frame-hi), 0 9px 0 var(--primary-lo), 0 0 0 5px var(--glow), 0 24px 38px var(--shadow);
    }
    a.card:hover .thumb { transform: scale(1.04); }
    a.card:hover .play { filter: brightness(1.08); }
  }
  a.card:active { transform: translateY(-2px); }
  /* 카드 포커스 링은 카드 밖(페이지 바탕 위)에 그려지므로 --on-page 를 씀 → 사용자 배경색에서도 보임 */
  a.card:focus-visible { outline: 3px solid var(--on-page); outline-offset: 6px; }
  .thumb {
    aspect-ratio: 16 / 9; display: block; width: 100%;
    border-bottom: 3px solid var(--frame);
    transition: transform .3s ease;
  }
  .body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; position: relative; background: inherit; }
  .name { font-size: 21px; font-weight: 900; letter-spacing: .01em; }
  .desc { color: var(--muted); font-size: 14px; line-height: 1.45; flex: 1; }
  /* PLAY 버튼 (카드 전체가 링크, 이건 시각 표시) */
  .play {
    align-self: stretch;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 10px;
    min-height: 46px;
    padding: 8px 16px;
    background: linear-gradient(180deg, var(--primary-hi), var(--primary) 55%);
    color: var(--primary-text);
    border: 2px solid var(--primary-lo);
    border-radius: 12px;
    box-shadow: inset 0 1px 0 var(--frame-hi), 0 4px 0 var(--primary-lo);
    font-size: 17px;
    font-weight: 900;
    letter-spacing: .06em;
    text-transform: uppercase;
    transition: transform .08s ease, box-shadow .08s ease, filter .12s ease;
  }
  .play::before {
    content: ""; width: 0; height: 0;
    border-left: 11px solid currentColor; border-top: 7px solid transparent; border-bottom: 7px solid transparent;
  }
  a.card:active .play { transform: translateY(3px); box-shadow: inset 0 1px 0 var(--frame-hi), 0 1px 0 var(--primary-lo); }
  /* body 폭 기준 (모바일 모드면 body 가 480px 이라 항상 적용) */
  @container (max-width: 520px) {
    .wrap { padding: 20px 16px 32px; }
    .top { padding: 26px 16px 22px; border-radius: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    a.card:hover, a.card:focus-visible, a.card:active, a.card:hover .thumb { transform: none; }
  }
</style>

function detectLang() {
  const list = navigator.languages && navigator.languages.length ? navigator.languages : (navigator.language ? [navigator.language] : []);
  for (const l of list) {
    const code = String(l).toLowerCase().slice(0, 2);
    if (I18N[code]) return code;
  }
  return 'ko';
}
let lang = detectLang();

function applyLang() {
  document.documentElement.lang = lang;

  sel.value = lang;
}

  const mk = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  const g = 24, ox = 16, oy = 18;
  for (let i = 0; i < 13; i++) mk('line', { x1: ox + i * g, y1: oy, x2: ox + i * g, y2: oy + 6 * g, style: 'stroke: var(--wood-line)', 'stroke-width': 1 });
  for (let j = 0; j < 7; j++) mk('line', { x1: ox, y1: oy + j * g, x2: ox + 12 * g, y2: oy + j * g, style: 'stroke: var(--wood-line)', 'stroke-width': 1 });
  const B = [[3, 2], [4, 3], [5, 4], [6, 5], [7, 6], [8, 2]];
  const W = [[4, 2], [5, 3], [6, 3], [7, 4], [8, 4], [5, 5]];
  for (const [c, r] of W) mk('circle', { cx: ox + c * g, cy: oy + r * g, r: 10.5, style: 'fill: var(--stone-white); stroke: var(--stone-edge)' });
  for (const [c, r] of B) mk('circle', { cx: ox + c * g, cy: oy + r * g, r: 10.5, style: 'fill: var(--stone-black)' });
  mk('line', { x1: ox + 3 * g, y1: oy + 2 * g, x2: ox + 7 * g, y2: oy + 6 * g, style: 'stroke: var(--win-line)', 'stroke-width': 4, 'stroke-linecap': 'round', opacity: .85 });
})();

// 화면 배치(모바일/PC): 상태는 html[data-layout], 저장은 사이트 공통 키 games-layout
function syncLayoutSeg() {
  document.querySelectorAll('#layoutSeg button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.v === document.documentElement.dataset.layout));
  });
}
document.getElementById('layoutSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  applyLayout(b.dataset.v);
  try { localStorage.setItem('games-layout', b.dataset.v); } catch (err) {}
  syncLayoutSeg();
});
// 다른 탭에서 바꾸면 따라감
window.addEventListener('storage', e => {
  if (e.key === 'games-layout' && (e.newValue === 'mobile' || e.newValue === 'pc')) {
    applyLayout(e.newValue);
    syncLayoutSeg();
  }
  // 다른 탭에서 저장소를 모두 지움 → 첫 방문 기본값(head 스크립트와 같은 식)으로 다시 판정
  if (e.key === null) {
    let l = 'pc';
    try { l = (matchMedia('(max-width: 820px)').matches || (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 820)) ? 'mobile' : 'pc'; } catch (err) {}
    applyLayout(l);
    syncLayoutSeg();
  }
  if (e.key === 'games-hub-bg' || e.key === null) {
    const v = e.key === null ? '' : (e.newValue || '');
    hubBg = HUB_BG_RE.test(v) ? v.toLowerCase() : '';
    syncHubBg();
  }
});
syncLayoutSeg();

// 허브 배경색: 상태는 hubBg ('' = 테마 기본), 문서 반영은 head 의 applyPageBg, 저장은 허브 전용 키 games-hub-bg
const bgBtn = document.getElementById('hubBgBtn');
const bgPop = document.getElementById('hubBgPop');
const bgSwatches = document.getElementById('hubBgSwatches');
const bgInput = document.getElementById('hubBgInput');
let hubBg = '';
try { const v = localStorage.getItem('games-hub-bg'); if (v && HUB_BG_RE.test(v)) hubBg = v.toLowerCase(); } catch (e) {}

// hubBg 를 문서와 UI(.on / aria-pressed / 초기화 버튼)에 반영
function syncHubBg() {
  applyPageBg(hubBg);
  let matched = false;
  bgSwatches.querySelectorAll('.swatch').forEach(b => {
    const on = (b.dataset.color || '').toLowerCase() === hubBg;
    if (on) matched = true;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  document.getElementById('hubBgCustom').classList.toggle('on', !matched);
  if (!matched) bgInput.value = hubBg;
  document.getElementById('hubBgReset').disabled = !hubBg;
}
// save=false 는 색 고르는 중 미리보기 (저장은 change 때)
function setHubBg(v, save = true) {
  v = (v || '').toLowerCase();
  if (v && !HUB_BG_RE.test(v)) return;
  hubBg = v;
  syncHubBg();
  if (!save) return;
  try { if (v) localStorage.setItem('games-hub-bg', v); else localStorage.removeItem('games-hub-bg'); } catch (e) {}
}
bgSwatches.addEventListener('click', e => {
  const b = e.target.closest('.swatch');
  if (b) setHubBg(b.dataset.color);
});
bgInput.addEventListener('input', e => setHubBg(e.target.value, false));
bgInput.addEventListener('change', e => setHubBg(e.target.value));
document.getElementById('hubBgReset').addEventListener('click', () => {
  setHubBg('');
  bgSwatches.querySelector('.swatch').focus(); // disabled 가 된 초기화 버튼에서 포커스가 사라지지 않게
});

// 팝오버 열기/닫기: hidden + aria-expanded. 바깥 클릭·Esc 로 닫음
function openBgPop() {
  bgPop.hidden = false;
  bgBtn.setAttribute('aria-expanded', 'true');
  (bgSwatches.querySelector('.swatch[aria-pressed="true"]') ||
   (document.getElementById('hubBgCustom').classList.contains('on') ? bgInput : null) ||
   bgSwatches.querySelector('.swatch')).focus();
}
function closeBgPop(refocus) {
  if (bgPop.hidden) return;
  bgPop.hidden = true;
  bgBtn.setAttribute('aria-expanded', 'false');
  if (refocus) bgBtn.focus();
}
bgBtn.addEventListener('click', () => { if (bgPop.hidden) openBgPop(); else closeBgPop(true); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !bgPop.hidden) { e.preventDefault(); closeBgPop(true); }
});
// 바깥 클릭: 다른 컨트롤을 누른 경우엔 그쪽 포커스를 뺏지 않고, 팝오버 안에 포커스가 있었을 때만 버튼으로 돌려줌
document.addEventListener('pointerdown', e => {
  if (bgPop.hidden || bgPop.contains(e.target) || bgBtn.contains(e.target)) return;
  const inside = bgPop.contains(document.activeElement);
  closeBgPop(false);
  // 포커스 이동(mousedown 기본 동작)이 끝난 뒤, 포커스 갈 곳 없는 바탕을 눌렀을 때만
  if (inside) setTimeout(() => {
    if (!document.activeElement || document.activeElement === document.body) bgBtn.focus({ preventScroll: true });
  }, 0);
});
// 키보드로 Tab 해서 팝오버 밖으로 나가면 닫음
bgPop.addEventListener('focusout', e => {
  if (e.relatedTarget && !bgPop.contains(e.relatedTarget) && e.relatedTarget !== bgBtn) closeBgPop(false);
});
syncHubBg();

applyLang();
</script>
</body>
</html>
