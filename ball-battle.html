}

function renderMySelect() {
  const sel = $('mySelect');
  sel.textContent = '';
  const dups = dupInfo(state.lineup);
  if (!state.lineup.length) {
    const o = document.createElement('option');
    o.value = '-1';
    o.textContent = t('none');
    sel.appendChild(o);
  }
  state.lineup.forEach((ty, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = '#' + (i + 1) + ' ' + ballName(ty, dups[i].dupIndex, dups[i].dupCount);
    sel.appendChild(o);
  });
  sel.value = String(state.myIndex);
  sel.disabled = !state.lineup.length || inBattle();
}

// ===== 체력 목록 =====
let hpRows = new Map(); // id → { row, fill, val, cd, name }
function buildHpRows() {
  const list = $('hpList');
  list.textContent = '';
  hpRows = new Map();
  const s = state.sim;
  if (!s) return;
  for (const b of s.bodies) {
    const row = document.createElement('div');
    row.className = 'hp-row';
    const num = document.createElement('span');
    num.className = 'hp-num';
    num.textContent = b.slot;
    const name = document.createElement('span');
    name.className = 'hp-name';
    name.textContent = bodyName(b);
    const bar = document.createElement('div');
    bar.className = 'hp-bar';
    const fill = document.createElement('div');
    fill.className = 'hp-fill';
    bar.appendChild(fill);
    const val = document.createElement('span');
    val.className = 'hp-val';
    const cur = document.createTextNode('');
    const max = document.createElement('span');
    max.className = 'hp-max';
    max.textContent = '/' + b.maxHp;
    val.append(cur, max);
    const cd = document.createElement('span');
    cd.className = 'cd';
    row.append(num, name, bar, val, cd);
    list.appendChild(row);
    hpRows.set(b.id, { row, fill, val, cur, cd, name });
  }
  renderHp();
}
function setText(el, s) { if (el.textContent !== s) el.textContent = s; }
function renderHp() {
  const s = state.sim;
  if (!s) return;
  const showCd = state.phase !== 'select';
  const myId = state.mode === 'play' && state.myIndex >= 0 ? state.myIndex + 1 : 0;
  for (const b of s.bodies) {
    const r = hpRows.get(b.id);
    if (!r) continue;
    const f = clamp(b.hp / b.maxHp, 0, 1);
    r.fill.style.width = (f * 100).toFixed(1) + '%';
    r.fill.classList.toggle('low', f <= 0.3);
    r.row.classList.toggle('out', !b.alive);
    const cur = String(Math.max(0, Math.ceil(b.hp)));
    if (r.cur.nodeValue !== cur) r.cur.nodeValue = cur;
    r.row.classList.toggle('mine', b.id === myId);
    setText(r.cd, !showCd || !b.alive ? (b.alive ? '' : '—') : b.cd > 0 ? b.cd.toFixed(1) : '✓');
  }
  // 생존 순(슬롯) → 탈락 행은 맨 아래(순위 순)
  const order = s.bodies.filter(b => b.alive).map(b => b.id);
  if (order.length < s.bodies.length) {
    for (let g = s.eliminations.length - 1; g >= 0; g--) order.push(...s.eliminations[g]);
  }
  const list = $('hpList');
  const cur = Array.from(list.children);
  if (order.some((id, k) => cur[k] !== hpRows.get(id).row)) {
    for (const id of order) list.appendChild(hpRows.get(id).row);
  }
}

// ===== 상태 / 스킬 버튼 =====
function fmtTime(sec) {
  const s = Math.floor(sec);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function renderStatus() {
  const s = state.sim, st = $('status'), sub = $('statusSub');
  let main = '', minor = '', danger = false;
  if (state.phase === 'select') {
    main = state.lineup.length < MIN_BALLS ? t('needTwo') : t('pressStart');
    minor = state.mode === 'play' ? t('playHint') : '';
  } else {
    const alive = s.bodies.filter(b => b.alive).length;
    if (state.phase === 'over') {
      main = s.result.winnerId ? tf('win', { name: fullName(s.bodies[s.result.winnerId - 1]) }) : t('draw');
    } else {
      main = tf('alive', { a: alive, n: s.total });
      if (state.phase === 'paused') main = t('paused') + ' · ' + main;
    }
    minor = fmtTime(s.time);
    if (s.suddenDeath) { minor += ' · ' + t('suddenDeath'); danger = true; }
  }
  setText(st, main);
  setText(sub, minor);
  sub.classList.toggle('danger', danger);
}
function renderSkill() {
  const btn = $('skillBtn');
  btn.classList.toggle('hidden', state.mode !== 'play');
  if (state.mode !== 'play') return;
  const s = state.sim;
  let label = t('skill'), p = 0, ready = false, enabled = false;
  if (state.myIndex >= 0 && state.lineup[state.myIndex]) {
    if (state.phase === 'select' || !s) {
      label = t(TYPES[state.lineup[state.myIndex]].skill);
    } else {
      const b = s.bodies[state.myIndex];
      const sk = b ? t(TYPES[b.type].skill) : '';
      if (!b || s.manualId !== b.id) label = t('skill');
      else if (!b.alive) label = t('myOut');
      else if (state.phase === 'over') label = sk;
      else if (b.cd <= 0) {
        label = sk + ' · ' + t('ready');
        p = 1;
        ready = state.phase === 'running';
        enabled = state.phase === 'running';
      } else {
        label = sk + ' ' + b.cd.toFixed(1) + 's';
        p = 1 - b.cd / b.cdMax;
        enabled = state.phase === 'running'; // 쿨 중 입력은 무시
      }
    }
  }
  setText(btn, label);
  btn.style.setProperty('--p', clamp(p, 0, 1).toFixed(3));
  btn.classList.toggle('ready', ready);
  btn.disabled = !enabled;
}

function renderControls() {
  const n = state.lineup.length, ed = editable();
  setText($('lineupCount'), n + ' / ' + MAX_BALLS);
  setText($('lineupHint'), n < MIN_BALLS ? t('needTwo') : n >= MAX_BALLS ? t('maxReached') : '');
  $('addBar').querySelectorAll('.add-btn').forEach(b => { b.disabled = !ed || n >= MAX_BALLS; });
  $('clearBtn').disabled = !ed || !n;
  $('lineup').querySelectorAll('.li-del').forEach(b => { b.disabled = !ed; });

  const modeSeg = $('modeSeg');
  modeSeg.classList.toggle('disabled', inBattle());
  modeSeg.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === state.mode);
    b.disabled = inBattle();
  });
  $('speedSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', parseFloat(b.dataset.v) === state.speed));
  $('mySelect').classList.toggle('hidden', state.mode !== 'play');
  $('myField').classList.toggle('hidden', state.mode !== 'play');
  renderMySelect();

  $('startBtn').disabled = state.phase !== 'select' || n < MIN_BALLS;
  $('pauseBtn').disabled = !inBattle();
  $('skipBtn').disabled = !inBattle();
  setText($('pauseBtn'), state.phase === 'paused' ? t('resume') : t('pause'));
  $('restartBtn').disabled = state.phase === 'select' || n < MIN_BALLS;
  $('ovRestart').disabled = n < MIN_BALLS;
}

function renderOverlay() {
  const ov = $('overlay');
  if (state.phase !== 'over') { ov.classList.remove('show'); return; }
  const s = state.sim;
  setText($('ovTitle'), s.result.winnerId ? tf('win', { name: fullName(s.bodies[s.result.winnerId - 1]) }) : t('draw'));
  const ol = $('ovRank');
  ol.textContent = '';
  for (const { b, rank } of standings(s)) {
    const li = document.createElement('li');
    const rk = document.createElement('span');
    rk.className = 'rk';
    rk.textContent = tf('rank', { n: rank });
    const dot = document.createElement('span');
    dot.className = 'li-dot' + (b.dupIndex === 2 ? ' dup2' : b.dupIndex >= 3 ? ' dup3' : '');
    dot.style.background = 'var(--c-' + b.type + ')';
    const nm = document.createElement('span');
    nm.textContent = fullName(b);
    li.append(rk, dot, nm);
    ol.appendChild(li);
  }
  ov.classList.add('show');
}

function updateUI() {
  // 모바일 하단 도크 CSS용
  document.body.classList.toggle('in-battle', inBattle());
  document.body.classList.toggle('mode-play', state.mode === 'play');
  renderControls();
  renderStatus();
  renderHp();
  renderSkill();
  renderOverlay();
  dirty = true;
}

// ===== 단계 전환 =====
function makePreview() {
  weapons = new Map();
  state.sim = state.lineup.length ? createBattle(state.lineup, urlSeed !== null ? urlSeed : PREVIEW_SEED) : null;
  particles = [];
  buildHpRows();
}
function toSelect() {
  state.phase = 'select';
  makePreview();
  updateUI();
}
function startBattle() {
  if (state.lineup.length < MIN_BALLS) return;
  state.seed = urlSeed !== null ? urlSeed : (Math.random() * 4294967296) >>> 0;
  state.sim = createBattle(state.lineup, state.seed);
  state.sim.manualId = state.mode === 'play' && state.myIndex >= 0 ? state.myIndex + 1 : 0;
  state.phase = 'running';
  particles = [];
  weapons = new Map();
  clearInput();
  acc = 0;
  lastTs = null;
  buildHpRows();
  updateUI();
}
function togglePause() {
  if (state.phase === 'running') state.phase = 'paused';
  else if (state.phase === 'paused') { state.phase = 'running'; lastTs = null; }
  else return;
  updateUI();
}
// 결과 바로 보기: 렌더 없이 같은 sim을 고정 스텝으로 끝까지 진행. 직접 모드의 내 공은 자동 AI로 넘김
const SKIP_MAX_STEPS = Math.round(300 / DT);
function skipToResult() {
  if (!inBattle()) return;
  const s = state.sim;
  s.manualId = 0;
  s.manualReq = false;
  for (let n = 0; !s.result && n < SKIP_MAX_STEPS; n++) step(s);
  if (!s.result) forceResult(s);
  s.events.length = 0;
  particles = [];
  acc = 0;
  finish();
}
function finish() {
  state.phase = 'over';
  clearInput();
  updateUI();
  const wrap = document.querySelector('.arena-wrap'), r = wrap.getBoundingClientRect();
  if (r.top < 0 || r.bottom > window.innerHeight) wrap.scrollIntoView({ block: 'center' });
  $('ovRestart').focus({ preventScroll: true });
}
function afterEdit(focusIndex) {
  saveSettings();
  if (state.phase === 'over') state.phase = 'select';
  makePreview();
  renderLineup(focusIndex);
  updateUI();
}
function addBall(type) {
  if (!editable() || state.lineup.length >= MAX_BALLS || !TYPES[type]) return;
  state.lineup.push(type);
  if (state.myIndex < 0) state.myIndex = 0;
  const fromAdd = document.activeElement && document.activeElement.classList.contains('add-btn');
  afterEdit();
  // 추가 버튼이 모두 비활성되면 포커스가 body로 빠지지 않게
  if (fromAdd && state.lineup.length >= MAX_BALLS) {
    const dels = $('lineup').querySelectorAll('.li-del');
    (dels.length ? dels[dels.length - 1] : $('clearBtn')).focus();
  }
}
function removeBall(i) {
  if (!editable() || i < 0 || i >= state.lineup.length) return;
  state.lineup.splice(i, 1);
  if (!state.lineup.length) state.myIndex = -1;
  else if (i === state.myIndex) state.myIndex = 0;
  else if (i < state.myIndex) state.myIndex--;
  afterEdit(i);
}
function clearAll() {
  if (!editable() || !state.lineup.length) return;
  state.lineup = [];
  state.myIndex = -1;
  afterEdit();
}
function useMySkill() {
  if (state.phase !== 'running' || state.mode !== 'play') return;
  if (requestManual(state.sim)) renderSkill();
}

// ===== 메인 루프 (rAF + accumulator에 실제 dt×speed, 고정 스텝, 프레임당 최대 ceil(5×speed) 스텝) =====
let lastTs = null, acc = 0, lastUi = 0, lastFrame = null;
function frame(ts) {
  requestAnimationFrame(frame);
  const fdt = lastFrame === null ? 0 : Math.min((ts - lastFrame) / 1000, 0.1);
  lastFrame = ts;
  const s = state.sim;
  if (state.phase === 'running' && s) {
    holdCheck();
    if (lastTs === null) lastTs = ts;
    const real = Math.min((ts - lastTs) / 1000, 0.25);
    lastTs = ts;
    acc += real * state.speed;
    const cap = Math.ceil(5 * state.speed);
    let n = 0;
    while (acc >= DT && n < cap && !s.result) { s.steer = steerInput(s); step(s); acc -= DT; n++; }
    if (n >= cap) acc = Math.min(acc, DT);
    drainEvents(s);
    updateParticles(fdt * state.speed);
    updateWeapons(s, fdt * state.speed);
    dirty = true;
    if (s.result) finish();
    else if (ts - lastUi >= 100) { lastUi = ts; renderStatus(); renderHp(); renderSkill(); }
  } else if (state.phase !== 'paused' && particles.length) {
    updateParticles(fdt);
    dirty = true;
  }
  if (dirty) { draw(); dirty = false; }
}

// ===== 이벤트 =====
$('addBar').addEventListener('click', e => {
  const b = e.target.closest('.add-btn');
  if (b && !b.disabled) addBall(b.dataset.type);
});
$('lineup').addEventListener('click', e => {
  const b = e.target.closest('.li-del');
  if (b && !b.disabled) removeBall(+b.dataset.i);
});
$('clearBtn').addEventListener('click', clearAll);
$('modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled || inBattle() || b.dataset.v === state.mode) return;
  state.mode = b.dataset.v;
  saveSettings();
  updateUI();
});
$('speedSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const v = parseFloat(b.dataset.v);
  state.speed = SPEEDS.includes(v) ? v : 1;
  saveSettings();
  renderControls();
});
$('mySelect').addEventListener('change', e => {
  const v = +e.target.value;
  if (inBattle() || !(v >= 0 && v < state.lineup.length)) return;
  state.myIndex = v;
  saveSettings();
  updateUI();
});
$('startBtn').addEventListener('click', () => { if (state.phase === 'select') startBattle(); });
$('pauseBtn').addEventListener('click', togglePause);
$('skipBtn').addEventListener('click', skipToResult);
$('restartBtn').addEventListener('click', () => { if (state.phase !== 'select') startBattle(); });
$('ovRestart').addEventListener('click', startBattle);
$('ovSelect').addEventListener('click', toSelect);
$('skillBtn').addEventListener('click', useMySkill);
// ===== 직접 이동 입력 (sim 밖에서 보관 → 스텝마다 sim.steer로 전달) =====
const TAP_MS = 200, TAP_MOVE = 10;   // 짧은 탭 판정: 200ms 미만, 10px 미만 이동
const keysDown = new Set();
const STEER_KEYS = { KeyW: [0, -1], KeyA: [-1, 0], KeyS: [0, 1], KeyD: [1, 0], ArrowUp: [0, -1], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowRight: [1, 0] };
const pointers = new Map();          // pointerId → { x0, y0, t0, x, y, steer }
let steerPointerId = null;           // 조향 중인 포인터 (첫 손가락)
const playActive = () => state.phase === 'running' && state.mode === 'play';
// 화면 좌표 → 논리 좌표
function toArena(e) {
  const r = canvas.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * ARENA, y: ((e.clientY - r.top) / r.height) * ARENA };
}
// 현재 입력 방향: 포인터 조향(공 → 포인터 위치)이 우선, 없으면 키보드
function steerInput(sim) {
  const me = sim && sim.manualId ? sim.bodies[sim.manualId - 1] : null;
  if (!me || !me.alive) return null;
  const p = steerPointerId !== null ? pointers.get(steerPointerId) : null;
  if (p && p.steer) {
    const a = toArenaXY(p.x, p.y), dx = a.x - me.x, dy = a.y - me.y;
    if (Math.hypot(dx, dy) > me.r * 0.5) return { dx, dy };
    return null;
  }
  let dx = 0, dy = 0;
  for (const k of keysDown) { const v = STEER_KEYS[k]; if (v) { dx += v[0]; dy += v[1]; } }
  return dx || dy ? { dx, dy } : null;
}
function toArenaXY(cx, cy) { return toArena({ clientX: cx, clientY: cy }); }
function clearInput() {
  keysDown.clear();
  pointers.clear();
  steerPointerId = null;
}
canvas.addEventListener('pointerdown', e => {
  if (!playActive()) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t0: performance.now(), steer: false });
  if (steerPointerId === null) steerPointerId = e.pointerId;
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (e.pointerId === steerPointerId && !p.steer && Math.hypot(p.x - p.x0, p.y - p.y0) >= TAP_MOVE) p.steer = true;
});
function endPointer(e, cancelled) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  const tap = !cancelled && !p.steer && performance.now() - p.t0 < TAP_MS && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) < TAP_MOVE;
  if (e.pointerId === steerPointerId) steerPointerId = null;
  if (tap) useMySkill();
  dirty = true;
}
canvas.addEventListener('pointerup', e => endPointer(e, false));
canvas.addEventListener('pointercancel', e => endPointer(e, true));
// 터치 드래그 중 페이지 스크롤 방지 (직접 모드 전투 중에만)
canvas.addEventListener('touchmove', e => { if (playActive() && e.cancelable) e.preventDefault(); }, { passive: false });
// 누르고 있으면(200ms 이상) 움직이지 않아도 조향 시작
function holdCheck() {
  const p = steerPointerId !== null ? pointers.get(steerPointerId) : null;
  if (p && !p.steer && performance.now() - p.t0 >= TAP_MS) p.steer = true;
}
const typingTarget = e => e.target.closest && e.target.closest('select, input, textarea');
document.addEventListener('keydown', e => {
  if (!STEER_KEYS[e.code] || typingTarget(e)) return;
  if (!playActive()) return;
  e.preventDefault(); // 방향키 스크롤 막기
  keysDown.add(e.code);
});
document.addEventListener('keyup', e => { keysDown.delete(e.code); });
window.addEventListener('blur', clearInput);
// 직접 모드 전투 중 Space = 스킬. 포커스된 버튼의 기본 동작(keyup 클릭)도 막는다. 입력 요소는 제외
const spaceIsSkill = e =>
  (e.code === 'Space' || e.key === ' ') && state.phase === 'running' && state.mode === 'play' &&
  !(e.target.closest && e.target.closest('select, input, textarea'));
document.addEventListener('keydown', e => {
  if (!spaceIsSkill(e)) return;
  e.preventDefault();
  if (!e.repeat) useMySkill();
});
document.addEventListener('keyup', e => { if (spaceIsSkill(e)) e.preventDefault(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearInput();
  if (document.hidden && state.phase === 'running') togglePause();
});

for (const code of Object.keys(I18N)) {
  const o = document.createElement('option');
  o.value = code;
  o.textContent = I18N[code].name;
  $('lang').appendChild(o);
}
$('lang').addEventListener('change', e => {
  lang = e.target.value;
  saveSettings();
  applyLang();
  renderLineup();
  buildHpRows();
  updateUI();
});

// 테마 변경 → 색 캐시 재로딩
const onScheme = () => loadColors();
if (darkMQ.addEventListener) darkMQ.addEventListener('change', onScheme);
else if (darkMQ.addListener) darkMQ.addListener(onScheme);
new MutationObserver(loadColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener('resize', resizeCanvas);

loadColors();
resizeCanvas();
applyLang();
renderLineup();
toSelect();
requestAnimationFrame(frame);
</script>
</body>
</html>
