<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공 배틀</title>
<script>/* 화면 배치(mobile|pc)를 첫 그리기 전에 적용 → 깜빡임 방지. 사이트 공통 키 'games-layout'.
   저장값이 없으면 폭 820px 이하 = mobile, 그보다 넓으면 pc (저장은 버튼 클릭 시 본문 스크립트가 한다).
   좁은 기기(screen.width < 1024)에서 PC 배치 = viewport를 width=1280으로 → '데스크톱 사이트'처럼 축소 표시.
   그때 --vp-zoom(= min(1280/screen.width, 3))을 :root 인라인에 넘겨 #layoutSeg 버튼만 손가락 크기로 키운다. 본문 스크립트도 applyLayoutViewport()를 쓴다 */
(function () {
  var vp = document.getElementById('vp');
  var VP_DEFAULT = 'width=device-width, initial-scale=1, viewport-fit=cover', VP_PC = 'width=1280'; // 기본값 = 위 meta 원문
  window.applyLayoutViewport = function (L) {
    var w = 0;
    try { w = screen.width; } catch (e) {}
    var zoom = L === 'pc' && w > 0 && w < 1024, want = zoom ? VP_PC : VP_DEFAULT, st = document.documentElement.style;
    if (vp.getAttribute('content') !== want) vp.setAttribute('content', want);
    if (zoom) st.setProperty('--vp-zoom', String(Math.min(1280 / w, 3)));
    else st.removeProperty('--vp-zoom');
  };
  var L = null;
  try { L = localStorage.getItem('games-layout'); } catch (e) {}
  if (L !== 'pc' && L !== 'mobile') {
    try { L = (matchMedia('(max-width: 820px)').matches || (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 820)) ? 'mobile' : 'pc'; } catch (e) { L = 'mobile'; }
  }
  document.documentElement.dataset.layout = L;
  window.applyLayoutViewport(L);
})();
// ===== [공유] UI 테마 head 시작 =====
// 첫 렌더 전에 html[data-ui] 적용(깜빡임 방지). 사이트 공통 키 games-ui-theme = classic|gameboy|neon|famicom
(function(){var v;try{v=localStorage.getItem('games-ui-theme')}catch(e){}
document.documentElement.setAttribute('data-ui',(v==='gameboy'||v==='neon'||v==='famicom')?v:'classic');
})();
// ===== [공유] UI 테마 head 끝 =====
// 페이지 진입 와이프(html.gx-enter) — 본문 스크립트의 GxUI.enter() 가 300ms 뒤에 걷음
document.documentElement.classList.add('gx-enter');
</script>

    --gold: #ffc94d; --gold-hi: #ffe08a; --gold-lo: #e09a1a; --ray: rgba(255, 201, 77, .16);
    --av-red: #e04848; --av-orange: #f08c2a; --av-yellow: #e8c020; --av-green: #3fae4a; --av-cyan: #2bb8c8; --av-blue: #3a6ee8; --av-purple: #8a52e0; --av-pink: #e85aa8; --av-white: #ffffff;
  }
  /* ===== UI 테마 팔레트 (html[data-ui], 사이트 공통 키 games-ui-theme) =====
     classic = 위 기본값(덮어쓰지 않음). 각 테마는 UI 토큰만 바꾼다. 라이트 1곳 + 다크 2곳(같은 값).
     .ui-sw[data-v] 미리보기 칸도 같은 값으로 자기 토큰을 덮어써서 현재 테마와 상관없이 그 테마 색을 보여 준다. */
  :root[data-ui="gameboy"], .ui-sw[data-v="gameboy"] {
    --primary: #306230; --primary-hi: #4a7f3a; --primary-lo: #0f380f; --primary-text: #e0f8d0;
    --hud-bg: #0f380f; --hud-text: #e0f8d0; --hud-muted: #9bbc0f; --hud-edge: #071c07;
    --frame: #8bac0f; --glow: rgba(139, 172, 15, .45);
    --title-from: #9bbc0f; --title-to: #306230; --title-edge: #0f380f;
  }
  :root[data-ui="neon"], .ui-sw[data-v="neon"] {
    --primary: #7b2ff7; --primary-hi: #9a5cff; --primary-lo: #4a10a8; --primary-text: #ffffff;
    --hud-bg: #1a0b2e; --hud-text: #f0e6ff; --hud-muted: #c3a6ff; --hud-edge: #0a0414;
    --frame: #c3a6ff; --glow: rgba(0, 229, 255, .40);
    --title-from: #00b8d4; --title-to: #7b2ff7; --title-edge: #2a0a5e;
  }
  :root[data-ui="famicom"], .ui-sw[data-v="famicom"] {
    --primary: #b21f2d; --primary-hi: #d23a46; --primary-lo: #6e0f18; --primary-text: #ffffff;
    --hud-bg: #3a3a3a; --hud-text: #f2ead8; --hud-muted: #c8bea8; --hud-edge: #1a1a1a;
    --frame: #c8bea8; --glow: rgba(178, 31, 45, .35);
    --title-from: #d23a46; --title-to: #8a1420; --title-edge: #3a0a0f;
  }
  /* 미리보기 칸 classic: 현재 테마가 무엇이든 기본값 */
  .ui-sw[data-v="classic"] {
    --primary: #b93a0a; --primary-hi: #c94a10; --primary-lo: #7a2606; --primary-text: #fff;
    --hud-bg: #2b2238; --hud-text: #f4ead2; --hud-muted: #b9ab90; --hud-edge: #0f0b14;
    --frame: #d8c9ad; --glow: rgba(217, 83, 26, .35);
    --title-from: #d9531a; --title-to: #8b5e34; --title-edge: #5e3d1f;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-ui="gameboy"]:not([data-theme="light"]), :root:not([data-theme="light"]) .ui-sw[data-v="gameboy"] {
      --primary: #8bac0f; --primary-hi: #9bbc0f; --primary-lo: #306230; --primary-text: #0f380f;
      --hud-bg: #0f380f; --hud-text: #e0f8d0; --hud-muted: #9bbc0f; --hud-edge: #071c07;
      --frame: #8bac0f; --glow: rgba(139, 172, 15, .45);
      --title-from: #e0f8d0; --title-to: #9bbc0f; --title-edge: #0f380f;
    }
    :root[data-ui="neon"]:not([data-theme="light"]), :root:not([data-theme="light"]) .ui-sw[data-v="neon"] {
      --primary: #00e5ff; --primary-hi: #6ff6ff; --primary-lo: #008ba3; --primary-text: #0a0414;
      --hud-bg: #12061f; --hud-text: #f0e6ff; --hud-muted: #c3a6ff; --hud-edge: #0a0414;
      --frame: #4a2a7a; --glow: rgba(0, 229, 255, .40);
      --title-from: #6ff6ff; --title-to: #ff4fd8; --title-edge: #2a0a5e;
    }
    :root[data-ui="famicom"]:not([data-theme="light"]), :root:not([data-theme="light"]) .ui-sw[data-v="famicom"] {
      --primary: #ff5a66; --primary-hi: #ff8a92; --primary-lo: #a8202c; --primary-text: #1a1a1a;
      --hud-bg: #222222; --hud-text: #f2ead8; --hud-muted: #c8bea8; --hud-edge: #1a1a1a;
      --frame: #4a4440; --glow: rgba(178, 31, 45, .35);
      --title-from: #ffd27a; --title-to: #ff5a66; --title-edge: #3a0a0f;
    }
    :root:not([data-theme="light"]) .ui-sw[data-v="classic"] {
      --primary: #ff8a3d; --primary-hi: #ffa766; --primary-lo: #a8460f; --primary-text: #1c1a17;
      --hud-bg: #17121f; --hud-text: #f4ead2; --hud-muted: #a89c86; --hud-edge: #000000;
      --frame: #4a4339; --glow: rgba(255, 138, 61, .35);
      --title-from: #ffd27a; --title-to: #ff8a3d; --title-edge: #5a2a0a;
    }
  }
  :root[data-ui="gameboy"][data-theme="dark"], :root[data-theme="dark"] .ui-sw[data-v="gameboy"] {
    --primary: #8bac0f; --primary-hi: #9bbc0f; --primary-lo: #306230; --primary-text: #0f380f;
    --hud-bg: #0f380f; --hud-text: #e0f8d0; --hud-muted: #9bbc0f; --hud-edge: #071c07;
    --frame: #8bac0f; --glow: rgba(139, 172, 15, .45);
    --title-from: #e0f8d0; --title-to: #9bbc0f; --title-edge: #0f380f;
  }
  :root[data-ui="neon"][data-theme="dark"], :root[data-theme="dark"] .ui-sw[data-v="neon"] {
    --primary: #00e5ff; --primary-hi: #6ff6ff; --primary-lo: #008ba3; --primary-text: #0a0414;
    --hud-bg: #12061f; --hud-text: #f0e6ff; --hud-muted: #c3a6ff; --hud-edge: #0a0414;
    --frame: #4a2a7a; --glow: rgba(0, 229, 255, .40);
    --title-from: #6ff6ff; --title-to: #ff4fd8; --title-edge: #2a0a5e;
  }
  :root[data-ui="famicom"][data-theme="dark"], :root[data-theme="dark"] .ui-sw[data-v="famicom"] {
    --primary: #ff5a66; --primary-hi: #ff8a92; --primary-lo: #a8202c; --primary-text: #1a1a1a;
    --hud-bg: #222222; --hud-text: #f2ead8; --hud-muted: #c8bea8; --hud-edge: #1a1a1a;
    --frame: #4a4440; --glow: rgba(178, 31, 45, .35);
    --title-from: #ffd27a; --title-to: #ff5a66; --title-edge: #3a0a0f;
  }
  :root[data-theme="dark"] .ui-sw[data-v="classic"] {
    --primary: #ff8a3d; --primary-hi: #ffa766; --primary-lo: #a8460f; --primary-text: #1c1a17;
    --hud-bg: #17121f; --hud-text: #f4ead2; --hud-muted: #a89c86; --hud-edge: #000000;
    --frame: #4a4339; --glow: rgba(255, 138, 61, .35);
    --title-from: #ffd27a; --title-to: #ff8a3d; --title-edge: #5a2a0a;
  }

  /* =====================================================================
     단계(phase) = 화면. JS: document.body.dataset.phase = 'select'|'running'|'paused'|'over'
     data-phase 가 아직 없으면 기존 body 클래스로 대신 판단한다:
       S(준비)  = [data-phase=select]  또는 (속성 없음 + .in-battle 아님)  → 기본 화면
       B(전투계) = running|paused|over 또는 (속성 없음 + .in-battle)
       R(진행중) = running|paused       또는 (속성 없음 + .in-battle)
       P(일시정지)= paused               또는 (속성 없음 + .paused)
     ===================================================================== */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background-color: var(--page-bg);
    background-image:
      repeating-linear-gradient(0deg, var(--scanline) 0 1px, transparent 1px 3px),
      radial-gradient(var(--pattern) 0 1.5px, transparent 1.5px);
    background-size: 100% 3px, 22px 22px;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    touch-action: manipulation;
  }
  [hidden] { display: none !important; }
  .hidden { display: none !important; }
  .sr-only {
    position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .num, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "D2Coding", monospace; font-variant-numeric: tabular-nums; }

  /* 포커스: 픽셀 느낌 3px 실선, 바깥 외곽선(4px) 밖으로 */
  :focus-visible { outline: 3px solid var(--focus); outline-offset: calc(var(--px) + 2px); }
  :focus:not(:focus-visible) { outline: none; }

  /* ===== 화면 전환 (페이지 진입/퇴장, 250ms, steps) ===== */
  @keyframes gx-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes gx-fade-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes gx-wipe-in { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes gx-pop-in { 0% { transform: scale(.6); opacity: 0; } 50% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes gx-blink { 50% { opacity: 0; } }
  @keyframes gx-cursor { 50% { transform: translateX(3px); } }
  @keyframes gx-spin { to { transform: rotate(360deg); } }
  @keyframes gx-count {
    0% { transform: translate(-50%, -50%) scale(1.9); opacity: 0; }
    40% { transform: translate(-50%, -50%) scale(.92); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  @keyframes gx-flash { 50% { background-color: var(--gold-hi); } }
  @keyframes gx-ready { 50% { background-color: var(--primary-hi); } }
  html.gx-enter .app { animation: gx-fade-in .25s steps(5) both; }
  html.gx-leave .app { animation: gx-fade-out .25s steps(5) both; }

  /* ===== 픽셀 버튼 (.gx-btn 및 기존 button.btn 공통) ===== */
  .gx-btn, button.btn {
    position: relative;
    font: inherit; font-size: 15px; font-weight: 900; letter-spacing: .06em; line-height: 1.2;
    min-height: 44px; padding: 10px 14px; margin: 0;
    border: 0; border-radius: 0;
    color: var(--text); background: var(--btn);
    box-shadow: var(--pxo), inset 0 calc(-1 * var(--px)) 0 0 var(--btn-edge), inset 0 var(--px) 0 0 var(--btn-hi);
    cursor: pointer; overflow-wrap: anywhere;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  .gx-btn.primary, button.btn.primary {
    background: var(--primary); color: var(--primary-text);
    box-shadow: var(--pxo), inset 0 calc(-1 * var(--px)) 0 0 var(--primary-lo), inset 0 var(--px) 0 0 var(--primary-hi);
  }
  .gx-btn:not(:disabled):active, button.btn:not(:disabled):active {
    transform: translateY(var(--px));
    box-shadow: var(--pxo), inset 0 var(--px) 0 0 var(--btn-edge);
  }
  .gx-btn.primary:not(:disabled):active, button.btn.primary:not(:disabled):active {
    box-shadow: var(--pxo), inset 0 var(--px) 0 0 var(--primary-lo);
  }
  .gx-btn:disabled, button.btn:disabled { opacity: .5; cursor: default; }
  button.btn.small, .gx-btn.small { font-size: 13px; padding: 6px 10px; letter-spacing: .03em; }
  /* 2단계 확인(나가기 등): JS가 data-confirm 을 붙이면 빨간 버튼 */
  .gx-btn[data-confirm] {
    background: var(--lose); color: var(--primary-text);
    box-shadow: var(--pxo), inset 0 calc(-1 * var(--px)) 0 0 var(--ink), inset 0 var(--px) 0 0 var(--lose);
  }

  /* ===== 아이콘 버튼 (HUD) ===== */
  .gx-icon {
    position: relative; flex: none;
    width: 44px; height: 44px; min-width: 44px; padding: 0; margin: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font: inherit; font-size: 14px; font-weight: 900; letter-spacing: .04em; line-height: 1;
    color: var(--hud-text); background: transparent;
    border: 0; border-radius: 0; cursor: pointer;
    box-shadow: inset 0 0 0 2px var(--hud-muted), inset 0 calc(-1 * var(--px)) 0 0 var(--hud-edge);
    -webkit-tap-highlight-color: transparent;
  }
  .gx-icon svg { width: 22px; height: 22px; fill: currentColor; display: block; }
  .gx-icon:not(:disabled):active { background: var(--hud-edge); transform: translateY(2px); }
  .gx-icon:disabled { opacity: .45; cursor: default; }
  .gx-icon.wide { width: auto; min-width: 52px; padding: 0 8px; }
  .gx-icon[aria-expanded="true"] { background: var(--primary); color: var(--primary-text); box-shadow: inset 0 calc(-1 * var(--px)) 0 0 var(--primary-lo); }
  /* 소리: aria-pressed=false 면 X 표시 */
  #soundBtn .snd-x { display: none; }
  #soundBtn[aria-pressed="false"] .snd-wave { display: none; }
  #soundBtn[aria-pressed="false"] .snd-x { display: inline; }
  #soundBtn[aria-pressed="false"] { color: var(--hud-muted); }
  /* 일시정지 버튼: JS가 글자(일시정지/재개)를 넣는다 → 글자는 접근성 이름, 화면엔 픽셀 아이콘 */
  #pauseBtn { font-size: 0; }
  #pauseBtn::before {
    content: ""; width: 14px; height: 16px; display: block;
    background: linear-gradient(to right, currentColor 0 5px, transparent 5px 9px, currentColor 9px 14px);
  }
  body:is([data-phase="paused"], :not([data-phase]).paused) #pauseBtn::before {
    background: currentColor; width: 14px; height: 16px;
    clip-path: polygon(0 0, 25% 0, 25% 12.5%, 50% 12.5%, 50% 25%, 75% 25%, 75% 37.5%, 100% 37.5%, 100% 62.5%, 75% 62.5%, 75% 75%, 50% 75%, 50% 87.5%, 25% 87.5%, 25% 100%, 0 100%);
  }

  /* ===== 레이아웃 (기본 = 모바일 배치, 준비 화면) =====
     격자 행: HUD / 아레나 미리보기 / 준비 패널(남은 높이, 안에서 스크롤). 전체 높이 100dvh, 페이지 스크롤 없음 */
  .app {
    position: relative;
    height: 100vh; height: 100dvh;
    max-width: 480px; margin: 0 auto;
    display: grid; gap: 10px;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "hud" "board" "prep";
    align-items: stretch;
    padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    overflow: hidden;
  }
  .back { display: none; }

  /* ===== HUD: [메뉴/일시정지 · 제목] [상태] [전투 현황 · 속도 · 소리] ===== */
  .gx-hud {
    grid-area: hud; container: hud / inline-size;
    position: relative; z-index: 31;
    display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 52px;
    padding: 4px 6px 8px;
    margin: var(--px);
    background: var(--hud-bg); color: var(--hud-text);
    box-shadow: var(--pxo), inset 0 calc(-1 * var(--px)) 0 0 var(--hud-edge);
  }
  .hud-left, .hud-right { flex: none; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .hud-status { flex: 1 1 auto; min-width: 0; text-align: center; }
  .hud-title {
    position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    font-size: 18px; font-weight: 900; letter-spacing: .06em; color: var(--title-from);
    text-shadow: 2px 2px 0 var(--hud-edge), 4px 4px 0 var(--title-edge);
  }
  @container hud (min-width: 640px) {
    .hud-title { position: static; width: auto; height: auto; margin: 0 4px 0 6px; overflow: visible; clip: auto; }
  }
  .status {
    font-size: 15px; font-weight: 900; letter-spacing: .04em; line-height: 19px; min-height: 19px;
    color: var(--hud-text); text-shadow: 2px 2px 0 var(--hud-edge);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
    overflow-wrap: anywhere;
  }
  .status-sub {
    font-size: 12px; line-height: 15px; margin-top: 1px; color: var(--hud-muted);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  .status-sub:empty { display: none; }
  .status-sub.danger { color: var(--gold-hi); font-weight: 900; animation: gx-blink .5s steps(2) 6; }
  /* 전투 중: 상태 1줄, 시간은 고정폭 숫자 */
  body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .status { -webkit-line-clamp: 1; line-clamp: 1; }
  body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .status-sub {
    -webkit-line-clamp: 1; line-clamp: 1; font-size: 13px;
    font-family: ui-monospace, "Cascadia Mono", Consolas, "D2Coding", monospace;
  }
  .gx-hud :focus-visible { outline-color: var(--gold-hi); outline-offset: 2px; }
  /* 단계별 HUD 버튼: 준비/결과 = 메뉴(☰), 전투 중 = 일시정지·속도·전투 현황 */
  #pauseBtn, #speedBtn, .tool-group { display: none; }
  body:is([data-phase="running"], [data-phase="paused"], :not([data-phase]).in-battle) #menuBtn { display: none; }
  body:is([data-phase="running"], [data-phase="paused"], :not([data-phase]).in-battle) #pauseBtn,
  body:is([data-phase="running"], [data-phase="paused"], :not([data-phase]).in-battle) #speedBtn { display: inline-flex; }
  #speedBtn { font-family: ui-monospace, "Cascadia Mono", Consolas, "D2Coding", monospace; font-variant-numeric: tabular-nums; }
  .tool-group { gap: 6px; }
  /* 전투 현황 시트 버튼(#hpBtn, .tool[data-panel=battle]): 모바일 배치 전투 화면에서만 */
  :root:not([data-layout="pc"]) body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .tool-group { display: flex; }

  /* ===== 프로필 칩 (.gx-profile = 아바타 + 이름). renderAvatar 가 .gx-avatar 안에 8×8 SVG(rect.av-x/.av-o/.av-w), data-av-color 로 색 ===== */
  .gx-profile {
    display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%;
    font-weight: 900; letter-spacing: .04em; font-size: 13px;
  }
  .gx-avatar {
    flex: none; width: 32px; height: 32px; display: block;
    --av-c: var(--av-red);
    background: var(--av-c);
    box-shadow: var(--pxo2);
    image-rendering: pixelated;
  }
  .gx-avatar:not(:empty) { background: transparent; }
  .gx-avatar svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
  .gx-avatar[data-av-color="orange"] { --av-c: var(--av-orange); }
  .gx-avatar[data-av-color="yellow"] { --av-c: var(--av-yellow); }
  .gx-avatar[data-av-color="green"]  { --av-c: var(--av-green); }
  .gx-avatar[data-av-color="cyan"]   { --av-c: var(--av-cyan); }
  .gx-avatar[data-av-color="blue"]   { --av-c: var(--av-blue); }
  .gx-avatar[data-av-color="purple"] { --av-c: var(--av-purple); }
  .gx-avatar[data-av-color="pink"]   { --av-c: var(--av-pink); }
  .gx-avatar .av-x { fill: var(--av-c); }
  .gx-avatar .av-o { fill: var(--ink); }
  .gx-avatar .av-w { fill: var(--av-white); }
  .gx-profile-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gx-hud .gx-profile { display: none; color: var(--hud-text); margin-left: 6px; max-width: 140px; }
  .gx-hud .gx-avatar { width: 28px; height: 28px; }
  @container hud (min-width: 560px) { .gx-hud .gx-profile { display: inline-flex; } }

  /* ===== 패널(카드) ===== */
  .card {
    background: var(--panel); color: var(--text);
    border: 0; border-radius: 0; padding: 12px; min-width: 0;
    box-shadow: var(--pxo), inset 0 var(--px) 0 0 var(--panel-hi), inset 0 calc(-1 * var(--px)) 0 0 var(--frame);
  }
  .field-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
  .field-head { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .field-head .field-label, .panel-head .field-label {
    margin: 0; font-size: 15px; font-weight: 900; letter-spacing: .06em; color: var(--text);
  }
  .count {
    font-size: 13px; color: var(--muted);
    font-family: ui-monospace, "Cascadia Mono", Consolas, "D2Coding", monospace; font-variant-numeric: tabular-nums;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .panel-close {
    flex: none; width: 44px; height: 44px; margin: -6px -6px -6px auto; padding: 0;
    border: 0; border-radius: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 22px; font-weight: 900; line-height: 1; cursor: pointer;
  }
  .panel-close:active { background: var(--btn-hover); color: var(--text); }
  .field-head > .panel-close { margin: -6px -6px -6px 0; }
  :root[data-layout="pc"] .panel-close, :root[data-layout="pc"] .m-only { display: none; }

  /* ===== 세그먼트 (픽셀 탭) ===== */
  .seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    margin: 2px; padding: 0; gap: 0; border: 0; border-radius: 0;
    background: var(--btn);
    box-shadow: var(--pxo2), inset 0 -3px 0 0 var(--btn-edge);
  }
  .seg button {
    font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .02em;
    border: 0; border-radius: 0; background: transparent; color: var(--text);
    padding: 9px 4px; min-height: 44px; cursor: pointer; white-space: normal; line-height: 1.2; min-width: 0;
  }
  .seg button + button { box-shadow: inset 2px 0 0 0 var(--btn-edge); }
  .seg button.on { background: var(--primary); color: var(--primary-text); font-weight: 900; box-shadow: inset 0 -3px 0 0 var(--primary-lo); }
  .seg button:disabled { opacity: .45; cursor: default; }
  .seg button:focus-visible { outline-offset: -3px; position: relative; z-index: 1; }
  .seg.disabled button.on { background: var(--btn-hover); color: var(--muted); opacity: 1; box-shadow: inset 0 0 0 2px var(--border); }
  .seg button:not(:disabled):not(.on):active { background: var(--btn-hover); }
  #speedSeg button {
    padding: 9px 2px; white-space: nowrap;
    font-family: ui-monospace, "Cascadia Mono", Consolas, "D2Coding", monospace; font-variant-numeric: tabular-nums;
  }
  @media (max-width: 340px) { #speedSeg button { font-size: 12px; padding: 9px 1px; } }
  /* 화면 배치: 선택 표시는 html[data-layout] 기준 */
  #layoutSeg button { min-width: 60px; padding: 9px 10px; white-space: nowrap; }
  :root[data-layout="pc"] #layoutSeg button {
    min-height: calc(44px * var(--vp-zoom, 1)); min-width: max(60px, calc(52px * var(--vp-zoom, 1)));
    font-size: calc(13px * min(var(--vp-zoom, 1), 2.8));
  }
  :root:not([data-layout="pc"]) #layoutSeg button[data-v="mobile"],
  :root[data-layout="pc"] #layoutSeg button[data-v="pc"] { background: var(--primary); color: var(--primary-text); font-weight: 900; box-shadow: inset 0 -3px 0 0 var(--primary-lo); }
  :root:not([data-layout="pc"]) #layoutSeg button[data-v="pc"].on,
  :root[data-layout="pc"] #layoutSeg button[data-v="mobile"].on { background: transparent; color: var(--text); font-weight: 700; box-shadow: inset 2px 0 0 0 var(--btn-edge); }

  /* select 는 16px: iOS 확대 방지 */
  select.lang, select.field {
    font: inherit; font-size: 16px; color: var(--text); background: var(--btn);
    border: 0; border-radius: 0; padding: 8px 10px; min-height: 44px; margin: 2px;
    box-shadow: var(--pxo2), inset 0 -3px 0 0 var(--btn-edge);
  }
  select.field { width: calc(100% - 4px); }
  select:disabled { opacity: .5; }

  /* ===== 설정 한 줄 (.gx-opt): [라벨] [값] / .block = 라벨 위·값 아래 ===== */
  .gx-opt { display: grid; grid-template-columns: minmax(0, 38%) minmax(0, 1fr); align-items: center; gap: 8px 12px; min-width: 0; }
  .gx-opt > .field-label { margin: 0; font-size: 14px; font-weight: 900; letter-spacing: .04em; color: var(--text); }
  .gx-opt.block { grid-template-columns: minmax(0, 1fr); }
  #myField:has(#mySelect.hidden) { display: none; }
  /* ON/OFF 토글: aria-pressed 로 글자 전환 */
  .gx-toggle { justify-self: end; min-width: 96px; }
  .gx-toggle .tg-off { display: none; }
  .gx-toggle[aria-pressed="false"] .tg-on { display: none; }
  .gx-toggle[aria-pressed="false"] .tg-off { display: inline; }
  .gx-toggle[aria-pressed="true"] { background: var(--primary); color: var(--primary-text); box-shadow: var(--pxo), inset 0 calc(-1 * var(--px)) 0 0 var(--primary-lo), inset 0 var(--px) 0 0 var(--primary-hi); }
  /* ◀ 값 ▶ 순환 */
  .gx-cycle { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
  .gx-cycle .cy-arrow { flex: none; color: var(--primary); }
  .gx-cycle .cy-val { flex: 1; min-width: 0; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* UI 테마 4칸 미리보기 */
  .ui-swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 2px; }
  .ui-sw {
    font: inherit; font-size: 12px; font-weight: 700; color: var(--text); background: var(--btn);
    border: 0; border-radius: 0; min-height: 60px; padding: 6px 4px; min-width: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: stretch; gap: 5px; line-height: 1.15; text-align: center;
    box-shadow: var(--pxo2), inset 0 -3px 0 0 var(--btn-edge);
  }
  .ui-sw-chip { display: block; height: 22px; background: linear-gradient(to right, var(--hud-bg) 0 50%, var(--primary) 50% 75%, var(--frame) 75% 100%); box-shadow: inset 0 0 0 2px var(--hud-edge); }
  .ui-sw > span:last-child { overflow-wrap: anywhere; }
  .ui-sw[aria-pressed="true"], .ui-sw.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 5px var(--primary); font-weight: 900; }
  .ui-sw:focus-visible { outline-offset: 6px; }

  /* ===== 배경색 스와치 (설정 시트) ===== */
  .bg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .bg-head .field-label { margin: 0; font-size: 14px; font-weight: 900; letter-spacing: .04em; color: var(--text); }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px; }
  .swatch, .swatch-custom {
    flex: none; width: 44px; height: 44px; padding: 0; margin: 0; border: 0; border-radius: 0;
    cursor: pointer; position: relative; box-shadow: var(--pxo2);
  }
  .swatch { background: var(--sw, var(--bg)); font: inherit; }
  .swatch.default {
    background:
      linear-gradient(135deg, transparent calc(50% - 2px), var(--muted) calc(50% - 2px), var(--muted) calc(50% + 2px), transparent calc(50% + 2px)),
      var(--bg);
  }
  .swatch.on, .swatch-custom.on { box-shadow: var(--pxo2), 0 0 0 4px var(--panel), 0 0 0 7px var(--primary); }
  .swatch:focus-visible { outline-offset: 8px; }
  .swatch-custom { display: inline-block; overflow: hidden; background: var(--btn); }
  .swatch-custom:focus-within { outline: 3px solid var(--focus); outline-offset: 8px; }
  .swatch-custom:has(input:focus:not(:focus-visible)) { outline: none; }
  .swatch-custom input[type="color"] {
    position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px);
    padding: 0; border: 0; background: none; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .swatch-custom input[type="color"]:focus-visible { outline: none; }
  .swatch-custom input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .swatch-custom input[type="color"]::-webkit-color-swatch { border: 0; }
  .swatch-custom input[type="color"]::-moz-color-swatch { border: 0; }
  .swatch-custom::after {
    content: "+"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; line-height: 1; color: var(--text);
    pointer-events: none; text-shadow: 1px 1px 0 var(--panel), -1px -1px 0 var(--panel);
  }
  .swatch-custom.on::after { content: none; }
  .swatch:active, .swatch-custom:active { transform: translateY(2px); }

  /* ===== 아레나 배경 테마 ===== */
  .theme-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 2px; }
  .theme-btn {
    font: inherit; font-size: 12px; font-weight: 700; color: var(--text); background: var(--btn);
    border: 0; border-radius: 0; min-height: 60px; padding: 6px 4px;
    display: flex; flex-direction: column; align-items: stretch; gap: 5px; cursor: pointer;
    line-height: 1.15; min-width: 0; text-align: center;
    box-shadow: var(--pxo2), inset 0 -3px 0 0 var(--btn-edge);
  }
  .theme-btn > span:last-child { overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto; }
  .theme-btn.on { background: var(--primary); color: var(--primary-text); font-weight: 900; box-shadow: var(--pxo2), inset 0 -3px 0 0 var(--primary-lo); }
  .theme-btn:focus-visible { outline-offset: 5px; }
  .theme-btn:active { transform: translateY(2px); }
  .theme-sw {
    display: block; height: 26px; border-radius: 0;
    box-shadow: inset 0 0 0 2px var(--ink);
    background:
      radial-gradient(circle at 76% 30%, var(--pa) 0 3px, transparent 3px),
      radial-gradient(circle at 28% 22%, var(--pa) 0 1.5px, transparent 1.5px),
      linear-gradient(to bottom, var(--p1) 0 30%, var(--p2) 30% 68%, var(--p3) 68% 100%);
  }
  .theme-btn[data-v="city"]    { --p1: var(--sky-top); --p2: var(--bldg-far); --p3: var(--bldg-near); --pa: var(--bldg-window); }
  .theme-btn[data-v="forest"]  { --p1: var(--abg-forest-sky1);  --p2: var(--abg-forest-far);  --p3: var(--abg-forest-near);  --pa: var(--abg-forest-accent); }
  .theme-btn[data-v="desert"]  { --p1: var(--abg-desert-sky1);  --p2: var(--abg-desert-far);  --p3: var(--abg-desert-near);  --pa: var(--abg-desert-accent); }
  .theme-btn[data-v="space"]   { --p1: var(--abg-space-sky1);   --p2: var(--abg-space-far);   --p3: var(--abg-space-near);   --pa: var(--abg-space-accent); }
  .theme-btn[data-v="ocean"]   { --p1: var(--abg-ocean-sky1);   --p2: var(--abg-ocean-far);   --p3: var(--abg-ocean-near);   --pa: var(--abg-ocean-accent); }
  .theme-btn[data-v="volcano"] { --p1: var(--abg-volcano-sky1); --p2: var(--abg-volcano-far); --p3: var(--abg-volcano-near); --pa: var(--abg-volcano-accent); }
  .theme-btn[data-v="snow"]    { --p1: var(--abg-snow-sky1);    --p2: var(--abg-snow-far);    --p3: var(--abg-snow-near);    --pa: var(--abg-snow-accent); }
  .theme-btn[data-v="plain"] .theme-sw { background: var(--arena); }

  /* ===== 아레나 =====
     .arena-wrap 은 격자 칸을 채우는 size 컨테이너, 캔버스 = min(칸 폭, 칸 높이) 정사각형(외곽선 4px 여유).
     준비 화면은 미리보기라 높이를 제한한다. */
  .arena-wrap {
    grid-area: board; position: relative; min-width: 0; min-height: 0;
    display: grid; place-items: center;
    container-type: size;
    height: clamp(120px, 30dvh, 340px);
  }
  canvas#arena {
    display: block;
    width: min(100%, 30vh); height: auto; aspect-ratio: 1 / 1;
    background: var(--arena);
    border-radius: 0;
    box-shadow: var(--pxo);
    image-rendering: pixelated;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  @supports (width: 1cqmin) {
    canvas#arena { width: calc(min(100cqw, 100cqh) - 2 * var(--px)); }
  }
  body.in-battle.mode-play canvas#arena { touch-action: none; }
  body.in-battle.mode-play.paused canvas#arena { touch-action: manipulation; }

  /* ===== 카운트다운 / 토스트 (#gxCountdown: JS가 3·2·1·FIGHT! 글자, hidden 토글, 마지막에 .fight) ===== */
  .gx-toast {
    position: absolute; left: 50%; top: 50%; z-index: 7; transform: translate(-50%, -50%);
    pointer-events: none; white-space: nowrap;
    padding: 6px 22px 10px;
    font-size: 64px; font-weight: 900; letter-spacing: .06em; line-height: 1.1;
    font-family: ui-monospace, "Cascadia Mono", Consolas, "D2Coding", monospace;
    color: var(--gold-hi); background: var(--hud-bg);
    text-shadow: 3px 3px 0 var(--hud-edge);
    box-shadow: var(--pxo), inset 0 calc(-1 * var(--px)) 0 0 var(--hud-edge);
    animation: gx-count .3s steps(3) both;
  }
  @supports (width: 1cqmin) { .gx-toast { font-size: clamp(36px, 16cqmin, 120px); } }
  .gx-toast.fight { color: var(--primary-text); background: var(--primary); text-shadow: 3px 3px 0 var(--primary-lo); box-shadow: var(--pxo), inset 0 calc(-1 * var(--px)) 0 0 var(--primary-lo); }

  /* ===== 준비 화면 (.prep): 모바일 = [탭] / [패널(스크롤)] / [전투 시작] ===== */
  .prep { grid-area: prep; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; animation: gx-wipe-in .2s steps(4) backwards; }
  .prep-tabs { display: none; flex: none; grid-template-columns: 1fr 1fr; gap: 10px; padding: var(--px); }
  .prep[data-tab] .prep-tabs { display: grid; }
  .prep-tab[aria-selected="true"] { background: var(--primary); color: var(--primary-text); box-shadow: var(--pxo), inset 0 calc(-1 * var(--px)) 0 0 var(--primary-lo), inset 0 var(--px) 0 0 var(--primary-hi); }
  .prep-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 14px;
    padding: 10px; margin: -6px -10px 0;
  }
  .prep[data-tab="roster"] #panelControls, .prep[data-tab="settings"] #panelLineup { display: none; }
  .prep-start { flex: none; padding: var(--px) var(--px) calc(var(--px) * 2); }
  #startBtn {
    width: 100%; min-height: 56px; font-size: 20px; letter-spacing: .1em;
    text-shadow: 2px 2px 0 var(--primary-lo);
  }
  #startBtn:not(:disabled)::before {
    content: "\25B6"; display: inline-block; margin-right: 10px; font-size: .8em;
    animation: gx-cursor .6s steps(2) infinite;
  }
  /* 꾸미기 큰 버튼 (#customizeBtn) */
  #customizeBtn { width: 100%; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; font-size: 16px; }
  #customizeBtn svg { width: 24px; height: 24px; flex: none; fill: currentColor; shape-rendering: crispEdges; }

  /* 설정 패널 (#panelControls): 한 줄씩 */
  #panelControls { display: flex; flex-direction: column; gap: 14px; }

  /* ===== 로스터 (공 추가 20칸) ===== */
  .add-bar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 2px; }
  .add-btn {
    font: inherit; font-size: 12px; font-weight: 700; color: var(--text); background: var(--btn);
    border: 0; border-radius: 0; min-height: 56px; padding: 7px 2px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer;
    line-height: 1.1; min-width: 0; text-align: center;
    box-shadow: var(--pxo2), inset 0 -3px 0 0 var(--btn-edge), inset 0 3px 0 0 var(--btn-hi);
    -webkit-tap-highlight-color: transparent;
  }
  .add-btn > span:last-child { max-width: 100%; overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto; }
  .add-btn:disabled { opacity: .45; cursor: default; }
  .add-btn:focus-visible { outline-offset: -3px; }
  .add-btn:not(:disabled):active { transform: translateY(2px); box-shadow: var(--pxo2), inset 0 3px 0 0 var(--btn-edge); }
  /* 공 점: 픽셀 원(계단 모서리) */
  .dot, .li-dot {
    clip-path: polygon(30% 0, 70% 0, 70% 10%, 90% 10%, 90% 30%, 100% 30%, 100% 70%, 90% 70%, 90% 90%, 70% 90%, 70% 100%, 30% 100%, 30% 90%, 10% 90%, 10% 70%, 0 70%, 0 30%, 10% 30%, 10% 10%, 30% 10%);
  }
  .dot { width: 20px; height: 20px; flex: none; border: 2px solid var(--ball-outline); border-radius: 0; }

  /* ===== 출전 슬롯 (#lineup): 타일 격자. 각 타일 = [공 미리보기 | 이름 · ×] / [꾸미기 · 팀] =====
     JS 훅: .li-edit(큰 "꾸미기" 버튼, 글자는 t('customize')), .li-preview(꾸민 모습 캔버스/SVG, 있으면 .li-dot 대신),
     .lineup-item.customized(꾸민 공 표시) */
  #lineup {
    list-style: none; margin: 12px 0 0; padding: 2px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;
  }
  #lineup:empty { display: none; }
  .lineup-item {
    position: relative; min-width: 0;
    display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center;
    grid-template-areas: "dot name del";
    column-gap: 8px; row-gap: 6px; padding: 6px 4px 6px 8px;
    background: var(--panel-hi);
    box-shadow: var(--pxo2), inset 0 -3px 0 0 var(--frame);
  }
  .lineup-item:has(.li-team), .lineup-item:has(.li-edit) { grid-template-areas: "dot name del" "dot edit team"; padding-bottom: 9px; }
  .lineup-item:has(.li-edit):not(:has(.li-team)) { grid-template-areas: "dot name del" "dot edit edit"; }
  .lineup-item:has(.li-team):not(:has(.li-edit)) { grid-template-areas: "dot name del" "dot . team"; }
  .lineup-item:has(.li-edit) { cursor: pointer; }
  .lineup-item.customized { box-shadow: var(--pxo2), inset 0 -3px 0 0 var(--gold); }
  .lineup-item.customized::after {
    content: "\2605"; position: absolute; top: 2px; right: 48px; font-size: 12px; line-height: 1; color: var(--gold);
  }
  .li-num {
    position: absolute; left: 2px; top: 2px; z-index: 1;
    min-width: 16px; padding: 1px 3px; font-size: 10px; line-height: 1.2; text-align: center;
    color: var(--hud-text); background: var(--hud-bg);
    font-family: ui-monospace, "Cascadia Mono", Consolas, "D2Coding", monospace; font-variant-numeric: tabular-nums;
  }
  .li-dot { grid-area: dot; justify-self: center; flex: none; width: 32px; height: 32px; border: 3px solid var(--ball-outline); border-radius: 0; }
  .li-dot.dup2 { border-style: dashed; }
  .li-dot.dup3 { border: 5px double var(--ball-outline); }
  .li-preview { grid-area: dot; justify-self: center; width: 44px; height: 44px; display: block; image-rendering: pixelated; }
  .lineup-item:has(.li-preview) .li-dot { display: none; }
  .li-name { grid-area: name; min-width: 0; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-del {
    grid-area: del; flex: none; width: 44px; height: 44px; border: 0; border-radius: 0; background: transparent;
    color: var(--muted); font: inherit; font-size: 22px; font-weight: 900; line-height: 1; cursor: pointer;
  }
  .li-del:disabled { opacity: .35; cursor: default; }
  .li-del:focus-visible { outline-offset: -3px; }
  .li-edit {
    grid-area: edit; min-width: 0; min-height: 44px; padding: 6px 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font: inherit; font-size: 13px; font-weight: 900; letter-spacing: .04em; line-height: 1.1;
    border: 0; border-radius: 0; cursor: pointer;
    color: var(--primary-text); background: var(--primary);
    box-shadow: var(--pxo2), inset 0 -3px 0 0 var(--primary-lo), inset 0 3px 0 0 var(--primary-hi);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .li-edit:disabled { opacity: .45; cursor: default; }
  .li-edit:focus-visible { outline-offset: 4px; }
  .li-edit:not(:disabled):active { transform: translateY(2px); box-shadow: var(--pxo2), inset 0 3px 0 0 var(--primary-lo); }
  .hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .hint:empty { display: none; }
  .lineup-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-left: auto; padding: 2px; }

  /* ===== 팀전 ===== */
  .t-a { --tc: var(--team-a); }
  .t-b { --tc: var(--team-b); }
  .t-c { --tc: var(--team-c); }
  .t-d { --tc: var(--team-d); }
  .li-team {
    grid-area: team; flex: none; width: 44px; height: 44px; padding: 0; cursor: pointer;
    border: 6px solid transparent; border-radius: 0; background-clip: padding-box;
    background-color: color-mix(in srgb, var(--tc, var(--muted)) 14%, transparent);
    box-shadow: inset 0 0 0 3px var(--tc, var(--muted));
    color: var(--tc, var(--muted)); font: inherit; font-size: 14px; font-weight: 900; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .li-team:disabled { opacity: .45; cursor: default; }
  .li-team:focus-visible { outline-offset: -4px; }
  .li-team:not(:disabled):active { background-color: color-mix(in srgb, var(--tc, var(--muted)) 28%, transparent); }
  .team-dot { flex: none; width: 12px; height: 12px; border-radius: 0; background: var(--tc, var(--muted)); box-shadow: 0 0 0 2px var(--ink); }
  .team-head {
    display: grid; grid-template-columns: 12px minmax(0, 1fr) auto;
    grid-template-areas: "dot name alive" "bar bar bar";
    align-items: center; column-gap: 8px; row-gap: 4px;
    margin-top: 10px; padding: 6px 6px 7px; border-radius: 0;
    border-left: var(--px) solid var(--tc, var(--muted));
    background: color-mix(in srgb, var(--tc, var(--muted)) 10%, transparent);
    font-size: 13px;
  }
  #hpList > .team-head:first-child { margin-top: 0; }
  .team-head .team-dot { grid-area: dot; }
  .team-name { grid-area: name; font-weight: 900; letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team-alive { grid-area: alive; color: var(--muted); white-space: nowrap; font-family: ui-monospace, "Cascadia Mono", Consolas, "D2Coding", monospace; font-variant-numeric: tabular-nums; }
  .team-bar { grid-area: bar; height: 8px; background: var(--hp-bg); overflow: hidden; box-shadow: inset 0 0 0 1px var(--ink); }
  .team-fill { height: 100%; width: 100%; background: var(--tc, var(--hp-ok)); transition: width .15s steps(3); }
  .team-head.out { opacity: .5; }
  .team-head.out .team-name { text-decoration: line-through; }
  .team-head.out .team-fill { width: 0 !important; }

  /* ===== 전투 현황 (#panelBattle): PC = 왼쪽 상시, 모바일 = HUD #hpBtn 시트(.app[data-open="battle"]) ===== */
  .battle { grid-area: left; display: none; flex-direction: column; min-height: 0; }
  .battle .panel-head { flex: none; }
  #hpList {
    display: flex; flex-direction: column; gap: 2px;
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    margin: 0 -4px; padding: 0 4px;
  }
  #hpList:empty { display: none; }
  .hp-row {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(56px, 1.2fr) 7.5ch 34px;
    align-items: center; gap: 6px; min-height: 28px; font-size: 13px; padding: 0 4px; border-radius: 0;
  }
  .hp-row.mine { background: color-mix(in srgb, var(--primary) 12%, transparent); box-shadow: inset 0 0 0 2px var(--primary); }
  .hp-row.mine .hp-name { font-weight: 900; }
  .hp-num, .hp-val, .cd { font-family: ui-monospace, "Cascadia Mono", Consolas, "D2Coding", monospace; font-variant-numeric: tabular-nums; }
  .hp-num { text-align: right; color: var(--muted); }
  .hp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hp-bar { height: 10px; background: var(--hp-bg); overflow: hidden; box-shadow: inset 0 0 0 1px var(--ink); }
  /* HP 바: 칸 나뉜 픽셀 막대. 맞으면 JS가 .hp-row.hit 를 잠깐(약 250ms) 붙임 → 번쩍 */
  .hp-fill {
    height: 100%; width: 100%; background-color: var(--hp-ok);
    background-image: repeating-linear-gradient(90deg, transparent 0 5px, var(--hp-bg) 5px 6px);
    transition: width .15s steps(3);
  }
  .hp-fill.low { background-color: var(--hp-low); }
  .hp-row.hit .hp-fill { animation: gx-flash .24s steps(2) 1; }
  .hp-val { text-align: right; white-space: nowrap; color: var(--hp-text); font-weight: 900; }
  .cd { text-align: right; color: var(--muted); font-size: 12px; }
  .hp-row.out { opacity: .5; }
  .hp-row.out .hp-name { text-decoration: line-through; }
  .hp-row.out .hp-fill { width: 0 !important; }
  .hp-val .hp-max { color: var(--muted); font-weight: 400; }
  @media (max-width: 380px) {
    .add-btn { font-size: 11px; padding: 6px 1px; }
    .hp-row { grid-template-columns: 20px minmax(0, 1fr) minmax(40px, 1fr) 7.5ch 30px; gap: 4px; font-size: 12px; }
  }

  /* ===== 액션 도크: 직접 모드 전투 중 [조이스틱 | 스킬] ===== */
  .tools { display: contents; }
  .action-dock { grid-area: dock; display: none; gap: 12px; align-items: stretch; min-width: 0; padding: var(--px); }
  body.mode-play:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .action-dock { display: flex; }
  button#skillBtn {
    position: relative; isolation: isolate; overflow: hidden; flex: 1 1 auto; width: auto; min-width: 0;
    min-height: 56px; font-size: 17px; letter-spacing: .08em;
  }
  button#skillBtn::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; z-index: -1;
    width: calc(var(--p, 0) * 100%);
    background: repeating-linear-gradient(90deg, var(--primary) 0 6px, transparent 6px 8px); opacity: .35;
  }
  button#skillBtn.ready {
    background: var(--primary); color: var(--primary-text);
    box-shadow: var(--pxo), inset 0 calc(-1 * var(--px)) 0 0 var(--primary-lo), inset 0 var(--px) 0 0 var(--primary-hi);
    text-shadow: 2px 2px 0 var(--primary-lo);
    animation: gx-ready .8s steps(2) infinite;
  }
  button#skillBtn.ready::before { display: none; }

  /* 가상 조이스틱: #joystick(120) > .joy-base(108) > .joy-knob(48). JS가 --jx/--jy(-1~1), .active */
  .joystick {
    --joy-size: 120px; --joy-base: 108px; --joy-knob: 48px;
    --joy-r: calc((var(--joy-base) - var(--joy-knob)) / 2);
    display: none; flex: none; width: var(--joy-size); height: var(--joy-size);
    align-items: center; justify-content: center; position: relative;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    cursor: grab;
  }
  .joy-base {
    width: var(--joy-base); height: var(--joy-base); border-radius: 0;
    display: flex; align-items: center; justify-content: center; position: relative;
    background: var(--btn);
    box-shadow: var(--pxo), inset 0 var(--px) 0 0 var(--btn-edge), inset 0 calc(-1 * var(--px)) 0 0 var(--btn-hi);
    pointer-events: none;
  }
  .joy-base::before { content: ""; position: absolute; inset: calc(var(--joy-knob) / 2 - 2px); border: 2px dashed var(--btn-edge); }
  .joy-knob {
    width: var(--joy-knob); height: var(--joy-knob); border-radius: 0; position: relative;
    background: var(--primary);
    box-shadow: var(--pxo2), inset 0 -4px 0 0 var(--primary-lo), inset 0 4px 0 0 var(--primary-hi);
    transform: translate(calc(var(--jx, 0) * var(--joy-r)), calc(var(--jy, 0) * var(--joy-r)));
    transition: transform .12s steps(3);
  }
  .joystick.active { cursor: grabbing; }
  .joystick.active .joy-base { background: color-mix(in srgb, var(--primary) 16%, var(--btn)); }
  .joystick.active .joy-knob { background: var(--primary-hi); transition: none; }
  :root:not([data-layout="pc"]) body.mode-play:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .joystick { display: flex; }
  @media (pointer: coarse) {
    body.mode-play:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .joystick { display: flex; }
  }

  /* ===== 전투 화면 (모바일 배치 기본): HUD / 아레나(최대) / 도크 ===== */
  body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "hud" "board" "dock";
  }
  body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .prep { display: none; }
  body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .arena-wrap { height: auto; }
  @supports not (width: 1cqmin) {
    body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) canvas#arena { width: min(100%, calc(100vh - 220px)); }
  }
  /* 모바일 전투 현황 시트: 아레나 칸 아래쪽에 겹쳐 뜸 */
  :root:not([data-layout="pc"]) body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .app[data-open="battle"] #panelBattle {
    display: flex; grid-area: board; align-self: end; z-index: 6;
    max-height: 72%; margin: 0 var(--px) var(--px);
    animation: gx-wipe-in .16s steps(4) backwards;
  }
  /* PC 배치인데 폭 ≤820px(1열): 전투 현황은 아래 줄에 상시 */
  :root[data-layout="pc"] body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .app {
    grid-template-rows: auto minmax(0, 1fr) auto minmax(0, 30%);
    grid-template-areas: "hud" "board" "dock" "left";
  }
  :root[data-layout="pc"] body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) #panelBattle { display: flex; }

  /* ===== 모바일 가로 (높이 ≤500px) ===== */
  @media (orientation: landscape) and (max-height: 500px) {
    :root:not([data-layout="pc"]) .app {
      max-width: 1000px; gap: 8px;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "hud hud" "board prep";
    }
    :root:not([data-layout="pc"]) .arena-wrap { height: auto; }
    :root:not([data-layout="pc"]) .gx-hud { min-height: 48px; padding-bottom: 6px; }
    :root:not([data-layout="pc"]) .status-sub { -webkit-line-clamp: 1; line-clamp: 1; }
    :root:not([data-layout="pc"]) #startBtn { min-height: 48px; font-size: 18px; }
    /* 전투: 관전 = 아레나만, 직접 = [조이스틱 | 아레나 | 스킬] */
    :root:not([data-layout="pc"]) body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "hud" "board";
    }
    :root:not([data-layout="pc"]) body.mode-play:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .app {
      grid-template-columns: minmax(128px, 1fr) minmax(0, 3fr) minmax(128px, 1fr);
      grid-template-areas: "hud hud hud" "joy board skill";
    }
    :root:not([data-layout="pc"]) body.mode-play:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .action-dock { display: contents; }
    :root:not([data-layout="pc"]) body.mode-play .joystick { grid-area: joy; align-self: center; justify-self: center; }
    :root:not([data-layout="pc"]) body.mode-play #skillBtn { grid-area: skill; align-self: center; min-height: 120px; margin: var(--px); }
    /* 좁은 열/시트: HP 행 2줄 */
    :root:not([data-layout="pc"]) .hp-row {
      grid-template-columns: 22px minmax(0, 1fr) auto 34px;
      grid-template-areas: "num name val cd" ". bar bar bar";
      row-gap: 3px; padding: 5px 4px;
    }
    :root:not([data-layout="pc"]) .hp-num { grid-area: num; }
    :root:not([data-layout="pc"]) .hp-name { grid-area: name; }
    :root:not([data-layout="pc"]) .hp-bar { grid-area: bar; }
    :root:not([data-layout="pc"]) .hp-val { grid-area: val; }
    :root:not([data-layout="pc"]) .cd { grid-area: cd; }
    :root:not([data-layout="pc"]) body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .app[data-open="battle"] #panelBattle {
      max-height: 100%; justify-self: center; width: min(420px, 100%); align-self: stretch;
    }
  }

  /* ===== PC 배치 (폭 821px 이상) =====
     준비: [미리보기 + 전투 시작 | 로스터 | 설정] 3열. 전투: [전투 현황 260px | 아레나(최대 760px)] */
  @media (min-width: 821px) {
    :root[data-layout="pc"] .app { max-width: 1440px; padding: 16px 24px; gap: 16px; }
    :root[data-layout="pc"] body:is([data-phase="select"], :not([data-phase]):not(.in-battle)) .app {
      grid-template-columns: minmax(260px, 1fr) minmax(340px, 1.2fr) minmax(280px, .85fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "hud hud hud" "board roster settings" "start roster settings";
    }
    :root[data-layout="pc"] .arena-wrap { height: auto; }
    :root[data-layout="pc"] .prep, :root[data-layout="pc"] .prep-body { display: contents; }
    :root[data-layout="pc"] .prep .prep-tabs { display: none; }
    :root[data-layout="pc"] #panelLineup { grid-area: roster; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: block; }
    :root[data-layout="pc"] #panelControls { grid-area: settings; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; align-self: start; max-height: 100%; }
    :root[data-layout="pc"] .prep-start { grid-area: start; padding: var(--px); }
    :root[data-layout="pc"] #startBtn { min-height: calc(60px * min(var(--vp-zoom, 1), 2)); font-size: calc(22px * min(var(--vp-zoom, 1), 2)); }
    :root[data-layout="pc"] body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) .app {
      max-width: 1120px;
      grid-template-columns: 260px minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "hud hud" "left board" "dock board";
    }
    :root[data-layout="pc"] body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) #panelBattle { display: flex; align-self: stretch; }
    :root[data-layout="pc"] .action-dock { flex-direction: column; }
    :root[data-layout="pc"] .action-dock .joystick { align-self: center; }
    @supports (width: 1cqmin) {
      :root[data-layout="pc"] body:is([data-phase="running"], [data-phase="paused"], [data-phase="over"], :not([data-phase]).in-battle) canvas#arena {
        width: min(calc(min(100cqw, 100cqh) - 2 * var(--px)), 760px);
      }
    }
    :root[data-layout="pc"] .hp-row {
      grid-template-columns: 22px minmax(0, 1fr) auto 34px;
      grid-template-areas: "num name val cd" ". bar bar bar";
      row-gap: 3px; padding: 5px 4px;
    }
    :root[data-layout="pc"] .hp-num { grid-area: num; }
    :root[data-layout="pc"] .hp-name { grid-area: name; }
    :root[data-layout="pc"] .hp-bar { grid-area: bar; }
    :root[data-layout="pc"] .hp-val { grid-area: val; }
    :root[data-layout="pc"] .cd { grid-area: cd; }
  }
  /* 폰에서 PC 배치(viewport 1280 축소): 손가락 크기 유지 */
  :root[data-layout="pc"] .gx-icon { width: calc(44px * var(--vp-zoom, 1)); height: calc(44px * var(--vp-zoom, 1)); min-width: calc(44px * var(--vp-zoom, 1)); }
  :root[data-layout="pc"] .gx-icon.wide { width: auto; min-width: calc(52px * var(--vp-zoom, 1)); font-size: calc(14px * min(var(--vp-zoom, 1), 2.8)); }
  :root[data-layout="pc"] .gx-icon svg { width: calc(22px * var(--vp-zoom, 1)); height: calc(22px * var(--vp-zoom, 1)); }
  :root[data-layout="pc"] #pauseBtn::before { transform: scale(var(--vp-zoom, 1)); }
  :root[data-layout="pc"] .gx-menu-list .gx-btn, :root[data-layout="pc"] #skillBtn { min-height: calc(52px * min(var(--vp-zoom, 1), 2)); font-size: calc(16px * min(var(--vp-zoom, 1), 2)); }

  /* ===== 메뉴 오버레이 (.gx-menu) =====
     #gxMenu: html[data-menu="pause"|"menu"] 또는 (data-menu 없음/빈 값 + 일시정지 단계) 에서 보임.
     #gxSettings: html[data-menu="settings"]. HUD 는 일시정지 메뉴 위(z 31)에 남아 ▶ 로 재개 가능 */
  .gx-menu {
    position: fixed; inset: 0; z-index: 30;
    display: none; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: var(--scrim);
    overscroll-behavior: contain;
  }
  html:is([data-menu="pause"], [data-menu="menu"]) #gxMenu,
  html:is(:not([data-menu]), [data-menu=""]) body:is([data-phase="paused"], :not([data-phase]).paused) #gxMenu { display: flex; }
  html[data-menu="settings"] #gxSettings { display: flex; z-index: 45; }
  .gx-menu-box {
    width: min(360px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 16px;
    padding: 18px 18px 20px;
    background: var(--panel); color: var(--text);
    box-shadow: var(--pxo), inset 0 var(--px) 0 0 var(--panel-hi), inset 0 calc(-1 * var(--px)) 0 0 var(--frame);
    animation: gx-pop-in .2s steps(4) both;
  }
  .gx-menu-title {
    margin: 0; text-align: center; font-size: 24px; font-weight: 900; letter-spacing: .08em;
    color: var(--title-from); text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 var(--title-edge);
  }
  .gx-menu-title .mt-menu { display: none; }
  body:is([data-phase="select"], [data-phase="over"], :not([data-phase]):not(.in-battle)) .gx-menu-title .mt-pause { display: none; }
  body:is([data-phase="select"], [data-phase="over"], :not([data-phase]):not(.in-battle)) .gx-menu-title .mt-menu { display: inline; }
  .gx-menu-list { display: flex; flex-direction: column; gap: 14px; padding: var(--px); }
  .gx-menu-list .gx-btn { width: 100%; min-height: 52px; padding-left: 36px; padding-right: 36px; font-size: 16px; }
  /* 선택 커서 ▶ (aria-current 또는 키보드 포커스, 마우스 호버) */
  .gx-menu-list .gx-btn::before {
    content: "\25B6"; position: absolute; left: 12px; top: 50%; margin-top: -.55em; font-size: 14px; line-height: 1.1;
    opacity: 0;
  }
  .gx-menu-list .gx-btn:is([aria-current], :focus-visible)::before { opacity: 1; animation: gx-cursor .5s steps(2) infinite; }
  @media (hover: hover) { .gx-menu-list .gx-btn:not(:disabled):hover::before { opacity: 1; } }
  .gx-menu-list .gx-btn:focus-visible { outline-offset: 6px; }
  /* 준비 화면 메뉴에는 전투 항목 없음 */
  body:is([data-phase="select"], :not([data-phase]):not(.in-battle)) :is(#restartBtn, #skipBtn, #menuLineup) { display: none; }
  /* 설정 시트 */
  .gx-sheet { width: min(460px, 100%); gap: 14px; overflow: hidden; }
  .gx-sheet-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 18px; padding: 8px; margin: -8px;
  }
  .gx-sheet-foot { flex: none; display: flex; gap: 12px; padding: var(--px); }
  .gx-sheet-foot .gx-btn { flex: 1; }
  @media (max-height: 500px) {
    .gx-menu-box { width: min(560px, 100%); gap: 10px; padding: 12px 14px 14px; }
    .gx-menu-title { font-size: 20px; }
    .gx-menu-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .gx-menu-list .gx-btn { min-height: 46px; font-size: 14px; padding-left: 28px; padding-right: 10px; }
    .gx-sheet { width: min(560px, 100%); }
  }

  /* ===== 결과 화면 (#overlay.gx-result[data-outcome="win|lose|draw"]) ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: var(--scrim);
  }
  .overlay.show { display: flex; }
  .dialog {
    background: var(--panel); color: var(--text); border-radius: 0; padding: 16px;
    text-align: center;
    box-shadow: var(--pxo), inset 0 var(--px) 0 0 var(--panel-hi), inset 0 calc(-1 * var(--px)) 0 0 var(--frame);
    width: min(380px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 12px; min-height: 0;
  }
  .dialog h2 { margin: 0; font-size: 18px; font-weight: 900; letter-spacing: .04em; overflow-wrap: anywhere; }
  .gx-result-box { overflow: hidden; animation: gx-pop-in .3s steps(4) both; }
  .gx-banner { position: relative; isolation: isolate; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px; }
  .gx-banner::before {
    content: ""; position: absolute; left: 50%; top: 36px; width: 260px; height: 260px; margin: -130px 0 0 -130px; z-index: -1;
    background: repeating-conic-gradient(var(--ray) 0 12deg, transparent 12deg 24deg);
    animation: gx-spin 6s steps(24) infinite;
  }
  .gx-result:is([data-outcome="lose"], [data-outcome="draw"]) .gx-banner::before { content: none; }
  .gx-trophy { width: 72px; height: 72px; display: block; shape-rendering: crispEdges; }
  .gx-trophy .tr-a { fill: var(--gold); }
  .gx-trophy .tr-b { fill: var(--gold-hi); }
  .gx-trophy .tr-c { fill: var(--gold-lo); }
  .gx-trophy .tr-o { fill: var(--ink); }
  .gx-trophy .tr-s { fill: var(--gold-hi); animation: gx-blink .6s steps(2) infinite; }
  .gx-result[data-outcome="draw"] .gx-trophy :is(.tr-a, .tr-b) { fill: var(--draw); }
  .gx-result[data-outcome="draw"] .gx-trophy .tr-c { fill: var(--muted); }
  .gx-result[data-outcome="draw"] .gx-trophy .tr-s,
  .gx-result[data-outcome="lose"] .gx-trophy { display: none; }
  .gx-kicker { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: .1em; line-height: 1.15; text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 var(--title-edge); }
  .gx-kicker .k-win { color: var(--gold-hi); }
  .gx-kicker .k-lose { display: none; color: var(--lose); }
  .gx-result[data-outcome="lose"] .gx-kicker .k-win { display: none; }
  .gx-result[data-outcome="lose"] .gx-kicker .k-lose { display: inline; }
  .gx-result[data-outcome="draw"] .gx-kicker { display: none; }
  .gx-result .gx-profile { justify-content: center; color: var(--text); }
  body:not(.mode-play) #ovProfile { display: none; }   /* 관전 모드엔 내 프로필 없음 */
  .gx-result-actions { flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: var(--px); }
  .gx-result-actions .gx-btn { min-width: 0; padding: 10px 6px; font-size: 14px; }
  #ovRank {
    list-style: none; margin: 0; padding: 0; text-align: left; font-size: 14px;
    overflow-y: auto; overscroll-behavior: contain; min-height: 0; flex: 1 1 auto;
    box-shadow: inset 0 2px 0 0 var(--border);
  }
  #ovRank li { display: flex; align-items: center; gap: 8px; padding: 6px 4px; box-shadow: inset 0 -2px 0 0 var(--border); }
  #ovRank .rk { color: var(--muted); min-width: 2.6em; flex: none; font-family: ui-monospace, "Cascadia Mono", Consolas, "D2Coding", monospace; font-variant-numeric: tabular-nums; }
  #ovRank > li:first-child { font-weight: 900; background: color-mix(in srgb, var(--gold-hi) 22%, transparent); }
  #ovRank > li:first-child .rk { color: var(--gold-lo); }
  #ovRank .li-dot { width: 20px; height: 20px; border-width: 2px; }
  #ovRank .li-dot.dup3 { border-width: 4px; }
  #ovRank:empty { display: none; }
  #ovRank li.rank-team {
    font-weight: 900; padding: 7px 6px; margin-top: 4px;
    border-left: var(--px) solid var(--tc, var(--muted));
    background: color-mix(in srgb, var(--tc, var(--muted)) 12%, transparent);
  }
  #ovRank li.rank-team:first-child { margin-top: 0; }
  #ovRank li.rank-team .rk { color: var(--text); }
  .rank-team-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #ovRank li.rank-member { padding-left: 22px; font-weight: 400; background: none; }
  #ovRank li.rank-member .rk { min-width: 2em; }
  #ovRank li.rank-member.out { color: var(--muted); }
  #ovRank li.rank-member.out .li-dot { opacity: .45; }
  #ovRank li > span:last-child { min-width: 0; overflow-wrap: anywhere; }
  @media (orientation: landscape) and (max-height: 500px) {
    .gx-result-box {
      width: min(640px, 100%); display: grid; gap: 10px 16px;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); grid-template-rows: minmax(0, 1fr) auto;
    }
    .gx-banner { grid-column: 1; grid-row: 1; justify-content: center; }
    #ovRank { grid-column: 2; grid-row: 1; }
    .gx-result-actions { grid-column: 1 / -1; grid-row: 2; }
    .gx-trophy { width: 56px; height: 56px; }
    .gx-kicker { font-size: 24px; }
  }

  /* ===== 공 꾸미기 다이얼로그 (픽셀풍 큰 창) =====
     #customOverlay(.hidden 토글) > #customDialog. 넓으면 [큰 미리보기 | 탭 + 옵션], 좁으면 미리보기 위·탭·옵션(스크롤).
     탭: #customDialog[data-ctab="color|face|hat|trail|name"] 와 같은 .custom-pane[data-pane] 만 보임.
     data-ctab 이 없으면 탭 줄을 숨기고 옵션을 모두 세로로(스크롤) 보여 준다. */
  .modal-scrim {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: var(--scrim);
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    overscroll-behavior: contain;
  }
  .dialog.custom-dialog {
    width: min(760px, 100%); height: min(600px, 100%); max-height: 100%;
    padding: 0; gap: 0; text-align: left; overflow: hidden;
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    grid-template-areas: "head" "stage" "tabs" "body" "foot";
    animation: gx-pop-in .2s steps(4) both;
  }
  .custom-head { grid-area: head; padding: 14px 18px 10px; box-shadow: inset 0 -2px 0 0 var(--border); }
  .custom-head h2 { font-size: 20px; letter-spacing: .06em; color: var(--title-from); text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 var(--title-edge); }
  .custom-head .custom-target { color: var(--muted); font-weight: 700; text-shadow: none; letter-spacing: .02em; }
  .custom-stage {
    grid-area: stage; display: flex; align-items: center; justify-content: center; padding: 12px;
    background: var(--hud-bg);
    background-image: repeating-linear-gradient(0deg, var(--scanline) 0 1px, transparent 1px 3px);
    box-shadow: inset 0 -4px 0 0 var(--hud-edge);
  }
  canvas#customPreview {
    display: block; width: 120px; height: 120px; flex: none;
    background: var(--arena); border-radius: 0; box-shadow: var(--pxo);
    image-rendering: pixelated;
  }
  .custom-tabs { grid-area: tabs; display: none; gap: 0; padding: 0 10px; overflow-x: auto; box-shadow: inset 0 -2px 0 0 var(--border); }
  .custom-dialog[data-ctab] .custom-tabs { display: flex; }
  .custom-tab {
    flex: 1 0 auto; min-height: 44px; padding: 8px 10px; margin: 0;
    font: inherit; font-size: 13px; font-weight: 900; letter-spacing: .04em; white-space: nowrap;
    border: 0; border-radius: 0; background: transparent; color: var(--muted); cursor: pointer;
  }
  .custom-tab[aria-selected="true"] { color: var(--primary-text); background: var(--primary); box-shadow: inset 0 -4px 0 0 var(--primary-lo); }
  .custom-tab[aria-selected="true"]::before { content: "\25B6"; font-size: .8em; margin-right: 4px; }
  .custom-tab:focus-visible { outline-offset: -3px; }
  .custom-body {
    grid-area: body; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding: 14px 18px; display: flex; flex-direction: column; gap: 16px;
  }
  .custom-dialog[data-ctab="color"] .custom-pane:not([data-pane="color"]),
  .custom-dialog[data-ctab="face"] .custom-pane:not([data-pane="face"]),
  .custom-dialog[data-ctab="hat"] .custom-pane:not([data-pane="hat"]),
  .custom-dialog[data-ctab="trail"] .custom-pane:not([data-pane="trail"]),
  .custom-dialog[data-ctab="name"] .custom-pane:not([data-pane="name"]) { display: none; }
  .custom-pane > .field-label { font-size: 14px; font-weight: 900; letter-spacing: .04em; color: var(--text); margin-bottom: 8px; }
  .custom-foot {
    grid-area: foot; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
    padding: 12px 18px 16px; box-shadow: inset 0 2px 0 0 var(--border);
  }
  .custom-foot button.btn { min-width: 0; padding: 9px 6px; overflow-wrap: anywhere; }
  /* 넓은 화면: [큰 미리보기 | 탭 + 옵션] */
  @media (min-width: 700px) and (min-height: 520px) {
    .dialog.custom-dialog { grid-template-columns: 260px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "head head" "stage tabs" "stage body" "foot foot"; }
    canvas#customPreview { width: 200px; height: 200px; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    .dialog.custom-dialog { grid-template-columns: 180px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "head head" "stage tabs" "stage body" "foot foot"; }
    canvas#customPreview { width: 140px; height: 140px; }
    .custom-head { padding: 10px 14px 8px; }
    .custom-foot { padding: 8px 14px 10px; }
  }
  input.text-field {
    font: inherit; font-size: 16px; width: calc(100% - 4px); min-height: 44px; padding: 8px 10px; margin: 2px;
    color: var(--text); background: var(--btn); border: 0; border-radius: 0;
    box-shadow: var(--pxo2), inset 0 3px 0 0 var(--btn-edge);
  }
  input.text-field::placeholder { color: var(--muted); opacity: 1; }
  input.text-field:focus-visible { outline-offset: 4px; }
  .seg.chips { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .seg.chips button { font-size: 13px; padding: 8px 4px; overflow-wrap: anywhere; box-shadow: inset 2px 0 0 0 var(--btn-edge), inset 0 -2px 0 0 var(--btn-edge); }
  .seg.chips button.on { box-shadow: inset 0 -3px 0 0 var(--primary-lo); }
  #customColors .swatch.default {
    background:
      linear-gradient(135deg, transparent calc(50% - 2px), var(--muted) calc(50% - 2px), var(--muted) calc(50% + 2px), transparent calc(50% + 2px)),
      var(--sw-def, var(--btn));
  }
  #customColors { gap: 10px; }
  @media (max-width: 400px) {
    .custom-head { padding: 12px 14px 8px; }
    .custom-body { padding: 12px 14px; gap: 14px; }
    .custom-foot { padding: 10px 14px 14px; gap: 10px; }
    .custom-foot button.btn { font-size: 13px; }
    canvas#customPreview { width: 96px; height: 96px; }
    .custom-stage { padding: 8px; }
  }

  /* ===== 호버 (실제 호버 기기만) ===== */
  @media (hover: hover) {
    .gx-btn:not(:disabled):hover, button.btn:not(:disabled):hover { background: var(--btn-hover); }
    .gx-btn.primary:not(:disabled):hover, button.btn.primary:not(:disabled):hover,
    .gx-toggle[aria-pressed="true"]:hover, .prep-tab[aria-selected="true"]:hover { background: var(--primary-hi); }
    .gx-icon:not(:disabled):hover { background: var(--hud-edge); }
    .add-btn:not(:disabled):hover, .theme-btn:not(.on):hover, .ui-sw:hover { background: var(--btn-hover); }
    .seg button:not(:disabled):not(.on):hover { background: var(--btn-hover); }
    .li-del:not(:disabled):hover { background: var(--btn-hover); color: var(--text); }
    .li-edit:not(:disabled):hover { background: var(--primary-hi); }
    .li-team:not(:disabled):hover { background-color: color-mix(in srgb, var(--tc, var(--muted)) 28%, transparent); }
    .custom-tab:not([aria-selected="true"]):hover { background: var(--btn-hover); color: var(--text); }
    .panel-close:hover { background: var(--btn-hover); color: var(--text); }
  }

  /* ===== 움직임 줄이기: 모든 애니메이션·전환 끔 (깜빡임·커서·광선·카운트다운 팝·화면 와이프 포함) ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    .gx-btn:active, button.btn:active, .gx-icon:active, .add-btn:active, .li-edit:active, .swatch:active, .theme-btn:active { transform: none !important; }
    .gx-banner::before { transform: none; }
  }
</style>
</head>
<body>
<!-- 화면 = body[data-phase]: select(전투 준비) / running(전투) / paused(일시정지 메뉴) / over(결과). 속성이 없으면 준비 화면 -->
<div class="app">
  <header class="gx-hud">
    <div class="hud-left">
      <button type="button" class="gx-icon" id="menuBtn" aria-label="메뉴" data-i18n-aria="menu" aria-haspopup="dialog" aria-controls="gxMenu">
        <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" focusable="false"><rect x="2" y="3" width="12" height="2"/><rect x="2" y="7" width="12" height="2"/><rect x="2" y="11" width="12" height="2"/></svg>
      </button>
      <!-- 일시정지/재개: JS가 글자를 바꿈(접근성 이름), 화면엔 픽셀 아이콘(❚❚ / ▶) -->
      <button type="button" class="gx-icon" id="pauseBtn" data-i18n="pause">일시정지</button>
      <h1 class="hud-title" data-i18n="title">공 배틀</h1>
      <!-- 프로필 칩(K1): renderAvatar 가 #hudAvatar 에 픽셀 SVG + data-av-color, #hudProfileName 에 이름 -->
      <span class="gx-profile" id="hudProfile"><span class="gx-avatar" id="hudAvatar" aria-hidden="true"></span><span class="gx-profile-name" id="hudProfileName">플레이어</span></span>
    </div>
    <div class="hud-status">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="status-sub" id="statusSub"></div>
    </div>
    <div class="hud-right">
      <!-- .tool-group: 모바일 전투 화면의 전투 현황 시트 버튼(#hpBtn) -->
      <div class="tool-group">
        <button type="button" class="tool gx-icon" id="hpBtn" data-panel="battle" aria-controls="panelBattle" aria-expanded="false" aria-label="전투 현황" data-i18n-aria="battleStatus">
          <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" focusable="false"><rect x="1" y="2" width="3" height="3"/><rect x="5" y="2" width="10" height="3"/><rect x="1" y="7" width="3" height="3"/><rect x="5" y="7" width="7" height="3"/><rect x="1" y="12" width="3" height="3"/><rect x="5" y="12" width="4" height="3"/></svg>
        </button>
      </div>
      <!-- 속도 순환(1x→1.5x→…→3x): JS가 글자와 aria-label("속도 1.5x") 갱신 -->
      <button type="button" class="gx-icon wide" id="speedBtn" aria-label="속도 1x">1x</button>
      <button type="button" class="gx-icon" id="soundBtn" aria-pressed="true" aria-label="소리" data-i18n-aria="sound">
        <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" focusable="false"><rect x="1" y="6" width="3" height="4"/><rect x="4" y="5" width="2" height="6"/><rect x="6" y="3" width="2" height="10"/><g class="snd-wave"><rect x="10" y="6" width="2" height="4"/><rect x="13" y="3" width="2" height="2"/><rect x="13" y="11" width="2" height="2"/><rect x="14" y="5" width="2" height="6"/></g><g class="snd-x"><rect x="10" y="5" width="2" height="2"/><rect x="14" y="5" width="2" height="2"/><rect x="12" y="7" width="2" height="2"/><rect x="10" y="9" width="2" height="2"/><rect x="14" y="9" width="2" height="2"/></g></svg>
      </button>
    </div>
  </header>

  <div class="arena-wrap">
    <canvas id="arena" role="img" aria-label="공 배틀 아레나" data-i18n-aria="arena"></canvas>
    <!-- 카운트다운: JS가 3·2·1·FIGHT! 글자, hidden 해제, 마지막 글자엔 .fight -->
    <div class="gx-toast gx-countdown" id="gxCountdown" aria-live="assertive" hidden>3</div>
  </div>

  <!-- 직접 모드 전투 중 조작: 조이스틱 + 스킬 -->
  <nav class="tools" id="tools" aria-label="도구" data-i18n-aria="tools">
    <div class="action-dock" id="actionDock">
      <!-- 가상 조이스틱(직접 모드 전투 중, 모바일 배치 또는 터치 기기). 손잡이 위치 = JS가 --jx/--jy(-1~1), 누르는 중 .active -->
      <div id="joystick" class="joystick" aria-hidden="true"><div class="joy-base"><div class="joy-knob"></div></div></div>
      <button type="button" class="btn hidden" id="skillBtn" data-i18n="skill">스킬 사용</button>
    </div>
  </nav>

  <section class="card battle" id="panelBattle" data-panel-id="battle" aria-labelledby="hpLabel">
    <div class="panel-head">
      <span class="field-label" id="hpLabel" data-i18n="battleStatus">전투 현황</span>
      <button type="button" class="panel-close" aria-label="닫기" data-i18n-aria="close">×</button>
    </div>
    <div id="hpList"></div>
  </section>

  <!-- 전투 준비: 모바일 = 탭(.prep[data-tab="roster|settings"], 속성 없으면 둘 다 세로로) + 하단 "전투 시작".
       PC = [미리보기 + 전투 시작 | 로스터 | 설정] 3열 -->
  <section class="prep" id="prep">
    <div class="prep-tabs" role="tablist" aria-label="전투 준비" data-i18n-aria="prep">
      <button type="button" class="gx-btn prep-tab" role="tab" id="tabRoster" data-tab="roster" aria-controls="panelLineup" aria-selected="true" data-i18n="roster">로스터</button>
      <button type="button" class="gx-btn prep-tab" role="tab" id="tabSettings" data-tab="settings" aria-controls="panelControls" aria-selected="false" data-i18n="controls">게임 설정</button>
    </div>
    <div class="prep-body">
      <section class="card lineup-card" id="panelLineup" data-panel-id="lineup" aria-labelledby="lineupLabel">
        <!-- 공 꾸미기(K5): 내 공(직접 모드) 또는 첫 번째 공의 꾸미기 창 열기 -->
        <button type="button" class="gx-btn primary" id="customizeBtn" aria-haspopup="dialog" aria-controls="customOverlay">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="4" y="1" width="8" height="2"/><rect x="2" y="3" width="12" height="2"/><rect x="1" y="5" width="14" height="6"/><rect x="2" y="11" width="12" height="2"/><rect x="4" y="13" width="8" height="2"/><rect x="2" y="0" width="2" height="2"/><rect x="12" y="0" width="2" height="2"/></svg>
          <span data-i18n="customizeBall">공 꾸미기</span>
        </button>
        <div class="field-head">
          <span class="field-label" id="lineupLabel" data-i18n="lineup">공 구성</span>
          <span class="count" id="lineupCount">0 / 20</span>
          <div class="lineup-foot">
            <button type="button" class="btn small hidden" id="autoTeamBtn" data-i18n="autoTeam">팀 자동 배분</button>
            <button type="button" class="btn small" id="clearBtn" data-i18n="clear">모두 지우기</button>
          </div>
        </div>
        <div class="add-bar" id="addBar">
          <button type="button" class="add-btn" data-type="charger" aria-label="돌격 추가" data-i18n-aria="addCharger"><span class="dot" style="background: var(--c-charger)"></span><span data-i18n="charger">돌격</span></button>
          <button type="button" class="add-btn" data-type="spike" aria-label="가시 추가" data-i18n-aria="addSpike"><span class="dot" style="background: var(--c-spike)"></span><span data-i18n="spike">가시</span></button>
          <button type="button" class="add-btn" data-type="healer" aria-label="치유 추가" data-i18n-aria="addHealer"><span class="dot" style="background: var(--c-healer)"></span><span data-i18n="healer">치유</span></button>
          <button type="button" class="add-btn" data-type="twin" aria-label="분신 추가" data-i18n-aria="addTwin"><span class="dot" style="background: var(--c-twin)"></span><span data-i18n="twin">분신</span></button>
          <button type="button" class="add-btn" data-type="shooter" aria-label="사수 추가" data-i18n-aria="addShooter"><span class="dot" style="background: var(--c-shooter)"></span><span data-i18n="shooter">사수</span></button>

const MAX_BALLS = 20, MIN_BALLS = 2;

const SMALL_N = 10;

const PAIR_CD_SWEEP = 60;      // 60스텝마다 만료된 pairHitCd 항목 정리 (결과 영향 없음)

// --- 신규 종류 수치 ---
const BLINK_BONUS = 8, GROW_BONUS = 5, RAGE_BONUS = 6; // 공격력 보너스 (섬광 직후·거대화·광폭화)

const PULL_R = 220, SWAP_DMG = 6;         // 자석 반경(×scale), 교환 피해(×DMG_MULT)
const MIRROR_SHIELD = 25, MIRROR_T = 2.5;
const GHOST_HP = 0.6, PHASE_ALPHA = 0.35; // 유령: AI는 HP 60% 이하에서만 사용
// retry: true → useSkill 실패 시 b.cd = RETRY_CD (twin은 기존 동작·시드 보존을 위해 제외)
const TYPES = {
  charger:   { hp: 100, atk: 6, r: 26, spd: 220, cd: 4,   skill: 'skDash' },
  spike:     { hp: 120, atk: 5, r: 28, spd: 180, cd: 6,   skill: 'skSpike' },
