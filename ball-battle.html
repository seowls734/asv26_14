const TYPE_IDS = Object.keys(TYPES);
const DEFAULT_LINEUP = ['charger', 'spike', 'healer', 'shooter'];

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// 같은 종류 번호: 목록 순서대로 1, 2, 3… (dupCount가 1이면 번호 없이 표시)
function dupInfo(lineup) {
  const total = {}, seen = {};
  for (const ty of lineup) total[ty] = (total[ty] || 0) + 1;
  return lineup.map(ty => {
    seen[ty] = (seen[ty] || 0) + 1;
    return { dupIndex: seen[ty], dupCount: total[ty] };
  });
}

function emit(sim, ev) { if (sim.events.length < 100) sim.events.push(ev); }

// 배열 제자리 셔플 (Fisher–Yates, 뒤에서부터)
function shuffleIn(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 스폰 위치: 반지름 210 원 위 균등 배치 + 지터, 배치 순서는 셔플
// teams가 있으면(팀전) 팀 순서·팀 안 순서를 각각 셔플해 이어 붙임 → 팀원이 원 위에서 이웃
function spawnPositions(n, rng, radii, teams) {
  let order = [];
  if (!teams) {
    for (let i = 0; i < n; i++) order.push(i);
    shuffleIn(order, rng);
  } else {
    const groups = new Map();
    teams.forEach((tm, i) => { if (!groups.has(tm)) groups.set(tm, []); groups.get(tm).push(i); });
    const keys = shuffleIn(Array.from(groups.keys()).sort((a, b) => a - b), rng);
    for (const k of keys) order = order.concat(shuffleIn(groups.get(k), rng));
  }
  const a0 = rng() * Math.PI * 2;
  const jit = order.map(() => [(rng() * 2 - 1) * SPAWN_JITTER, (rng() * 2 - 1) * SPAWN_JITTER]);
  const build = useJitter => {
    const pos = new Array(n);
    order.forEach((slotIdx, k) => {
      const a = a0 + (k * Math.PI * 2) / n;
      pos[slotIdx] = [
        ARENA / 2 + Math.cos(a) * SPAWN_R + (useJitter ? jit[k][0] : 0),
        ARENA / 2 + Math.sin(a) * SPAWN_R + (useJitter ? jit[k][1] : 0),
      ];
    });
    return pos;
  };
  const ok = pos => {
    for (let i = 0; i < n; i++) {
      const [x, y] = pos[i], r = radii[i];
      if (x < r || y < r || x > ARENA - r || y > ARENA - r) return false;
      for (let j = i + 1; j < n; j++) {
        if (Math.hypot(pos[j][0] - x, pos[j][1] - y) < r + radii[j] + 2) return false;
      }
    }
    return true;
  };
  const p = build(true);
  return ok(p) ? p : build(false);
}

// teams: 팀전이면 lineup과 같은 길이의 팀 번호 배열(0..3), 개인전이면 생략 → team = i+1 (기존 시드 그대로)
function createBattle(lineup, seed, teams) {
  const rng = mulberry32(seed >>> 0);
  const n = lineup.length;
  const teamMode = Array.isArray(teams) && teams.length === n;
  // 10개 이하는 기존 공식 그대로(시드 보존), 11~20개는 0.8 → 0.7로 더 작게
  const scale = n <= SMALL_N ? clamp(Math.sqrt(6 / Math.max(n, 1)), 0.8, 1) : clamp(0.8 * Math.sqrt(SMALL_N / n), 0.7, 0.8);
  const dups = dupInfo(lineup);
  const sim = {
    seed, rng, time: 0, suddenDeath: false, scale, total: n,
    bodies: [], balls: [], projectiles: [], events: [],
    pairHitCd: new Map(), eliminations: [], nextId: n + 1,
    manualId: 0, manualReq: false, result: null,
    cloneMax: n <= SMALL_N ? CLONE_MAX_SMALL : CLONE_MAX, stepN: 0,
    battle: teamMode ? 'team' : 'ffa',
  };
  const radii = lineup.map(ty => TYPES[ty].r * scale);
  const pos = spawnPositions(n, rng, radii, teamMode ? teams : null);
  lineup.forEach((type, i) => {
    const T = TYPES[type], [x, y] = pos[i];
    const a = Math.atan2(ARENA / 2 - y, ARENA / 2 - x) + (rng() * 2 - 1) * (Math.PI / 3);
    const b = {
      id: i + 1, slot: i + 1, type, dupIndex: dups[i].dupIndex, dupCount: dups[i].dupCount,
      // 팀 번호: 개인전은 공마다 다름(i+1), 팀전은 팀 인덱스+1 (1=A … 4=D)
      team: teamMode ? teams[i] + 1 : i + 1, isClone: false, ownerId: 0,
      x, y, vx: Math.cos(a) * T.spd, vy: Math.sin(a) * T.spd, r: radii[i],
      hp: T.hp, maxHp: T.hp, atk: T.atk, baseSpd: T.spd,
      cd: 0.5 + rng(), cdMax: T.cd, ready: false,
      dashT: 0, spikeT: 0, shield: 0, shieldT: 0, life: Infinity, alive: true,
      baseR: radii[i], slowT: 0, drainT: 0, rageT: 0, phaseT: 0, reflectT: 0, growT: 0, blinkT: 0, poisonT: 0,
      look: null, // UI 꾸미기 전용 (엔진 미사용)
    };
    sim.bodies.push(b);
    sim.balls.push(b);
  });
  return sim;
}

function nearestEnemy(sim, b) {
  let best = null, bd = Infinity;
  for (const o of sim.balls) {
    if (o.team === b.team || o.phaseT > 0) continue; // 유령화 중인 적은 대상 아님
    const d = (o.x - b.x) ** 2 + (o.y - b.y) ** 2;
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

function spawnClone(sim, owner) {
  let mine = 0, all = 0;
  for (const o of sim.balls) if (o.isClone) { all++; if (o.ownerId === owner.id) mine++; }
  if (mine >= CLONE_PER_OWNER || all >= sim.cloneMax) return false;
  const cr = 16 * sim.scale, a0 = sim.rng() * Math.PI * 2;
  for (let k = 0; k < 8; k++) {
    const a = a0 + (k * Math.PI) / 4, dist = owner.r + cr + 3;
    const x = owner.x + Math.cos(a) * dist, y = owner.y + Math.sin(a) * dist;
    if (x < cr || y < cr || x > ARENA - cr || y > ARENA - cr) continue;
    if (sim.balls.some(o => Math.hypot(o.x - x, o.y - y) < o.r + cr + 1)) continue;
    sim.balls.push({
      id: sim.nextId++, slot: owner.slot, type: 'twin', dupIndex: owner.dupIndex, dupCount: owner.dupCount,
      team: owner.team, isClone: true, ownerId: owner.id,
      x, y, vx: Math.cos(a) * owner.baseSpd, vy: Math.sin(a) * owner.baseSpd, r: cr,
      hp: CLONE_HP, maxHp: CLONE_HP, atk: CLONE_ATK, baseSpd: owner.baseSpd,
      cd: Infinity, cdMax: 0, ready: false,
      dashT: 0, spikeT: 0, shield: 0, shieldT: 0, life: 5, alive: true,
      baseR: cr, slowT: 0, drainT: 0, rageT: 0, phaseT: 0, reflectT: 0, growT: 0, blinkT: 0, poisonT: 0,
      look: owner.look,
    });
    emit(sim, { k: 'clone', x, y });
    return true;
  }
  return false;
}

// 투사체 발사: (ux, uy) 단위 방향, o = { dmg(×DMG_MULT), spd, life, r(×scale), col(색 키), onHit('slow'|'poison') }
function fireProj(sim, b, ux, uy, o) {
  const pr = o.r * sim.scale;
  sim.projectiles.push({
    team: b.team, ownerId: b.id, r: pr, dmg: o.dmg * DMG_MULT, life: o.life,
    x: b.x + ux * (b.r + pr + 1), y: b.y + uy * (b.r + pr + 1), vx: ux * o.spd, vy: uy * o.spd,
    col: o.col || 'shooter', onHit: o.onHit || null,
  });
  if (sim.projectiles.length > PROJ_MAX) sim.projectiles.shift();
}
const fireAt = (sim, b, a, o) => fireProj(sim, b, Math.cos(a), Math.sin(a), o);
// 가장 가까운 적 방향(rad), 없으면 null
function aimAngle(sim, b) {
  const e = nearestEnemy(sim, b);
  return e ? Math.atan2(e.y - b.y, e.x - b.x) : null;
}
// 섬광: 가장 가까운 적 e의 진행 반대쪽(뒤)부터 8방향 빈자리로 이동. RNG 미사용
function blinkTo(sim, b) {
  const e = nearestEnemy(sim, b);
  if (!e) return false;
  const dist = e.r + b.r + 4;
  const a0 = Math.hypot(e.vx, e.vy) > 1e-6 ? Math.atan2(-e.vy, -e.vx) : Math.atan2(b.y - e.y, b.x - e.x);
  for (let k = 0; k < 8; k++) {
    const a = a0 + (k * Math.PI) / 4;
    const x = e.x + Math.cos(a) * dist, y = e.y + Math.sin(a) * dist;
    if (x < b.r || y < b.r || x > ARENA - b.r || y > ARENA - b.r) continue;
    if (sim.balls.some(o => o !== b && Math.hypot(o.x - x, o.y - y) < o.r + b.r + 1)) continue;
    emit(sim, { k: 'blink', x: b.x, y: b.y });
    b.x = x; b.y = y;
    // 도착 후 적을 향해 (속력 유지)
    const sp = Math.hypot(b.vx, b.vy) || b.baseSpd;
    b.vx = (-Math.cos(a)) * sp; b.vy = (-Math.sin(a)) * sp;
    b.blinkT = 1;
    emit(sim, { k: 'blink', x, y });
    return true;
  }
  return false;
}
// 교환: 가장 먼 적 본체(분신·유령화 제외)와 위치 교환(속도 유지) + 피해. RNG 미사용
function swapWithFarthest(sim, b) {
  let far = null, fd = -1;
  for (const o of sim.balls) {
    if (o.team === b.team || o.isClone || o.phaseT > 0) continue;
    const d = (o.x - b.x) ** 2 + (o.y - b.y) ** 2;
    if (d > fd) { fd = d; far = o; }
  }
  if (!far) return false;
  const x = b.x, y = b.y;
  b.x = far.x; b.y = far.y;
  far.x = x; far.y = y;
  applyDamage(far, SWAP_DMG * DMG_MULT, false);
  emit(sim, { k: 'swap', x1: x, y1: y, x2: b.x, y2: b.y });
  emit(sim, { k: 'hit', x: far.x, y: far.y });
  return true;
}
// 자석: 반경 안 적(유령화 제외)의 진행 방향을 자석 쪽으로 즉시 돌림(속력 유지)
function pullEnemies(sim, b) {
  const R = PULL_R * sim.scale;
  let any = false;
  for (const o of sim.balls) {
    if (o.team === b.team || o.phaseT > 0) continue;
    const dx = b.x - o.x, dy = b.y - o.y, d = Math.hypot(dx, dy);
    if (d > R || d < 1e-6) continue;
    const sp = Math.hypot(o.vx, o.vy);
    o.vx = (dx / d) * sp; o.vy = (dy / d) * sp;
    any = true;
  }
  if (any) emit(sim, { k: 'pull', x: b.x, y: b.y, r: R });
  return any;
}
// 근접 버프(흡혈·광폭화·거대화·반사막) AI: 이 반경(×scale) 안에 적이 있을 때만 사용
const NEAR_R = 150;
function enemyNear(sim, b) {
  const e = nearestEnemy(sim, b), R = NEAR_R * sim.scale + b.r;
  return !!e && (e.x - b.x) ** 2 + (e.y - b.y) ** 2 <= (R + e.r) ** 2;
}

// 스킬 발동. 실패(대상 없음, 상한 등)하면 false → 쿨다운 소모 없이 대기 (retry 종류는 RETRY_CD 대기)
function useSkill(sim, b, manual) {
  switch (b.type) {
    case 'charger': {
      const e = nearestEnemy(sim, b);
      if (!e) return false;
      const dx = e.x - b.x, dy = e.y - b.y, d = Math.hypot(dx, dy) || 1;
      b.dashT = 0.6;
      b.vx = (dx / d) * b.baseSpd * DASH_MUL;
      b.vy = (dy / d) * b.baseSpd * DASH_MUL;
      emit(sim, { k: 'dash', x: b.x, y: b.y });
      return true;
    }
    case 'spike':
      b.spikeT = 2.5;
      return true;
    case 'healer':
      if (!manual && b.hp > b.maxHp - 10) return false;
      b.hp = Math.min(b.maxHp, b.hp + HEAL_AMOUNT);
      emit(sim, { k: 'heal', x: b.x, y: b.y, id: b.id });
      return true;
    case 'twin':
      return spawnClone(sim, b);
    case 'shooter': {
      const e = nearestEnemy(sim, b);
      if (!e) return false;
      const dx = e.x - b.x, dy = e.y - b.y, d = Math.hypot(dx, dy) || 1;
      // 기존 사수와 같은 계산(단위 벡터 직접 전달) → 시드 결과 동일
      fireProj(sim, b, dx / d, dy / d, { dmg: PROJ_DMG, spd: 420, life: 2, r: 5 });
      emit(sim, { k: 'shoot', id: b.id });
      return true;
    }
    case 'guardian':
      b.shield = SHIELD_AMOUNT;
      b.shieldT = 4;
      return true;
    case 'mage': {
      const a = aimAngle(sim, b);
      if (a === null) return false;
      const spread = (15 * Math.PI) / 180;
      for (let k = -1; k <= 1; k++) fireAt(sim, b, a + k * spread, { dmg: 5, spd: 360, life: 1.6, r: 4.5, col: 'mage' });
      emit(sim, { k: 'shoot', id: b.id });
      return true;
    }
    case 'bomber': {
      const a0 = aimAngle(sim, b) || 0;
      for (let k = 0; k < 8; k++) fireAt(sim, b, a0 + (k * Math.PI) / 4, { dmg: 5, spd: 300, life: 0.5, r: 5, col: 'bomber' });
      emit(sim, { k: 'burst', x: b.x, y: b.y, type: 'bomber' });
      return true;
    }
    case 'vampire':
      if (!manual && !enemyNear(sim, b)) return false;
      b.drainT = 3;
      return true;
    case 'frost': {
      const a = aimAngle(sim, b);
      if (a === null) return false;
      fireAt(sim, b, a, { dmg: 5, spd: 380, life: 1.6, r: 5.5, col: 'frost', onHit: 'slow' });
      emit(sim, { k: 'shoot', id: b.id });
      return true;
    }
    case 'blink':
      return blinkTo(sim, b);
    case 'magnet':
      return pullEnemies(sim, b);
    case 'giant':
      if (!manual && !enemyNear(sim, b)) return false;
      b.growT = 3;
      b.r = b.baseR * GROW_MUL;
      return true;
    case 'poison': {
      const a = aimAngle(sim, b);
      if (a === null) return false;
      fireAt(sim, b, a, { dmg: 3, spd: 340, life: 1.6, r: 5.5, col: 'poison', onHit: 'poison' });
      emit(sim, { k: 'shoot', id: b.id });
      return true;
    }
    case 'storm': {
      const a0 = aimAngle(sim, b) || 0;
      for (let k = 0; k < 12; k++) fireAt(sim, b, a0 + (k * Math.PI) / 6, { dmg: 4, spd: 380, life: 0.8, r: 4, col: 'storm' });
      emit(sim, { k: 'burst', x: b.x, y: b.y, type: 'storm' });
      return true;
    }
    case 'berserker':
      if (!manual && !enemyNear(sim, b)) return false;
      b.rageT = 3.5;
      return true;
    case 'ghost':
      if (!manual && b.hp > b.maxHp * GHOST_HP) return false;
      b.phaseT = 2;
      return true;
    case 'mirror':
      if (!manual && !enemyNear(sim, b)) return false;
      b.shield = MIRROR_SHIELD;
      b.shieldT = MIRROR_T;
      b.reflectT = MIRROR_T;
      return true;
    case 'sniper': {
      const a = aimAngle(sim, b);
      if (a === null) return false;
      fireAt(sim, b, a, { dmg: 15, spd: 760, life: 1.2, r: 4, col: 'sniper' });
      emit(sim, { k: 'shoot', id: b.id });
      return true;
    }
    case 'swapper':
      return swapWithFarthest(sim, b);
  }
  return false;
}

// 신규 보너스는 타이머가 0이면 +0 → 기존 6종 값(부동소수 포함) 그대로
const effAtk = b => (b.atk + (b.spikeT > 0 ? SPIKE_BONUS : 0) + (b.dashT > 0 ? DASH_BONUS : 0)
  + (b.blinkT > 0 ? BLINK_BONUS : 0) + (b.growT > 0 ? GROW_BONUS : 0) + (b.rageT > 0 ? RAGE_BONUS : 0)) * DMG_MULT;

// 데미지 순서: 가시 경감(충돌만) → 실드 흡수 → HP. 반환값 = 실제로 깎인 HP (흡혈 계산용)
function applyDamage(b, dmg, collision) {
  if (collision && b.spikeT > 0) dmg *= 0.5;
  if (b.shieldT > 0 && b.shield > 0) {
    const ab = Math.min(b.shield, dmg);
    b.shield -= ab;
    dmg -= ab;
  }
  // 흡혈 기준은 피격 전 HP의 양수 부분까지 (초과 피해는 회복 대상 아님)
  const lost = Math.min(dmg, Math.max(0, b.hp));
  b.hp -= dmg;
  return lost;
}
// 흡혈: 준 충돌 피해(HP 기준)의 DRAIN_RATE만큼 회복, maxHp 상한. 같은 충돌에서 이미 HP 0 이하면 회복 없음
function drainHeal(sim, b, dealt) {
  if (!(b.drainT > 0) || !(dealt > 0) || b.hp <= 0) return;
  b.hp = Math.min(b.maxHp, b.hp + dealt * DRAIN_RATE);
  emit(sim, { k: 'drain', x: b.x, y: b.y });
}

function wallBounce(b) {
  if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
  else if (b.x > ARENA - b.r) { b.x = ARENA - b.r; b.vx = -Math.abs(b.vx); }
  if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); }
  else if (b.y > ARENA - b.r) { b.y = ARENA - b.r; b.vy = -Math.abs(b.vy); }
}

// 공-공: 질량 ∝ r² 탄성 충돌 + 겹침 분리. withHit이면 속도 교환과 데미지까지
function collide(sim, withHit) {
  const bs = sim.balls;
  for (let i = 0; i < bs.length; i++) {
    const a = bs[i];
    for (let j = i + 1; j < bs.length; j++) {
      const b = bs[j];
      // 유령화 중이면 통과 (분리·속도 교환·데미지 모두 없음)
      if (a.phaseT > 0 || b.phaseT > 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr) continue;
      const d = Math.sqrt(d2);
      const nx = d > 1e-6 ? dx / d : 1, ny = d > 1e-6 ? dy / d : 0;
      const ma = a.r * a.r, mb = b.r * b.r, ov = rr - d;
      a.x -= nx * ov * mb / (ma + mb); a.y -= ny * ov * mb / (ma + mb);
      b.x += nx * ov * ma / (ma + mb); b.y += ny * ov * ma / (ma + mb);
      if (!withHit) continue;
      const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (vn < 0) {
        const ka = (2 * mb / (ma + mb)) * vn, kb = (2 * ma / (ma + mb)) * vn;
        a.vx += ka * nx; a.vy += ka * ny;
        b.vx -= kb * nx; b.vy -= kb * ny;
      }
      if (a.team === b.team) continue;
      const key = Math.min(a.id, b.id) + '-' + Math.max(a.id, b.id);
      if ((sim.pairHitCd.get(key) || 0) > sim.time) continue;
      sim.pairHitCd.set(key, sim.time + PAIR_CD);
      const mul = sim.suddenDeath ? SUDDEN_MUL : 1;
      let da = effAtk(b) * mul * (1 - DMG_VAR + sim.rng() * 2 * DMG_VAR);
      let db = effAtk(a) * mul * (1 - DMG_VAR + sim.rng() * 2 * DMG_VAR);
      // 광폭화 중엔 받는 충돌 피해 증가
      if (a.rageT > 0) da *= RAGE_TAKEN;
      if (b.rageT > 0) db *= RAGE_TAKEN;
      const lostA = applyDamage(a, da, true);
      const lostB = applyDamage(b, db, true);
      drainHeal(sim, a, lostB);
      drainHeal(sim, b, lostA);
      emit(sim, { k: 'hit', x: a.x + nx * a.r, y: a.y + ny * a.r });
    }
  }
}

function rotateToward(b, ang, maxStep) {
  const cur = Math.atan2(b.vy, b.vx), sp = Math.hypot(b.vx, b.vy);
  const d = Math.atan2(Math.sin(ang - cur), Math.cos(ang - cur));
  const a = cur + clamp(d, -maxStep, maxStep);
  b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
}
// 직접 모드: 내 공 본체를 입력 방향으로 조향 (sim.steer = {dx, dy}, UI가 스텝마다 넣어 줌). 멈출 수는 없음
function playerSteering(sim) {
  const me = sim.manualId ? sim.bodies[sim.manualId - 1] : null;
  const st = sim.steer;
  if (!me || !me.alive || !st || (!st.dx && !st.dy)) return false;
  rotateToward(me, Math.atan2(st.dy, st.dx), STEER_RATE * DT);
  return true;
}

function normSpeed(sim, b) {
  let target = b.dashT > 0 ? b.baseSpd * DASH_MUL : b.baseSpd;
  if (b.slowT > 0) target *= SLOW_MUL;
  if (b.rageT > 0) target *= RAGE_SPD;
  const sp = Math.hypot(b.vx, b.vy);
  if (sp < 1e-6) {
    const a = sim.rng() * Math.PI * 2;
    b.vx = Math.cos(a) * target; b.vy = Math.sin(a) * target;
  } else {
    b.vx *= target / sp; b.vy *= target / sp;
  }
}

// 고정 스텝 1회: 스킬 → 이동 → 벽 → 공-공 → 투사체 → 버프/수명 → 서든데스 → 탈락 일괄 → 승패
function step(sim) {
  if (sim.result) return;
  sim.time += DT;
  if (!sim.suddenDeath && sim.time >= SUDDEN_AT) { sim.suddenDeath = true; emit(sim, { k: 'sudden' }); }

  // 1. 스킬
  for (const b of sim.bodies) {
    if (!b.alive) continue;
    if (b.cd > 0) b.cd = Math.max(0, b.cd - DT);
    if (b.cd > 0) { b.ready = false; continue; }
    b.ready = true;
    const manual = b.id === sim.manualId;
    if (manual && !sim.manualReq) continue;
    if (useSkill(sim, b, manual)) { b.cd = b.cdMax; b.ready = false; }
    else if (TYPES[b.type].retry) { b.cd = RETRY_CD; b.ready = false; }
    if (manual) sim.manualReq = false;
  }

  // 조향 (직접 모드 내 공)
  playerSteering(sim);

  // 2~3. 이동, 벽
  for (const b of sim.balls) { b.x += b.vx * DT; b.y += b.vy * DT; }
  for (const b of sim.balls) wallBounce(b);

  // 4. 공-공 (충돌 1회 + 분리만 2회, 벽 끼임 방지)
  collide(sim, true);
  for (let k = 0; k < 2; k++) {
    collide(sim, false);
    for (const b of sim.balls) wallBounce(b);
  }
  for (const b of sim.balls) normSpeed(sim, b);

  // 5. 투사체 (자기 팀 무시, 유령화 통과, 반사막은 튕겨냄, 벽·수명 소멸)
  for (const p of sim.projectiles) {
    p.x += p.vx * DT; p.y += p.vy * DT; p.life -= DT;
    if (p.life <= 0 || p.x < p.r || p.y < p.r || p.x > ARENA - p.r || p.y > ARENA - p.r) { p.dead = true; continue; }
    for (const b of sim.balls) {
      if (b.team === p.team || b.phaseT > 0) continue;
      if ((b.x - p.x) ** 2 + (b.y - p.y) ** 2 < (b.r + p.r) ** 2) {
        if (b.reflectT > 0) {
          // 반사: 법선 기준 속도 반사, 공 바깥으로 밀어낸 뒤 반사한 공의 팀·소유로 바뀜 (피해 없음)
          const dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy);
          const nx = d > 1e-6 ? dx / d : -p.vx / (Math.hypot(p.vx, p.vy) || 1);
          const ny = d > 1e-6 ? dy / d : -p.vy / (Math.hypot(p.vx, p.vy) || 1);
          const vn = p.vx * nx + p.vy * ny;
          if (vn < 0) { p.vx -= 2 * vn * nx; p.vy -= 2 * vn * ny; }
          p.x = b.x + nx * (b.r + p.r + 1); p.y = b.y + ny * (b.r + p.r + 1);
          p.team = b.team; p.ownerId = b.id;
          emit(sim, { k: 'reflect', x: p.x, y: p.y });
          break;
        }
        applyDamage(b, p.dmg, false);
        if (p.onHit === 'slow') b.slowT = SLOW_T;
        else if (p.onHit === 'poison') b.poisonT = POISON_T;
        emit(sim, { k: 'hit', x: p.x, y: p.y });
        p.dead = true;
        break;
      }
    }
  }
  sim.projectiles = sim.projectiles.filter(p => !p.dead);

  // 6. 버프/수명 (분신은 수명 끝 또는 HP 0이면 바로 사라짐)
  for (const b of sim.balls) {
    if (b.dashT > 0) b.dashT = Math.max(0, b.dashT - DT);
    if (b.spikeT > 0) b.spikeT = Math.max(0, b.spikeT - DT);
    if (b.shieldT > 0) { b.shieldT = Math.max(0, b.shieldT - DT); if (b.shieldT === 0) b.shield = 0; }
    // 신규 타이머 (기존 6종은 항상 0 → 분기만 추가, RNG 미사용)
    if (b.poisonT > 0) {
      b.hp -= POISON_DPS * DMG_MULT * DT; // 독: 실드 무시, HP에 직접
      b.poisonT = Math.max(0, b.poisonT - DT);
    }
    if (b.slowT > 0) b.slowT = Math.max(0, b.slowT - DT);
    if (b.drainT > 0) b.drainT = Math.max(0, b.drainT - DT);
    if (b.rageT > 0) b.rageT = Math.max(0, b.rageT - DT);
    if (b.phaseT > 0) b.phaseT = Math.max(0, b.phaseT - DT);
    if (b.reflectT > 0) b.reflectT = Math.max(0, b.reflectT - DT);
    if (b.blinkT > 0) b.blinkT = Math.max(0, b.blinkT - DT);
    if (b.growT > 0) { b.growT = Math.max(0, b.growT - DT); if (b.growT === 0) b.r = b.baseR; }
    if (b.isClone) {
      b.life -= DT;
      if (b.life <= 0 || b.hp <= 0) { b.alive = false; emit(sim, { k: 'clone', x: b.x, y: b.y }); }
    }
  }
  sim.balls = sim.balls.filter(b => b.alive);

  // 7. 서든데스: 본체 HP 초당 3 감소에서 시작해 점점 증가 (실드 무시, 치유끼리도 끝나도록)
  if (sim.suddenDeath) {
    const drain = (SUDDEN_DRAIN + SUDDEN_RAMP * (sim.time - SUDDEN_AT)) * DT;
    for (const b of sim.balls) if (!b.isClone) b.hp -= drain;
  }

  // 8. 탈락 일괄 — 같은 스텝 탈락은 같은 순위
  const out = sim.balls.filter(b => !b.isClone && b.hp <= 0);
  // 남은 본체 전원이 탈락하게 되면 HP(음수 포함)가 가장 높은 1개가 HP 1로 생존. 최고 HP 동률이 서로 다른 팀이면 무승부
  if (out.length > 1 && out.length === sim.bodies.filter(b => b.alive).length) {
    let best = out[0], tie = false;
    for (const b of out.slice(1)) {
      if (b.hp > best.hp) { best = b; tie = false; }
      else if (b.hp === best.hp && b.team !== best.team) tie = true;
    }
    if (!tie) { best.hp = 1; out.splice(out.indexOf(best), 1); }
  }
  if (out.length) {
    const ids = new Set(out.map(b => b.id));
    for (const b of out) { knockOut(b); emit(sim, { k: 'out', x: b.x, y: b.y, type: b.type }); }
    sim.balls = sim.balls.filter(b => b.alive && !ids.has(b.ownerId));
    sim.projectiles = sim.projectiles.filter(p => !ids.has(p.ownerId));
    sim.eliminations.push(out.map(b => b.id));
  }

  // 9. 승패 — 분신만 남은 팀은 이미 탈락. 살아 있는 팀(개인전은 공 = 팀)이 1개 이하면 끝
  const alive = sim.bodies.filter(b => b.alive);
  if (new Set(alive.map(b => b.team)).size <= 1) {
    sim.result = makeResult(sim, alive);
    sim.balls = sim.balls.filter(b => !b.isClone);
    sim.projectiles = [];
  }
  // 만료된 쌍 쿨다운 정리 (만료 항목은 없는 것과 같으므로 결과 영향 없음)
  if (++sim.stepN % PAIR_CD_SWEEP === 0) {
    for (const [k, v] of sim.pairHitCd) if (v <= sim.time) sim.pairHitCd.delete(k);
  }
}

// 탈락 처리: HP 0, 버프 해제(거대화 반지름 복원)
function knockOut(b) {
  b.alive = false; b.hp = 0; b.ready = false;
  b.r = b.baseR;
  b.growT = b.slowT = b.drainT = b.rageT = b.phaseT = b.reflectT = b.blinkT = b.poisonT = 0;
}
// 결과 객체: 개인전은 생존 1개가 승자(winnerId), 팀전은 승리 팀(winnerTeam 1..4, winnerId 0). 0이면 무승부
function makeResult(sim, alive) {
  if (!alive.length) return { winnerId: 0, winnerTeam: 0 };
  if (sim.battle !== 'team') return { winnerId: alive.length === 1 ? alive[0].id : 0, winnerTeam: alive.length === 1 ? alive[0].team : 0 };
  return { winnerId: 0, winnerTeam: alive[0].team };
}

// 직접 모드 스킬 요청: 쿨다운 중이면 무시
function requestManual(sim) {
  if (!sim || sim.result || !sim.manualId) return false;
  const b = sim.bodies[sim.manualId - 1];
  if (!b || !b.alive || b.cd > 0) return false;
  sim.manualReq = true;
  return true;
}

// 안전 상한 초과 시 강제 판정: 생존 본체 중 HP 최고 1개 승리, 최고 HP 동률이면 남은 전원 같은 순위로 무승부
// 팀전: 같은 규칙을 공 단위로 적용하되, 최고 HP 공의 팀이 승리(팀원은 생존 유지). 최고 HP가 여러 팀이면 무승부
function forceResult(sim) {
  if (sim.result) return;
  const alive = sim.bodies.filter(b => b.alive).sort((a, b) => b.hp - a.hp);
  let out, winTeam = 0, win = null;
  if (sim.battle === 'team') {
    const top = alive.length ? alive[0].hp : 0;
    const topTeams = new Set(alive.filter(b => b.hp === top).map(b => b.team));
    winTeam = topTeams.size === 1 ? alive[0].team : 0;
    out = alive.filter(b => b.team !== winTeam);
  } else {
    win = alive.length && (alive.length === 1 || alive[0].hp > alive[1].hp) ? alive[0] : null;
    out = alive.filter(b => b !== win);
  }
  for (const b of out) knockOut(b);
  if (out.length) sim.eliminations.push(out.map(b => b.id));
  sim.balls = sim.balls.filter(b => b.alive && !b.isClone);
  sim.projectiles = [];
  sim.result = sim.battle === 'team' ? { winnerId: 0, winnerTeam: winTeam } : { winnerId: win ? win.id : 0, winnerTeam: win ? win.team : 0 };
}

// 순위: 승자 1위, 이후 늦게 탈락한 그룹부터. 같은 그룹은 같은 순위
function standings(sim) {
  const res = [];
  let better = 0;
  if (sim.result && sim.result.winnerId) { res.push({ b: sim.bodies[sim.result.winnerId - 1], rank: 1 }); better = 1; }
  for (let g = sim.eliminations.length - 1; g >= 0; g--) {
    const rank = better + 1;
    for (const id of sim.eliminations[g]) res.push({ b: sim.bodies[id - 1], rank });
    better += sim.eliminations[g].length;
  }
  return res;
}

// 팀 순위: 승리 팀 1위, 나머지는 팀의 마지막 생존자가 늦게 탈락한 팀부터(같은 그룹에서 전멸하면 같은 순위)
// 반환 [{ team(1..4), rank, members: [본체…] }] — 팀원은 생존자 → 늦게 탈락한 순, 같으면 슬롯 순
function teamStandings(sim) {
  const groupOf = new Map();
  sim.eliminations.forEach((g, gi) => { for (const id of g) groupOf.set(id, gi); });
  const teams = new Map();
  for (const b of sim.bodies) {
    if (!teams.has(b.team)) teams.set(b.team, []);
    teams.get(b.team).push(b);
  }
  const key = b => (b.alive ? Infinity : groupOf.has(b.id) ? groupOf.get(b.id) : -1);
  const list = [];
  for (const [team, members] of teams) {
    members.sort((a, b) => key(b) - key(a) || a.slot - b.slot);
    const won = !!(sim.result && sim.result.winnerTeam === team);
    // 팀의 탈락 시점 = 가장 늦게 탈락한 팀원의 그룹 (생존자가 있으면 Infinity)
    list.push({ team, members, won, last: Math.max(...members.map(key)) });
  }
  list.sort((a, b) => (b.won - a.won) || (b.last - a.last) || a.team - b.team);
  let better = 0;
  list.forEach((e, i) => {
    const prev = list[i - 1];
    e.rank = prev && prev.won === e.won && prev.last === e.last ? prev.rank : better + 1;
    better++;
  });
  return list;
}

// ?seed= 재현 (숫자 또는 문자열)
const urlSeed = (() => {
  const v = new URLSearchParams(location.search).get('seed');
  if (v === null || v === '') return null;
  const n = Number(v);
  if (Number.isFinite(n)) return n >>> 0;
  let h = 2166136261;
  for (let i = 0; i < v.length; i++) h = Math.imul(h ^ v.charCodeAt(i), 16777619);
  return h >>> 0;
})();

const state = {

  battle: 'ffa', teamCount: 2, teams: [],

  // 꾸미기: looks[i] = lineup[i]의 모양 { color, face, hat, trail, name } 또는 null(기본). 표시 전용 — 엔진·RNG 미사용

const LOOKS_KEY = 'ballbattle-looks'; // { v: 1, looks: [...] } — lineup과 같은 순서
const FACES = ['none', 'eyes', 'happy', 'angry', 'cool', 'sleepy'];

function detectLang() {

let lang = detectLang();

try {

    let keep = null;

      keep = sv.lineup.map((ty, i) => i).filter(i => TYPE_IDS.includes(sv.lineup[i])).slice(0, MAX_BALLS);

    if (sv && Array.isArray(sv.teams)) state.teams = keep ? keep.map(i => sv.teams[i]) : sv.teams.slice();
    if (sv && typeof sv.pageBg === 'string' && HEX_RE.test(sv.pageBg)) state.pageBg = sv.pageBg.toLowerCase();

  state.pageBg = ''; state.arenaTheme = 'city';
}
if (!state.lineup.length) state.myIndex = -1;
else if (!(state.myIndex >= 0 && state.myIndex < state.lineup.length)) state.myIndex = 0;
// 팀 배정 검증: 길이가 다르거나 범위 밖 값이 있으면 자동 배분(i % teamCount)으로 다시
if (state.teams.length !== state.lineup.length ||
    state.teams.some(v => !Number.isInteger(v) || v < 0 || v >= state.teamCount)) autoTeams();

// ===== 꾸미기 저장 (localStorage LOOKS_KEY) =====
const defaultLook = () => ({ color: '', face: 'none', hat: 'none', trail: 'none', name: '' });
// 잘못된 값은 기본값으로. 모두 기본이면 null
function normLook(o) {
  if (!o || typeof o !== 'object') return null;
  const lk = defaultLook();
  if (typeof o.color === 'string' && HEX_RE.test(o.color)) lk.color = o.color.toLowerCase();
  if (FACES.includes(o.face)) lk.face = o.face;
  if (HATS.includes(o.hat)) lk.hat = o.hat;
  if (TRAILS.includes(o.trail)) lk.trail = o.trail;
  if (typeof o.name === 'string') lk.name = o.name.replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim().slice(0, NICK_MAX);
  return lk.color || lk.face !== 'none' || lk.hat !== 'none' || lk.trail !== 'none' || lk.name ? lk : null;
}
// looks 길이를 lineup에 맞춤(모자라면 null, 넘치면 자름)
function fitLooks() {
  state.looks = state.lineup.map((_, i) => normLook(state.looks[i]));
}
try {

fitLooks();
function saveLooks() {

}

// 팀 자동 배분: 순서대로 A, B, C… 돌아가며
function autoTeams() { state.teams = state.lineup.map((_, i) => i % state.teamCount); }
// 인원이 가장 적은 팀(동률이면 앞 팀)
function smallestTeam() {
  const cnt = new Array(state.teamCount).fill(0);
  for (const v of state.teams) if (v >= 0 && v < state.teamCount) cnt[v]++;
  let best = 0;
  for (let k = 1; k < cnt.length; k++) if (cnt[k] < cnt[best]) best = k;
  return best;
}
// 공이 있는 팀 수
const filledTeams = () => new Set(state.teams).size;
// 시작 가능: 공 2개 이상 + 팀전이면 공이 있는 팀 2개 이상
const canStart = () => state.lineup.length >= MIN_BALLS && (state.battle !== 'team' || filledTeams() >= 2);
const teamName = idx => tf('teamName', { t: TEAM_LETTERS[idx] || '?' });

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      lineup: state.lineup, mode: state.mode, speed: state.speed, myIndex: state.myIndex,
      battle: state.battle, teamCount: state.teamCount, teams: state.teams,
      pageBg: state.pageBg, arenaTheme: state.arenaTheme,

}

const t = k => {
  const v = (I18N[lang] && I18N[lang][k]) || I18N.en[k];

};
// {키} 치환. 값이 함수면 숫자 인자로 호출 (서수 등)
const tf = (k, vars) => {
  const v = t(k);
  if (typeof v === 'function') return v(vars.n);
  return v.replace(/\{(\w+)\}/g, (m, p) => (p in vars ? vars[p] : m));
};
const ballName = (type, dupIndex, dupCount) => t(type) + (dupCount > 1 ? ' ' + dupIndex : '');

function customName(i) {

}
const bodyName = b => customName(b.slot - 1) || ballName(b.type, b.dupIndex, b.dupCount);
const fullName = b => '#' + b.slot + ' ' + bodyName(b);
const editable = () => state.phase === 'select' || state.phase === 'over';

function applyLang() {

const colors = {};

  colors.abg = {};

const isDark = () => {
  const th = document.documentElement.dataset.theme;
  return th === 'dark' || (th !== 'light' && darkMQ.matches);
};

// ===== 배경 (테마별) — 오프스크린에 한 번만 그림. 고정 시드라 매번 같은 모양, 게임 RNG와 분리 =====
const BG_SEED = 20261107;
const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d');
function renderBackground() {
  bgCanvas.width = canvas.width;
  bgCanvas.height = canvas.height;
  const c = bgCtx, rng = mulberry32(BG_SEED), dark = isDark();
  const rand = (a, b) => a + rng() * (b - a);
  c.setTransform(canvas.width / ARENA, 0, 0, canvas.height / ARENA, 0, 0);
  const th = state.arenaTheme;
  if (th === 'plain') {
    c.fillStyle = colors.arena;
    c.fillRect(0, 0, ARENA, ARENA);
  } else if (colors.abg[th]) {
    renderScenery(c, th, colors.abg[th], rand, rng, dark);
  } else {
    renderCity(c, rand, rng, dark);
  }
  c.globalAlpha = 1;
  bgDirty = false;
}
// 하늘 그라디언트 + 바닥에서 올라오는 능선(y = base - 높이 함수)
function bgSky(c, p) {
  const sky = c.createLinearGradient(0, 0, 0, ARENA);
  sky.addColorStop(0, p.sky1);
  sky.addColorStop(1, p.sky2);
  c.fillStyle = sky;
  c.fillRect(0, 0, ARENA, ARENA);
}
function bgRidge(c, color, fn, step) {
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(0, ARENA);
  for (let x = 0; x <= ARENA; x += step) c.lineTo(x, fn(x));
  c.lineTo(ARENA, ARENA);
  c.closePath();
  c.fill();
}
// 사인 합성 능선 (위상은 고정 RNG)
function waveFn(base, amps, rand) {
  const ph = amps.map(() => rand(0, Math.PI * 2));
  return x => base - amps.reduce((s, [a, f], k) => s + a * Math.sin(x * f + ph[k]), 0);
}
function bgPine(c, x, yBase, w, h) {
  c.beginPath();
  for (let k = 0; k < 3; k++) {
    const y0 = yBase - h * (k * 0.28), ww = w * (1 - k * 0.22);
    c.moveTo(x - ww / 2, y0); c.lineTo(x, y0 - h * 0.5); c.lineTo(x + ww / 2, y0);
  }
  c.rect(x - w * 0.06, yBase, w * 0.12, h * 0.12);
  c.fill();
}
function bgDots(c, color, n, rand, yMin, yMax, rMin, rMax, alpha) {
  c.fillStyle = color;
  c.globalAlpha = alpha;
  for (let i = 0; i < n; i++) {
    c.beginPath(); c.arc(rand(0, ARENA), rand(yMin, yMax), rand(rMin, rMax), 0, Math.PI * 2); c.fill();
  }
  c.globalAlpha = 1;
}
function renderScenery(c, th, p, rand, rng, dark) {
  bgSky(c, p);
  switch (th) {
    case 'forest': {
      // 먼 언덕 + 먼 숲, 가까운 큰 소나무, 반딧불(accent)
      const hill = waveFn(400, [[30, 0.008], [14, 0.021]], rand);
      bgRidge(c, p.far, hill, 6);
      c.fillStyle = p.far;
      for (let x = -10; x < ARENA + 10; x += rand(14, 26)) bgPine(c, x, hill(clamp(x, 0, ARENA)) + 6, rand(22, 34), rand(60, 100));
      const ground = waveFn(520, [[10, 0.012], [6, 0.03]], rand);
      bgRidge(c, p.near, ground, 6);
      c.fillStyle = p.near;
      for (let x = -20; x < ARENA + 20; x += rand(50, 90)) bgPine(c, x, ground(clamp(x, 0, ARENA)) + 8, rand(40, 60), rand(120, 190));
      bgDots(c, p.accent, 26, rand, 180, 560, 1.5, 3, dark ? 0.9 : 0.8);
      break;
    }
    case 'desert': {
      // 태양(accent), 먼 모래 언덕, 가까운 언덕 + 선인장
      c.fillStyle = p.accent;
      c.globalAlpha = 0.85;
      c.beginPath(); c.arc(rand(380, 500), rand(110, 170), 46, 0, Math.PI * 2); c.fill();
      c.globalAlpha = 1;
      bgRidge(c, p.far, waveFn(420, [[34, 0.007], [12, 0.019]], rand), 6);
      const near = waveFn(510, [[22, 0.01], [8, 0.027]], rand);
      bgRidge(c, p.near, near, 6);
      c.fillStyle = p.near;
      for (let k = 0; k < 4; k++) {
        const x = rand(40, ARENA - 40), y = near(x) + 4, h = rand(50, 80), w = 12;
        c.fillRect(x - w / 2, y - h, w, h);
        c.beginPath(); c.arc(x, y - h, w / 2, 0, Math.PI * 2); c.fill();
        // 양팔
        const ah = h * 0.45;
        c.fillRect(x - w * 1.8, y - h * 0.6, w * 1.3, 7); c.fillRect(x - w * 1.8, y - h * 0.6 - ah, 7, ah);
        c.fillRect(x + w * 0.5, y - h * 0.45, w * 1.3, 7); c.fillRect(x + w * 1.8 - 7, y - h * 0.45 - ah * 0.8, 7, ah * 0.8);
      }
      break;
    }
    case 'space': {
      // 별(accent), 먼 행성(far), 가까운 달 표면(near) + 크레이터
      bgDots(c, p.accent, 90, rand, 0, 460, 0.6, 1.8, dark ? 0.9 : 0.75);
      const px = rand(110, 180), py = rand(120, 180);
      c.fillStyle = p.far;
      c.beginPath(); c.arc(px, py, 70, 0, Math.PI * 2); c.fill();
      c.strokeStyle = p.near; c.lineWidth = 6;
      c.beginPath(); c.ellipse(px, py, 110, 20, -0.35, 0, Math.PI * 2); c.stroke();
      const ground = waveFn(500, [[16, 0.009], [7, 0.026]], rand);
      bgRidge(c, p.near, ground, 6);
      c.fillStyle = p.far;
      for (let k = 0; k < 7; k++) {
        const x = rand(20, ARENA - 20), y = rand(ground(x) + 20, ARENA - 10);
        c.beginPath(); c.ellipse(x, y, rand(10, 26), rand(4, 8), 0, 0, Math.PI * 2); c.fill();
      }
      break;
    }
    case 'ocean': {
      // 수평선 아래 물결 층(far → near), 물보라·윤슬(accent)
      bgRidge(c, p.far, waveFn(300, [[4, 0.03], [2, 0.08]], rand), 4);
      for (let k = 0; k < 4; k++) {
        bgRidge(c, k % 2 ? p.far : p.near, waveFn(360 + k * 60, [[6 + k * 2, 0.025 - k * 0.003], [3, 0.07]], rand), 4);
      }
      c.strokeStyle = p.accent; c.lineWidth = 2; c.globalAlpha = dark ? 0.7 : 0.85;
      for (let i = 0; i < 24; i++) {
        const x = rand(0, ARENA), y = rand(310, 590), w = rand(8, 20);
        c.beginPath(); c.moveTo(x - w / 2, y); c.quadraticCurveTo(x, y - 4, x + w / 2, y); c.stroke();
      }
      c.globalAlpha = 1;
      break;
    }
    case 'volcano': {
      // 먼 산맥, 가까운 화산 원뿔 + 분화구 용암(accent), 불씨
      bgRidge(c, p.far, x => 430 - Math.abs(Math.sin(x * 0.012 + 1.3)) * 70 - Math.sin(x * 0.031) * 12, 6);
      const cx = rand(260, 340), top = 250, half = 300;
      c.fillStyle = p.near;
      c.beginPath();
      c.moveTo(cx - half, ARENA); c.lineTo(cx - 40, top); c.lineTo(cx + 40, top); c.lineTo(cx + half, ARENA);
      c.closePath(); c.fill();
      c.fillStyle = p.accent;
      c.beginPath(); c.ellipse(cx, top + 2, 38, 7, 0, 0, Math.PI * 2); c.fill();
      // 용암 줄기
      c.strokeStyle = p.accent; c.lineWidth = 5; c.lineCap = 'round';
      for (let k = 0; k < 3; k++) {
        let x = cx + rand(-25, 25), y = top + 4;
        c.beginPath(); c.moveTo(x, y);
        for (let s = 0; s < 6; s++) { x += rand(-16, 16); y += rand(25, 45); c.lineTo(x, y); }
        c.stroke();
      }
      c.lineCap = 'butt';
      bgDots(c, p.accent, 22, rand, 120, 260, 1.2, 2.8, 0.8);
      break;
    }
    case 'snow': {
      // 먼 설산(far) + 눈 덮인 봉우리, 가까운 언덕(near) + 소나무, 눈송이(accent)
      const peaks = [];
      for (let x = -40; x < ARENA + 80; x += rand(90, 150)) peaks.push([x, rand(220, 330)]);
      c.fillStyle = p.far;
      c.beginPath(); c.moveTo(-40, ARENA);
      for (const [x, y] of peaks) { c.lineTo(x - 70, 470); c.lineTo(x, y); c.lineTo(x + 70, 470); }
      c.lineTo(ARENA + 80, ARENA); c.closePath(); c.fill();
      c.fillStyle = p.accent;
      for (const [x, y] of peaks) {
        c.beginPath(); c.moveTo(x, y); c.lineTo(x - 22, y + 34); c.lineTo(x - 6, y + 28); c.lineTo(x + 6, y + 36); c.lineTo(x + 22, y + 32);
        c.closePath(); c.fill();
      }
      const ground = waveFn(515, [[14, 0.01], [6, 0.028]], rand);
      bgRidge(c, p.near, ground, 6);
      c.fillStyle = p.near;
      for (let x = rand(10, 60); x < ARENA; x += rand(70, 130)) bgPine(c, x, ground(x) + 6, rand(30, 44), rand(80, 120));
      bgDots(c, p.accent, 60, rand, 0, ARENA, 1, 2.6, dark ? 0.8 : 0.95);
      break;
    }
  }
}
// 도시 (기존 그림 그대로 — 같은 RNG 순서)
function renderCity(c, rand, rng, dark) {
  // ① 하늘
  const sky = c.createLinearGradient(0, 0, 0, ARENA);
  sky.addColorStop(0, colors.skyTop);
  sky.addColorStop(1, colors.skyBottom);
  c.fillStyle = sky;
  c.fillRect(0, 0, ARENA, ARENA);
  // ② 먼 층: 빈틈없이, 창문 없음
  c.fillStyle = colors.bldgFar;
  for (let x = -10; x <= ARENA + 10;) {
    const w = rand(40, 80), bh = rand(160, 300);
    c.fillRect(x, ARENA - bh, w, bh);
    x += w;
  }
  // ③ 가까운 층 + 옥상 소품 (30%)
  const near = [];
  c.fillStyle = colors.bldgNear;
  for (let x = -10; x <= ARENA + 10;) {
    const w = rand(50, 100), bh = rand(90, 200);
    c.fillRect(x, ARENA - bh, w, bh);
    if (rng() < 0.3) {
      const pw = rand(6, 14), ph = rand(8, 20);
      c.fillRect(x + rand(4, Math.max(4, w - pw - 4)), ARENA - bh - ph, pw, ph);
    }
    near.push({ x, w, bh });
    x += w + rand(0, 12);
  }
  // ④ 창문: 6×8, 간격 가로 6/세로 8, 여백 좌우 8/위 10/아래 6, 가로 가운데 정렬
  const WW = 6, WH = 8, GX = 6, GY = 8;
  c.fillStyle = colors.bldgWin;
  c.globalAlpha = dark ? 0.55 : 0.6;
  for (const b of near) {

        if (glow) { c.shadowColor = colors.bldgWin; c.shadowBlur = 4; }
        c.fillRect(x0 + k * (WW + GX), y0 + r * (WH + GY), WW, WH);

// ===== 파티클 (시뮬레이션 RNG와 분리 → 시드 재현에 영향 없음) =====
let particles = [];

// 투사체·효과 색: 빙결은 공 색 대신 효과색
const fxColor = key => (key === 'frost' ? colors.frostFx : colors[key] || colors.shooter);

Sfx.define('hit', (S, t) => { S.noise(t, 0.05, { vol: 0.35, hp: 1200 }); S.tone(t, 220, 0.05, { vol: 0.25, to: 110 }); }, 80);

// ===== 무기 (표시 전용 상태: 각도 보간·연출 타이머. 시뮬레이션과 분리) =====
const HAND_SIDE = (40 * Math.PI) / 180;

}
// 무기가 향할 각도: 사수·돌격·마법·빙결·독·저격은 가장 가까운 적, 교환은 가장 먼 적,

const AIM_NEAREST = new Set(['shooter', 'charger', 'mage', 'frost', 'poison', 'sniper']);

  if (b.type === 'charger' && b.dashT > 0) return Math.atan2(b.vy, b.vx);
  if (!b.isClone && AIM_NEAREST.has(b.type)) {
    const e = nearestEnemy(sim, b);
    if (e) return Math.atan2(e.y - b.y, e.x - b.x);
  }
  if (!b.isClone && b.type === 'swapper') {
    let far = null, fd = -1;
    for (const o of sim.balls) {
      if (o.team === b.team || o.isClone || o.phaseT > 0) continue;
      const d = (o.x - b.x) ** 2 + (o.y - b.y) ** 2;
      if (d > fd) { fd = d; far = o; }

function updateWeapons(sim, dt) {

  // 번호 (꾸미기 표정이 있으면 표정, 번호는 아래 이름표로)
  const hasFace = lk && lk.face !== 'none';
  if (hasFace) {
    drawFace(ctx, b.x, b.y, b.r, lk.face, col);
  } else {
    ctx.fillStyle = colors.label;
    // 공 번호: 화면에서 12px 이상 (분신은 공 크기를 넘지 않게)
    const numFs = b.isClone ? Math.min(b.r * 1.3, Math.max(b.r * 0.9, minFont(10))) : Math.max(b.r * 0.85, minFont(12));
    ctx.font = '700 ' + numFs.toFixed(1) + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(b.slot), b.x, b.y + 1);
  }
  // 팀 링 (팀전, r+3)
  if (state.sim && state.sim.battle === 'team' && colors.team[b.team - 1]) {
    ctx.strokeStyle = colors.team[b.team - 1];
    ctx.lineWidth = b.isClone ? 2 : 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI * 2); ctx.stroke();
  }
  // 실드 (r+5)
  if (b.shieldT > 0 && b.shield > 0) {
    ctx.strokeStyle = colors.shield;
    ctx.lineWidth = 1.5 + Math.min(1, b.shield / SHIELD_AMOUNT) * 3;
    ctx.globalAlpha = 0.9 * baseA;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = baseA;
  }
  // 둔화: 효과색 점선 링 (천천히 회전)
  if (b.slowT > 0) {
    ctx.strokeStyle = colors.frostFx;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.lineDashOffset = -now * 12;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 6.5, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
  }
  // 반사막: 육각 링 (r+8)
  if (b.reflectT > 0) {
    ctx.strokeStyle = colors.mirror;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let k = 0; k <= 6; k++) {
      const a = (k / 6) * Math.PI * 2 + now * 0.8, R = b.r + 8;
      if (k === 0) ctx.moveTo(b.x + Math.cos(a) * R, b.y + Math.sin(a) * R);
      else ctx.lineTo(b.x + Math.cos(a) * R, b.y + Math.sin(a) * R);
    }
    ctx.stroke();
  }
  // 독: 공 위로 떠오르는 거품 3개
  if (b.poisonT > 0) {
    ctx.fillStyle = colors.poison;
    ctx.strokeStyle = colors.outline;
    ctx.lineWidth = 1;
    for (let k = 0; k < 3; k++) {
      const ph = (now * 0.9 + k / 3) % 1;
      const x = b.x + (k - 1) * b.r * 0.55, y = b.y - b.r * 0.4 - ph * b.r * 0.9;
      ctx.globalAlpha = (reduced ? 0.9 : 1 - ph) * baseA;
      ctx.beginPath(); ctx.arc(x, y, 2.5 + k * 0.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = baseA;
  }
  // 체력 막대 + 내 공 표시 (유령화 중에도 읽을 수 있게 불투명)
  if (!b.isClone) {
    ctx.globalAlpha = 1;
    // HP 숫자: 화면에서 11px 이상
    const fs = Math.max(minFont(11), Math.min(13, Math.round(13 * state.sim.scale)));
    const w = b.r * 2;
    const flip = b.y - b.r - 10 - fs - 2 < 0;
    const y = flip ? b.y + b.r + 6 : b.y - b.r - 10;
    ctx.fillStyle = colors.hpBg;
    ctx.fillRect(b.x - b.r, y, w, 4);
    const f = clamp(b.hp / b.maxHp, 0, 1);
    ctx.fillStyle = f <= 0.3 ? colors.hpLow : colors.hpOk;
    ctx.fillRect(b.x - b.r, y, w * f, 4);
    // HP 숫자: 외곽선 후 채우기
    const ty = flip ? y + 6 : y - 2;
    const txt = String(Math.max(0, Math.ceil(b.hp)));
    ctx.font = '700 ' + fs + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = flip ? 'top' : 'bottom';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3;
    ctx.strokeStyle = colors.hpTextOutline;
    ctx.strokeText(txt, b.x, ty);
    ctx.fillStyle = colors.hpText;
    ctx.fillText(txt, b.x, ty);
    // 이름표: 별명(또는 직접 모드 내 공의 프로필 이름). 표정을 단 공은 번호도 여기에. 체력 막대 반대쪽
    const nick = customName(b.slot - 1);
    const tag = (hasFace ? '#' + b.slot + (nick ? ' ' : '') : '') + nick;
    if (tag) {
      const lfs = Math.max(minFont(11), Math.min(13, Math.round(13 * state.sim.scale)));
      ctx.font = '700 ' + lfs + 'px system-ui, sans-serif';
      ctx.textBaseline = flip ? 'bottom' : 'top';
      const ly = flip ? b.y - b.r - 3 - (lk && lk.hat !== 'none' ? b.r * 0.5 : 0) : b.y + b.r + 4;
      // 테마와 관계없이 짙은 테두리 + 밝은 글자 (밝은/어두운 아레나 모두 읽힘)
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = colors.ink;
      ctx.strokeText(tag, b.x, ly);
      ctx.fillStyle = colors.cream;
      ctx.fillText(tag, b.x, ly);
    }
    if (isMine) {
      // 내 공 표시: 숫자 바깥쪽 삼각형
      const my = flip ? ty + fs + 3 : ty - fs - 3, d = flip ? -1 : 1;
      ctx.fillStyle = colors.accent;
      ctx.beginPath();
      ctx.moveTo(b.x - 7, my - 9 * d); ctx.lineTo(b.x + 7, my - 9 * d); ctx.lineTo(b.x, my);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

function draw() {
  if (bgDirty) renderBackground();
  ctx.drawImage(bgCanvas, 0, 0, ARENA, ARENA);
  const s = state.sim;
  if (!s) return;
  if (s.suddenDeath) {
    ctx.strokeStyle = colors.danger;
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, ARENA - 6, ARENA - 6);
  }
  for (const p of s.projectiles) {
    ctx.fillStyle = fxColor(p.col);
    ctx.strokeStyle = colors.outline;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  const myId = state.mode === 'play' && state.myIndex >= 0 ? state.myIndex + 1 : 0;
  for (const b of s.balls) if (b.isClone) drawBall(b, false);
  for (const b of s.balls) if (!b.isClone) drawBall(b, b.id === myId);
  if (myId && state.phase !== 'select' && s.manualId === myId) {
    const me = s.bodies[myId - 1];
    if (me && me.alive) { drawMyRing(me); drawMyArrow(me); }
    drawAim();
  }
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    if (p.kind === 'plus') {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 4, p.y - 1.25, 8, 2.5);
      ctx.fillRect(p.x - 1.25, p.y - 4, 2.5, 8);
    } else if (p.kind === 'ring') {
      const k = 1 - clamp(p.life / p.max, 0, 1);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, p.r0 + (p.r1 - p.r0) * k), 0, Math.PI * 2); ctx.stroke();
    } else if (p.kind === 'line') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x2, p.y2); ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ===== 구성 목록 =====
function renderLineup(focusIndex) {
  const ul = $('lineup');
  ul.textContent = '';
  const dups = dupInfo(state.lineup);
  state.lineup.forEach((ty, i) => {
    const name = ballName(ty, dups[i].dupIndex, dups[i].dupCount);
    const nick = customName(i), look = state.looks[i];
    const li = document.createElement('li');
    li.className = 'lineup-item' + (look ? ' customized' : '');
    li.dataset.i = i;
    const num = document.createElement('span');
    num.className = 'li-num';
    num.textContent = i + 1;
    const dot = document.createElement('span');
    dot.className = 'li-dot' + (dups[i].dupIndex === 2 ? ' dup2' : dups[i].dupIndex >= 3 ? ' dup3' : '');
    dot.style.background = 'var(--c-' + ty + ')';
    const nm = document.createElement('span');
    nm.className = 'li-name';
    nm.textContent = nick ? nick + ' · ' + name : name;
    // 꾸민 공: 모습 미리보기(색·표정·모자·흔적)가 점 대신
    if (look) {
      const cv = document.createElement('canvas');
      cv.className = 'li-preview';
      cv.dataset.i = i;
      cv.setAttribute('aria-hidden', 'true');
      li.appendChild(cv);
    }
    // 큰 꾸미기 버튼 (타일 아무 곳이나 눌러도 열림)
    const edit = document.createElement('button');
    edit.className = 'li-edit';
    edit.type = 'button';
    edit.dataset.i = i;
    edit.textContent = t('customize');
    edit.setAttribute('aria-label', tf('customizeOf', { name: '#' + (i + 1) + ' ' + (nick || name) }));
    edit.setAttribute('aria-haspopup', 'dialog');
    edit.disabled = !editable();
    const del = document.createElement('button');
    del.className = 'li-del';
    del.type = 'button';
    del.dataset.i = i;
    del.textContent = '×';
    del.setAttribute('aria-label', tf('del', { name: '#' + (i + 1) + ' ' + name }));
    del.disabled = !editable();
    li.append(num, dot, nm, edit);
    // 팀 칩 (팀전): 누르면 다음 팀으로 순환
    if (state.battle === 'team') {
      const tm = state.teams[i] || 0;
      const chip = document.createElement('button');
      chip.className = 'li-team t-' + TEAM_LETTERS[tm].toLowerCase();
      chip.type = 'button';
      chip.dataset.i = i;
      chip.textContent = TEAM_LETTERS[tm];
      chip.setAttribute('aria-label', tf('teamLabel', { name: '#' + (i + 1) + ' ' + name, team: teamName(tm) }));
      chip.disabled = !editable();
      li.appendChild(chip);
    }
    li.appendChild(del);
    ul.appendChild(li);
  });
  paintLookPreviews();
  // 삭제 후 포커스 유지
  if (focusIndex !== undefined) {
    const dels = ul.querySelectorAll('.li-del');
    if (dels.length) dels[Math.min(focusIndex, dels.length - 1)].focus();
    else $('addBar').querySelector('.add-btn').focus();
  }
}

// 표시 이름이 바뀔 때(모드·내 공·프로필): 출전 타일과 체력 목록 이름 다시
function refreshNames() {
  renderLineup();
  if (!inBattle()) buildHpRows();
}
function renderMySelect() {
  const sel = $('mySelect');
  sel.textContent = '';
  const dups = dupInfo(state.lineup);
  if (!state.lineup.length) {
    const o = document.createElement('option');
    o.value = '-1';
    o.textContent = t('none');
    sel.appendChild(o);
  }
  state.lineup.forEach((ty, i) => {
    const o = document.createElement('option');
    o.value = i;
    const lk = state.looks[i];
    o.textContent = '#' + (i + 1) + ' ' + ((lk && lk.name) ? lk.name + ' · ' : '') + ballName(ty, dups[i].dupIndex, dups[i].dupCount);
    sel.appendChild(o);
  });
  sel.value = String(state.myIndex);
  sel.disabled = !state.lineup.length || inBattle();
}

// ===== 체력 목록 =====
let hpRows = new Map(); // id → { row, fill, val, cd, name }
let teamHeads = new Map(); // 팀(1..4) → { head, alive, fill, members: [본체…] }
function buildHpRows() {
  const list = $('hpList');
  list.textContent = '';
  hpRows = new Map();
  teamHeads = new Map();
  const s = state.sim;
  if (!s) return;
  // 팀전: 팀 헤더 (.team-head.t-x > .team-dot, .team-name, .team-alive, .team-bar > .team-fill)
  if (s.battle === 'team') {
    for (const b of s.bodies) {
      if (!teamHeads.has(b.team)) teamHeads.set(b.team, { members: [] });
      teamHeads.get(b.team).members.push(b);
    }
    teamHeads = new Map(Array.from(teamHeads).sort((a, b) => a[0] - b[0]));
    for (const [tm, th] of teamHeads) {
      const head = document.createElement('div');
      head.className = 'team-head t-' + TEAM_LETTERS[tm - 1].toLowerCase();
      const dot = document.createElement('span');
      dot.className = 'team-dot';
      const name = document.createElement('span');
      name.className = 'team-name';
      name.textContent = teamName(tm - 1);
      const alive = document.createElement('span');
      alive.className = 'team-alive';
      const bar = document.createElement('div');
      bar.className = 'team-bar';
      const fill = document.createElement('div');
      fill.className = 'team-fill';
      bar.appendChild(fill);
      head.append(dot, name, alive, bar);
      Object.assign(th, { head, alive, fill });
    }
  }
  for (const b of s.bodies) {
    const row = document.createElement('div');
    row.className = 'hp-row';
    const num = document.createElement('span');
    num.className = 'hp-num';
    num.textContent = b.slot;
    const name = document.createElement('span');
    name.className = 'hp-name';
    name.textContent = bodyName(b);
    const bar = document.createElement('div');
    bar.className = 'hp-bar';
    const fill = document.createElement('div');
    fill.className = 'hp-fill';
    bar.appendChild(fill);
    const val = document.createElement('span');
    val.className = 'hp-val';
    const cur = document.createTextNode('');
    const max = document.createElement('span');
    max.className = 'hp-max';
    max.textContent = '/' + b.maxHp;
    val.append(cur, max);
    const cd = document.createElement('span');
    cd.className = 'cd';
    row.append(num, name, bar, val, cd);
    list.appendChild(row);
    hpRows.set(b.id, { row, fill, val, cur, cd, name, prev: b.hp, hitT: 0 });
  }
  renderHp();
}
function setText(el, s) { if (el.textContent !== s) el.textContent = s; }
const HP_FLASH_MIN = 3, HP_FLASH_MS = 250;
function flashRow(r) {
  r.row.classList.remove('hit');
  void r.row.offsetWidth; // 애니메이션 다시 시작
  r.row.classList.add('hit');
  clearTimeout(r.hitT);
  r.hitT = setTimeout(() => r.row.classList.remove('hit'), HP_FLASH_MS);
}
function renderHp() {
  const s = state.sim;
  if (!s) return;
  const showCd = state.phase !== 'select';
  const myId = state.mode === 'play' && state.myIndex >= 0 ? state.myIndex + 1 : 0;
  for (const b of s.bodies) {
    const r = hpRows.get(b.id);
    if (!r) continue;
    const f = clamp(b.hp / b.maxHp, 0, 1);
    r.fill.style.width = (f * 100).toFixed(1) + '%';
    r.fill.classList.toggle('low', f <= 0.3);
    r.row.classList.toggle('out', !b.alive);
    const cur = String(Math.max(0, Math.ceil(b.hp)));
    if (r.cur.nodeValue !== cur) r.cur.nodeValue = cur;
    r.row.classList.toggle('mine', b.id === myId);
    // 맞으면 HP 막대 번쩍 (지속 피해의 작은 감소는 무시)
    if (state.phase === 'running' && r.prev - b.hp >= HP_FLASH_MIN) flashRow(r);
    r.prev = b.hp;
    setText(r.cd,!showCd || !b.alive ? (b.alive ? '' : '—') : b.cd > 0 ? b.cd.toFixed(1) : '✓');
  }
  // 생존 순(슬롯) → 탈락 행은 맨 아래(순위 순)
  const order = s.bodies.filter(b => b.alive).map(b => b.id);
  if (order.length < s.bodies.length) {
    for (let g = s.eliminations.length - 1; g >= 0; g--) order.push(...s.eliminations[g]);
  }
  // 표시 순서(요소): 개인전은 행만, 팀전은 팀 헤더 아래에 같은 순서로 팀원 행
  let els;
  if (teamHeads.size) {
    els = [];
    for (const [tm, th] of teamHeads) {
      const alive = th.members.filter(b => b.alive);
      let hp = 0, max = 0;
      for (const b of th.members) { hp += Math.max(0, b.hp); max += b.maxHp; }
      th.fill.style.width = (max ? clamp(hp / max, 0, 1) * 100 : 0).toFixed(1) + '%';
      setText(th.alive, tf('alive', { a: alive.length, n: th.members.length }));
      th.head.classList.toggle('out', !alive.length);
      els.push(th.head);
      for (const id of order) if (s.bodies[id - 1].team === tm) els.push(hpRows.get(id).row);
    }
  } else {
    els = order.map(id => hpRows.get(id).row);
  }
  const list = $('hpList');
  const cur = list.children;
  if (cur.length !== els.length || els.some((el, k) => cur[k] !== el)) {
    for (const el of els) list.appendChild(el);
  }
}

// ===== 상태 / 스킬 버튼 =====
function fmtTime(sec) {
  const s = Math.floor(sec);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
// 결과 제목: 팀전 "A팀 승리!", 개인전 "{이름} 승리!", 아니면 무승부
function resultTitle(s) {
  if (s.battle === 'team') return s.result.winnerTeam ? tf('teamWin', { team: teamName(s.result.winnerTeam - 1) }) : t('draw');
  return s.result.winnerId ? tf('win', { name: fullName(s.bodies[s.result.winnerId - 1]) }) : t('draw');
}
function renderStatus() {
  const s = state.sim, st = $('status'), sub = $('statusSub');
  let main = '', minor = '', danger = false;
  if (state.phase === 'select') {
    main = state.lineup.length < MIN_BALLS ? t('needTwo') : !canStart() ? t('needTwoTeams') : t('pressStart');
    minor = state.mode === 'play' ? t('playHint') : '';
  } else {
    const alive = s.bodies.filter(b => b.alive).length;
    if (state.phase === 'over') {
      main = resultTitle(s);
    } else {
      main = tf('alive', { a: alive, n: s.total });
      if (state.phase === 'paused') main = t('paused') + ' · ' + main;
    }
    minor = fmtTime(s.time);
    if (s.suddenDeath) { minor += ' · ' + t('suddenDeath'); danger = true; }
  }
  setText(st, main);
  setText(sub, minor);
  sub.classList.toggle('danger', danger);
}
function renderSkill() {
  const btn = $('skillBtn');
  btn.classList.toggle('hidden', state.mode !== 'play');
  if (state.mode !== 'play') return;
  const s = state.sim;
  let label = t('skill'), p = 0, ready = false, enabled = false;
  if (state.myIndex >= 0 && state.lineup[state.myIndex]) {
    if (state.phase === 'select' || !s) {
      label = t(TYPES[state.lineup[state.myIndex]].skill);
    } else {
      const b = s.bodies[state.myIndex];
      const sk = b ? t(TYPES[b.type].skill) : '';
      if (!b || s.manualId !== b.id) label = t('skill');
      else if (!b.alive) label = t('myOut');
      else if (state.phase === 'over') label = sk;
      else if (b.cd <= 0) {
        label = sk + ' · ' + t('ready');
        p = 1;
        ready = state.phase === 'running';
        enabled = state.phase === 'running';
      } else {
        label = sk + ' ' + b.cd.toFixed(1) + 's';
        p = 1 - b.cd / b.cdMax;
        enabled = state.phase === 'running'; // 쿨 중 입력은 무시
      }
    }
  }
  setText(btn, label);
  btn.style.setProperty('--p', clamp(p, 0, 1).toFixed(3));
  btn.classList.toggle('ready', ready);
  btn.disabled = !enabled;
}

function renderControls() {
  const n = state.lineup.length, ed = editable();
  setText($('lineupCount'), n + ' / ' + MAX_BALLS);
  setText($('lineupHint'), n < MIN_BALLS ? t('needTwo') : !canStart() ? t('needTwoTeams') : n >= MAX_BALLS ? tf('maxReached', { n: MAX_BALLS }) : '');
  $('addBar').querySelectorAll('.add-btn').forEach(b => { b.disabled = !ed || n >= MAX_BALLS; });
  $('clearBtn').disabled = !ed || !n;
  $('lineup').querySelectorAll('.li-del, .li-team, .li-edit').forEach(b => { b.disabled = !ed; });
  $('customizeBtn').disabled = !ed || !n;

  const modeSeg = $('modeSeg');
  modeSeg.classList.toggle('disabled', inBattle());
  modeSeg.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === state.mode);
    b.disabled = inBattle();
  });
  // 전투 방식 / 팀 수 (전투 중엔 잠금)
  const team = state.battle === 'team';
  for (const [id, cur] of [['battleSeg', state.battle], ['teamCountSeg', String(state.teamCount)]]) {
    const seg = $(id);
    seg.classList.toggle('disabled', inBattle());
    seg.querySelectorAll('button').forEach(b => {
      b.classList.toggle('on', b.dataset.v === cur);
      b.setAttribute('aria-pressed', b.dataset.v === cur ? 'true' : 'false');
      b.disabled = inBattle();
    });
  }
  $('teamField').classList.toggle('hidden', !team);
  $('autoTeamBtn').classList.toggle('hidden', !team);
  $('autoTeamBtn').disabled = !ed || !n;

// 결과 모양: 승자 없음 = draw. 직접 모드는 내 공(팀) 승리면 win, 아니면 lose. 관전은 win
function outcomeOf(s) {
  const r = s && s.result;
  if (!r || !r.winnerTeam) return 'draw';
  if (state.mode !== 'play' || state.myIndex < 0) return 'win';
  const me = s.bodies[state.myIndex];
  return me && me.team === r.winnerTeam ? 'win' : 'lose';
}

const battleTeams = () => (state.battle === 'team' ? state.teams.slice() : undefined);
function makePreview() {
  weapons = new Map();
  state.sim = state.lineup.length ? createBattle(state.lineup, urlSeed !== null ? urlSeed : PREVIEW_SEED, battleTeams()) : null;

// 결과 바로 보기: 렌더 없이 같은 sim을 고정 스텝으로 끝까지 진행. 직접 모드의 내 공은 자동 AI로 넘김
const SKIP_MAX_STEPS = Math.round(300 / DT);
function skipToResult() {
  if (!inBattle()) return;
  const s = state.sim;
  s.manualId = 0;
  s.manualReq = false;
  for (let n = 0; !s.result && n < SKIP_MAX_STEPS; n++) step(s);
  if (!s.result) forceResult(s);
  s.events.length = 0;
  particles = [];
  acc = 0;
  finish();
}

}
function addBall(type) {
  if (!editable() || state.lineup.length >= MAX_BALLS || !TYPES[type]) return;
  state.teams.push(smallestTeam()); // 새 공은 인원이 가장 적은 팀으로
  state.lineup.push(type);
  state.looks.push(null);
  if (state.myIndex < 0) state.myIndex = 0;

  afterEdit();

  if (fromAdd && state.lineup.length >= MAX_BALLS) {

function removeBall(i) {

// 팀 칩: 다음 팀으로 순환 (포커스는 같은 칩에 유지)
function cycleTeam(i) {

  state.teams[i] = ((state.teams[i] || 0) + 1) % state.teamCount;
  afterEdit();
  const chip = $('lineup').querySelector('.li-team[data-i="' + i + '"]');

function setTeamCount(c) {

  state.teamCount = c;
  state.teams.forEach((v, i) => { if (v >= c) state.teams[i] = -1; });

  afterEdit();

// ===== 메인 루프 (rAF + accumulator에 실제 dt×speed, 고정 스텝, 프레임당 최대 ceil(5×speed) 스텝) =====
let lastTs = null, acc = 0, lastUi = 0, lastFrame = null;
function frame(ts) {
  requestAnimationFrame(frame);
  const fdt = lastFrame === null ? 0 : Math.min((ts - lastFrame) / 1000, 0.1);
  lastFrame = ts;
  const s = state.sim;
  if (state.phase === 'running' && s && !counting()) {
    holdCheck();
    if (lastTs === null) lastTs = ts;
    const real = Math.min((ts - lastTs) / 1000, 0.25);
    lastTs = ts;
    acc += real * state.speed;
    const cap = Math.ceil(5 * state.speed);
    let n = 0;
    while (acc >= DT && n < cap && !s.result) { s.steer = steerInput(s); step(s); acc -= DT; n++; }
    if (n >= cap) acc = Math.min(acc, DT);
    drainEvents(s);
    updateTrails(s);
    updateParticles(fdt * state.speed);
    updateWeapons(s, fdt * state.speed);
    dirty = true;
    if (s.result) finish();
    else if (ts - lastUi >= 100) { lastUi = ts; renderStatus(); renderHp(); renderSkill(); }
  } else if (state.phase !== 'paused' && particles.length) {
    updateParticles(fdt);
    dirty = true;
  }
  if (dirty) { draw(); dirty = false; }
}

// ===== 페이지 배경색 =====
// sRGB 상대 휘도 / 대비비 (WCAG)
const hexRgb = h => { const v = parseInt(h.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; };
function relLum(rgb) {
  const f = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
}
const contrastRatio = (l1, l2) => (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
// 배경 위 글자색(회색 계열): 흰/검 중 대비가 큰 쪽 끝에서 배경 쪽으로 다가가며 목표 대비를 지키는 가장 부드러운 회색.
// 끝값조차 목표에 못 미치면 끝값(흰/검 중 큰 쪽은 항상 4.5:1 이상)
function onPageColors(hex) {
  const L = relLum(hexRgb(hex));
  const light = contrastRatio(1, L) >= contrastRatio(0, L);
  const pick = target => {
    let best = light ? 255 : 0;
    for (let k = 1; k <= 255; k++) {
      const v = light ? 255 - k : k;
      if (contrastRatio(relLum([v, v, v]), L) < target) break;
      best = v;
    }
    return 'rgb(' + best + ', ' + best + ', ' + best + ')';
  };
  return { main: pick(12), muted: pick(4.6) };
}
// state.pageBg를 문서와 UI(.on / aria-pressed)에 반영. 기본('')이면 인라인 속성을 지워 테마를 따름
function applyPageBg() {
  const st = document.documentElement.style;
  if (!state.pageBg) {
    for (const p of ['--page-bg', '--on-page', '--on-page-muted']) st.removeProperty(p);
  } else {
    const c = onPageColors(state.pageBg);
    st.setProperty('--page-bg', state.pageBg);
    st.setProperty('--on-page', c.main);
    st.setProperty('--on-page-muted', c.muted);
  }
  let matched = false;
  $('bgSwatches').querySelectorAll('.swatch').forEach(b => {
    const on = (b.dataset.color || '').toLowerCase() === state.pageBg;
    if (on) matched = true;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  $('bgCustom').classList.toggle('on', !matched);
  if (!matched) $('bgColorInput').value = state.pageBg;
  $('bgResetBtn').disabled = !state.pageBg;
}

}

// ===== 직접 이동 입력 (sim 밖에서 보관 → 스텝마다 sim.steer로 전달) =====
const TAP_MS = 200, TAP_MOVE = 10;   // 짧은 탭 판정: 200ms 미만, 10px 미만 이동
const keysDown = new Set();
const STEER_KEYS = { KeyW: [0, -1], KeyA: [-1, 0], KeyS: [0, 1], KeyD: [1, 0], ArrowUp: [0, -1], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowRight: [1, 0] };
const pointers = new Map();          // pointerId → { x0, y0, t0, x, y, steer }
let steerPointerId = null;           // 조향 중인 포인터 (첫 손가락)
const joyEl = $('joystick');
const JOY_DEAD = 0.15;               // 조이스틱 데드존 (반지름 대비)
const joy = { id: null, cx: 0, cy: 0, r: 54, x: 0, y: 0 }; // 추적 중인 pointerId, 바탕 중심·반지름(px), 벡터(-1~1, 길이 ≤ 1)
const playActive = () => state.phase === 'running' && state.mode === 'play' && !counting();
// 화면 좌표 → 논리 좌표
function toArena(e) {
  const r = canvas.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * ARENA, y: ((e.clientY - r.top) / r.height) * ARENA };
}
// 현재 입력 방향: 조이스틱(데드존 밖) > 아레나 포인터 조향(공 → 포인터 위치) > 키보드
// 엔진은 방향만 쓰므로(STEER_RATE 고정 회전) 조이스틱 크기는 데드존 판정에만 쓴다
function steerInput(sim) {
  const me = sim && sim.manualId ? sim.bodies[sim.manualId - 1] : null;
  if (!me || !me.alive) return null;
  if (joy.id !== null && Math.hypot(joy.x, joy.y) >= JOY_DEAD) return { dx: joy.x, dy: joy.y };
  const p = steerPointerId !== null ? pointers.get(steerPointerId) : null;
  if (p && p.steer) {
    const a = toArenaXY(p.x, p.y), dx = a.x - me.x, dy = a.y - me.y;
    if (Math.hypot(dx, dy) > me.r * 0.5) return { dx, dy };
    return null;
  }
  let dx = 0, dy = 0;
  for (const k of keysDown) { const v = STEER_KEYS[k]; if (v) { dx += v[0]; dy += v[1]; } }
  return dx || dy ? { dx, dy } : null;
}
function toArenaXY(cx, cy) { return toArena({ clientX: cx, clientY: cy }); }
function clearInput() {
  keysDown.clear();
  pointers.clear();
  steerPointerId = null;
  resetJoystick();
}
canvas.addEventListener('pointerdown', e => {
  if (!playActive()) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t0: performance.now(), steer: false });
  if (steerPointerId === null) steerPointerId = e.pointerId;
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (e.pointerId === steerPointerId && !p.steer && Math.hypot(p.x - p.x0, p.y - p.y0) >= TAP_MOVE) p.steer = true;
});
function endPointer(e, cancelled) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  const tap = !cancelled && !p.steer && performance.now() - p.t0 < TAP_MS && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) < TAP_MOVE;
  if (e.pointerId === steerPointerId) steerPointerId = null;
  if (tap) useMySkill();
  dirty = true;
}
canvas.addEventListener('pointerup', e => endPointer(e, false));
canvas.addEventListener('pointercancel', e => endPointer(e, true));
// 터치 드래그 중 페이지 스크롤 방지 (직접 모드 전투 중에만)
canvas.addEventListener('touchmove', e => { if (playActive() && e.cancelable) e.preventDefault(); }, { passive: false });
// ===== 가상 조이스틱 (#joystick, 한 손가락만 추적. 다른 손가락은 스킬 버튼 등에 자유) =====
function setJoyVec(x, y) {
  joy.x = x; joy.y = y;
  joyEl.style.setProperty('--jx', x.toFixed(3));
  joyEl.style.setProperty('--jy', y.toFixed(3));
}
function resetJoystick() {
  const id = joy.id;
  joy.id = null;
  setJoyVec(0, 0);
  joyEl.classList.remove('active');
  if (id !== null) { try { if (joyEl.hasPointerCapture(id)) joyEl.releasePointerCapture(id); } catch (err) {} }
}
function moveJoy(e) {
  let x = (e.clientX - joy.cx) / joy.r, y = (e.clientY - joy.cy) / joy.r;
  const m = Math.hypot(x, y);
  if (m > 1) { x /= m; y /= m; }
  setJoyVec(x, y);
}
joyEl.addEventListener('pointerdown', e => {
  if (!playActive() || joy.id !== null) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  const r = joyEl.querySelector('.joy-base').getBoundingClientRect();
  joy.cx = r.left + r.width / 2; joy.cy = r.top + r.height / 2;
  joy.r = r.width / 2 || 54;
  joy.id = e.pointerId;
  try { joyEl.setPointerCapture(e.pointerId); } catch (err) {}
  joyEl.classList.add('active');
  moveJoy(e);
});
joyEl.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  if (!playActive()) { resetJoystick(); return; }
  moveJoy(e);
});
const endJoy = e => { if (e.pointerId === joy.id) resetJoystick(); };
joyEl.addEventListener('pointerup', endJoy);
joyEl.addEventListener('pointercancel', endJoy);
joyEl.addEventListener('lostpointercapture', endJoy);
joyEl.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
joyEl.addEventListener('contextmenu', e => e.preventDefault());
// 스킬 버튼: 터치는 pointerdown에서 바로 발동 (다른 손가락이 조이스틱을 잡고 있어도 click이 안 올 수 있음). 뒤따르는 click은 무시
let skipSkillClick = false;
$('skillBtn').addEventListener('pointerdown', e => {
  // 마우스 pointerdown은 플래그를 지워, 앞선 터치에서 click이 안 왔어도 다음 마우스 click이 먹히지 않게 한다
  skipSkillClick = e.pointerType === 'touch' || e.pointerType === 'pen';
  if (!skipSkillClick || !playActive()) { skipSkillClick = false; return; }
  useMySkill();
});
// 터치 뒤 click이 안 온 경우(손가락이 버튼 밖에서 떨어짐 등) 다음 키보드 click이 먹히지 않게
$('skillBtn').addEventListener('keydown', () => { skipSkillClick = false; });
// 누르고 있으면(200ms 이상) 움직이지 않아도 조향 시작
function holdCheck() {
  const p = steerPointerId !== null ? pointers.get(steerPointerId) : null;
  if (p && !p.steer && performance.now() - p.t0 >= TAP_MS) p.steer = true;
}
const typingTarget = e => e.target.closest && e.target.closest('select, input, textarea');
document.addEventListener('keydown', e => {
  if (!STEER_KEYS[e.code] || typingTarget(e)) return;
  if (!playActive()) return;
  e.preventDefault(); // 방향키 스크롤 막기
  keysDown.add(e.code);
});
document.addEventListener('keyup', e => { keysDown.delete(e.code); });
window.addEventListener('blur', clearInput);
// 직접 모드 전투 중 Space = 스킬. 포커스된 버튼의 기본 동작(keyup 클릭)도 막는다. 입력 요소는 제외
const spaceIsSkill = e =>
  (e.code === 'Space' || e.key === ' ') && state.phase === 'running' && state.mode === 'play' && !overlayOpen() &&
  !(e.target.closest && e.target.closest('select, input, textarea'));
document.addEventListener('keydown', e => {
  if (!spaceIsSkill(e)) return;
  e.preventDefault();
  if (!e.repeat) useMySkill();
});
document.addEventListener('keyup', e => { if (spaceIsSkill(e)) e.preventDefault(); });
// 탭 숨김 → 자동 일시정지(일시정지 메뉴가 열린 채로 돌아옴)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearInput();
  if (document.hidden && state.phase === 'running') pauseGame();
});

// ===== 포커스 도우미 ([공유] 메뉴 도우미의 GxUI 사용) =====
const isShown = el => GxUI.shown(el);
const focusables = box => GxUI.focusables(box).filter(el => el.tabIndex >= 0);
function focusFirst(box) { GxUI.focusSafe(focusables(box)[0]); }
const trapTab = (e, box) => GxUI.trapTab(box, e);
// 탭 목록 ←→ Home End: 고른 탭으로 onPick(tab)
function tabArrows(e, tabs, onPick) {
  const i = tabs.indexOf(document.activeElement), n = tabs.length;
  if (i < 0) return;
  const j = e.key === 'ArrowRight' ? (i + 1) % n : e.key === 'ArrowLeft' ? (i - 1 + n) % n : e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : -1;
  if (j < 0) return;
  e.preventDefault();
  onPick(tabs[j]);
  tabs[j].focus();
}

// ===== 메뉴 · 설정 시트 (html[data-menu] = '' | 'menu' | 'pause' | 'settings') =====
// 일시정지 단계에선 늘 일시정지 메뉴가 보인다(CSS). 메뉴가 열린 동안 아레나 입력은 무시(일시정지/준비 단계라 playActive 아님)
const root = document.documentElement;
let menuOpener = null;   // 메뉴를 연 요소 → 닫으면 포커스 복귀
let settingsFrom = '';   // 설정 시트를 연 메뉴('menu'|'pause'). '' 이면 닫을 때 메뉴 없이 닫힘
const menuState = () => root.dataset.menu || '';
const customOpen = () => !$('customOverlay').classList.contains('hidden');
const menuVisible = () => !!menuState() || state.phase === 'paused';
const overlayOpen = () => customOpen() || menuVisible();
function setMenu(v) {
  root.dataset.menu = v;
  if (v !== 'pause' && v !== 'menu') armExit(false);
}
function rememberMenuOpener() {
  if (menuVisible()) return;
  const a = document.activeElement;
  menuOpener = a && a !== document.body && !(a.closest && a.closest('.gx-menu')) ? a : null;
}
function restoreMenuFocus() {
  const o = menuOpener;
  menuOpener = null;
  if (o && o.isConnected && !o.disabled && isShown(o)) o.focus({ preventScroll: true });
  else if (document.activeElement && document.activeElement.closest && document.activeElement.closest('.gx-menu')) document.activeElement.blur();
}
// 전투 중이면 일시정지 메뉴, 준비·결과 단계면 일반 메뉴
function openMenu() {
  if (customOpen()) return;
  if (state.phase === 'running') { pauseGame(); return; }
  if (menuVisible()) { focusFirst($('gxMenu')); return; }
  closePanel(false);
  rememberMenuOpener();
  setMenu('menu');
  Sfx.play('menu-open');
  focusFirst($('gxMenu'));
}
function closeMenu() {
  if (state.phase === 'paused') { resumeGame(); return; }
  if (!menuState()) return;
  setMenu('');
  Sfx.play('menu-close');
  restoreMenuFocus();
}
function openSettings() {
  settingsFrom = menuState() === 'pause' || menuState() === 'menu' ? menuState() : state.phase === 'paused' ? 'pause' : '';
  if (!settingsFrom) rememberMenuOpener();
  setMenu('settings');
  Sfx.play('ui-ok');
  focusFirst($('gxSettings'));
}
function closeSettings() {
  if (menuState() !== 'settings') return;
  Sfx.play('ui-back');
  const from = settingsFrom;
  settingsFrom = '';
  if (from) { setMenu(from); $('menuSettings').focus({ preventScroll: true }); }
  else { setMenu(''); restoreMenuFocus(); }
}
// 메뉴 목록 ↑↓
function moveMenuFocus(d) {
  const list = focusables($('gxMenu').querySelector('.gx-menu-list'));
  if (!list.length) return;
  const i = list.indexOf(document.activeElement);
  list[i < 0 ? 0 : (i + d + list.length) % list.length].focus();
  Sfx.play('ui-move');
}

// ===== 나가기: 전투 중이면 메뉴 안 2단계 확인(#menuExit[data-confirm]) → index.html#select =====
let exitArmed = false, exitTimer = 0;
function armExit(on) {
  const b = $('menuExit');
  clearTimeout(exitTimer);
  exitArmed = on;
  if (on) {
    b.dataset.confirm = '';
    b.textContent = t('exitConfirm');
    exitTimer = setTimeout(() => armExit(false), 4000);
  } else if (b.hasAttribute('data-confirm')) {
    delete b.dataset.confirm;
    b.textContent = t('exit');
  }
}
function requestExit() {
  if (inBattle() && !exitArmed) { armExit(true); Sfx.play('ui-move'); return; }
  leaveGame();
}
function leaveGame() {
  Sfx.play('ui-ok');
  GxUI.leave('index.html#select');
}

$('menuBtn').addEventListener('click', () => { if (menuVisible()) closeMenu(); else openMenu(); });
$('menuResume').addEventListener('click', closeMenu);
$('menuLineup').addEventListener('click', () => { Sfx.play('ui-back'); menuOpener = null; toSelect(); focusFirst($('prep')); });
$('menuSettings').addEventListener('click', openSettings);
$('settingsBack').addEventListener('click', closeSettings);
$('menuExit').addEventListener('click', requestExit);
$('menuExit').addEventListener('blur', () => { if (exitArmed) armExit(false); });

// ===== 카운트다운 3·2·1·FIGHT! (#gxCountdown). 진행 중엔 frame()이 sim을 진행하지 않음 =====
const COUNT_MS = 300;
let countdown = null;   // 예약된 setTimeout id 배열 (null = 카운트다운 아님)
let countHideT = 0;
const counting = () => countdown !== null;
function showCount(txt, fight) {
  const el = $('gxCountdown');
  el.hidden = false;
  el.textContent = txt;
  el.classList.toggle('fight', !!fight);
  el.style.animation = 'none';
  void el.offsetWidth; // 글자마다 팝 애니메이션 다시
  el.style.animation = '';
}
function hideCount() {
  clearTimeout(countHideT);
  const el = $('gxCountdown');
  el.hidden = true;
  el.classList.remove('fight');
}
function startCountdown() {
  cancelCountdown();
  const ids = [];
  countdown = ids;
  ['3', '2', '1'].forEach((n, k) => ids.push(setTimeout(() => { showCount(n, false); Sfx.play('count'); }, k * COUNT_MS)));
  ids.push(setTimeout(() => {
    countdown = null; // 지금부터 sim 진행
    lastTs = null;
    showCount(t('fight'), true);
    Sfx.play('fight');
    countHideT = setTimeout(hideCount, COUNT_MS + 100);
  }, 3 * COUNT_MS));
}
function cancelCountdown() {
  if (countdown) for (const id of countdown) clearTimeout(id);
  countdown = null;
  hideCount();
}

// ===== 소리 / 언어 순환 / UI 테마 =====
$('soundBtn').addEventListener('click', () => Sfx.toggle());
$('soundToggle').addEventListener('click', () => Sfx.toggle());

// UI 테마(#uiThemeSwatches 클릭·저장·다른 탭 동기화)는 [공유] UI 테마 블록이 처리. 캔버스 색은 data-ui 변화를 MutationObserver 로 다시 읽음

// ===== 프로필 (K1, 허브에서 만든 games-profile): HUD·결과 칩, 직접 모드 내 공 기본 이름 =====

// ===== 준비 화면 탭 (#prep[data-tab="roster|settings"], PC 배치에선 CSS가 탭을 숨기고 둘 다 표시) =====
function setPrepTab(tab, sound) {
  const prep = $('prep');
  prep.dataset.tab = tab;
  prep.querySelectorAll('.prep-tab').forEach(b => {
    const on = b.dataset.tab === tab;
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
  });
  if (sound) Sfx.play('ui-move');
}
const prepTabs = Array.from($('prep').querySelectorAll('.prep-tab'));
prepTabs.forEach(b => {
  b.addEventListener('click', () => setPrepTab(b.dataset.tab, true));
  b.addEventListener('keydown', e => tabArrows(e, prepTabs, tb => setPrepTab(tb.dataset.tab, true)));
});

// ===== 공 꾸미기 창 (K5): 색 / 표정 / 모자 / 흔적 / 별명. 적용 전까지는 초안(custom.draft)만 바뀜 =====
const customTabs = Array.from($('customDialog').querySelectorAll('.custom-tab'));
function setCustomTab(tab) {
  $('customDialog').dataset.ctab = tab;
  customTabs.forEach(b => {
    const on = b.dataset.ctab === tab;

    b.tabIndex = on ? 0 : -1;
  });
}
customTabs.forEach(b => {
  b.addEventListener('click', () => { setCustomTab(b.dataset.ctab); Sfx.play('ui-move'); });
