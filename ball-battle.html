// 기본 이름(별명 칸 placeholder): 직접 모드 내 공이면 프로필 이름, 아니면 종류 이름
function defaultBallName(i) {
  if (state.mode === 'play' && i === state.myIndex) return profileName();
  const dups = dupInfo(state.lineup);
  return ballName(state.lineup[i], dups[i].dupIndex, dups[i].dupCount);
}
function syncCustomUI() {
  const i = custom.i, d = custom.draft, ty = state.lineup[i];
  if (i < 0 || !d || !ty) return;
  const dups = dupInfo(state.lineup);
  setText($('customTarget'), '#' + (i + 1) + ' ' + ballName(ty, dups[i].dupIndex, dups[i].dupCount));
  $('customName').placeholder = defaultBallName(i);
  let matched = false;
  $('customColors').querySelectorAll('.swatch').forEach(b => {
    const on = (b.dataset.color || '').toLowerCase() === d.color;
    if (on) matched = true;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  });
  // '기본' 칸은 그 종류의 원래 색으로
  $('customColors').querySelector('.swatch.default').style.setProperty('--sw-def', 'var(--c-' + ty + ')');
  $('customColorCustom').classList.toggle('on', !matched);
  if (!matched && HEX_RE.test(d.color)) $('customColorInput').value = d.color;
  for (const [id, key] of [['customFace', 'face'], ['customHat', 'hat'], ['customTrail', 'trail']]) {
    $(id).querySelectorAll('button[data-v]').forEach(b => {
      const on = b.dataset.v === d[key];
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
  }
}
function paintCustomPreview() {
  if (custom.i < 0 || !custom.draft) return;
  paintLook($('customPreview'), state.lineup[custom.i], normLook(custom.draft), custom.i + 1);
}
function openCustomize(i, from) {
  if (!editable() || !(i >= 0 && i < state.lineup.length) || customOpen()) return;
  closePanel(false);
  custom.i = i;
  custom.from = from || 'btn';
  custom.draft = Object.assign(defaultLook(), state.looks[i] || {});
  $('customName').value = custom.draft.name;
  setCustomTab('color');
  syncCustomUI();
  $('customOverlay').classList.remove('hidden');
  paintCustomPreview();
  Sfx.play('menu-open');
  const sel = customTabs.find(b => b.getAttribute('aria-selected') === 'true');
  if (sel) sel.focus({ preventScroll: true });
}
// 닫기(취소 포함): 연 곳으로 포커스 복귀 (타일은 다시 그려지므로 번호로 찾음)
function closeCustomize(sound) {
  if (!customOpen()) return;
  const i = custom.i, from = custom.from;
  $('customOverlay').classList.add('hidden');
  custom.i = -1;
  custom.draft = null;
  if (sound) Sfx.play('ui-back');
  const back = from === 'tile' ? $('lineup').querySelector('.li-edit[data-i="' + i + '"]') : $('customizeBtn');
  if (back && !back.disabled && isShown(back)) back.focus({ preventScroll: true });
}
function applyCustomize() {
  const i = custom.i;
  if (i < 0 || !custom.draft) return;
  custom.draft.name = $('customName').value;
  state.looks[i] = normLook(custom.draft);
  saveLooks();
  attachLooks(state.sim);
  renderLineup();
  if (!inBattle()) buildHpRows();
  updateUI();
  Sfx.play('ui-ok');
  closeCustomize(false);
}
function setDraft(key, v) {
  if (!custom.draft) return;
  custom.draft[key] = v;
  syncCustomUI();
  paintCustomPreview();
  Sfx.play('ui-move');
}
$('customizeBtn').addEventListener('click', () => {
  const i = state.mode === 'play' && state.myIndex >= 0 ? state.myIndex : 0;
  openCustomize(i, 'btn');
});
$('customColors').addEventListener('click', e => {
  const b = e.target.closest('.swatch');
  if (b) setDraft('color', (b.dataset.color || '').toLowerCase());
});
$('customColorInput').addEventListener('input', e => {
  const v = String(e.target.value).toLowerCase();
  if (!custom.draft || !HEX_RE.test(v)) return;
  custom.draft.color = v;
  syncCustomUI();
  paintCustomPreview();
});
for (const [id, key] of [['customFace', 'face'], ['customHat', 'hat'], ['customTrail', 'trail']]) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button[data-v]');
    if (b) setDraft(key, b.dataset.v);
  });
}
$('customName').addEventListener('input', e => { if (custom.draft) custom.draft.name = e.target.value.slice(0, NICK_MAX); });
$('customName').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); applyCustomize(); }
});
$('customApply').addEventListener('click', applyCustomize);
$('customReset').addEventListener('click', () => {
  if (!custom.draft) return;
  custom.draft = defaultLook();
  $('customName').value = '';
  syncCustomUI();
  paintCustomPreview();
  Sfx.play('ui-back');
});
$('customClose').addEventListener('click', () => closeCustomize(true));
// 창 바깥(어두운 배경) 누르면 취소
$('customOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeCustomize(true); });

// ===== 키보드: Esc / P (우선순위: 꾸미기 창 → 설정 시트 → 메뉴 → 결과 → 모바일 패널 → 메뉴 열기) =====
const typingIn = e => !!(e.target.closest && e.target.closest('input, select, textarea'));
document.addEventListener('keydown', e => {
  const esc = e.key === 'Escape';
  const pKey = (e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey && !e.altKey && !typingIn(e);
  if (customOpen()) {
    if (esc) { e.preventDefault(); closeCustomize(true); }
    else if (e.key === 'Tab') trapTab(e, $('customDialog'));
    return;
  }
  if (menuState() === 'settings') {
    if (esc) { e.preventDefault(); closeSettings(); }
    else if (e.key === 'Tab') trapTab(e, $('gxSettings'));
    return;
  }
  if (menuVisible()) {
    if (esc || pKey) { e.preventDefault(); closeMenu(); }
    else if (e.key === 'Tab') trapTab(e, $('gxMenu'));
    else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !typingIn(e)) { e.preventDefault(); moveMenuFocus(e.key === 'ArrowDown' ? 1 : -1); }
    return;
  }
  if (state.phase === 'over') {
    if (e.key === 'Tab') trapTab(e, $('overlay'));
    return;
  }
  if (esc && app.hasAttribute('data-open')) { e.preventDefault(); closePanel(true); return; }
  if (esc || pKey) { e.preventDefault(); openMenu(); }
});

for (const code of Object.keys(I18N)) {
  const o = document.createElement('option');
  o.value = code;
  o.textContent = I18N[code].name;
  $('lang').appendChild(o);
}
$('lang').addEventListener('change', e => {
  if (!I18N[e.target.value]) return;
  lang = e.target.value;
  saveSettings();
  applyLang();
  armExit(false);
  renderProfile();
  renderLineup();
  buildHpRows();
  updateUI();
  if (custom.i >= 0) syncCustomUI();
});

// 테마 변경 → 색 캐시 재로딩
const onScheme = () => loadColors();
if (darkMQ.addEventListener) darkMQ.addEventListener('change', onScheme);
else if (darkMQ.addListener) darkMQ.addListener(onScheme);
new MutationObserver(loadColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-ui'] });
if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener('resize', () => { resizeCanvas(); resetJoystick(); }); // 회전·배치 변경 시 조이스틱 기준점이 바뀌므로 초기화

loadColors();
applyPageBg();
applyArenaTheme();
resizeCanvas();
applyLang();
syncLayoutSeg();
syncTools();
syncUiTheme();
renderProfile();
setPrepTab('roster', false);
renderLineup();
toSelect();
requestAnimationFrame(frame);
// 페이지 진입 전환 (head 가 붙인 html.gx-enter 를 300ms 뒤 걷음, bfcache 복귀 시 gx-leave 해제)
GxUI.enter();
</script>
