<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공 배틀</title>
<script>/* 화면 배치(mobile|pc)를 첫 그리기 전에 적용 → 깜빡임 방지. 사이트 공통 키 'games-layout'.
   저장값이 없으면 폭 820px 이하 = mobile, 그보다 넓으면 pc (저장은 버튼 클릭 시 본문 스크립트가 한다).
   좁은 기기(screen.width < 1024)에서 PC 배치 = viewport를 width=1280으로 → '데스크톱 사이트'처럼 축소 표시.
   그때 --vp-zoom(= min(1280/screen.width, 3))을 :root 인라인에 넘겨 #layoutSeg 버튼만 손가락 크기로 키운다. 본문 스크립트도 applyLayoutViewport()를 쓴다 */
(function () {
  var vp = document.getElementById('vp');
  var VP_DEFAULT = 'width=device-width, initial-scale=1, viewport-fit=cover', VP_PC = 'width=1280'; // 기본값 = 위 meta 원문
  window.applyLayoutViewport = function (L) {
    var w = 0;
    try { w = screen.width; } catch (e) {}
    var zoom = L === 'pc' && w > 0 && w < 1024, want = zoom ? VP_PC : VP_DEFAULT, st = document.documentElement.style;
    if (vp.getAttribute('content') !== want) vp.setAttribute('content', want);
    if (zoom) st.setProperty('--vp-zoom', String(Math.min(1280 / w, 3)));
    else st.removeProperty('--vp-zoom');
  };
  var L = null;
  try { L = localStorage.getItem('games-layout'); } catch (e) {}
  if (L !== 'pc' && L !== 'mobile') {
    try { L = (matchMedia('(max-width: 820px)').matches || (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 820)) ? 'mobile' : 'pc'; } catch (e) { L = 'mobile'; }
  }
  document.documentElement.dataset.layout = L;
  window.applyLayoutViewport(L);
})();</script>

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page-bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    min-height: 100vh;
    touch-action: manipulation;
    overflow-x: hidden;
  }
  h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; color: var(--on-page); }
  .hidden { display: none !important; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  :focus:not(:focus-visible) { outline: none; }

  /* ===== 레이아웃 공통 =====
     배치별 격자·아레나 크기(--bw)는 아래 "모바일 배치"(기본)와 "PC 배치"(html[data-layout="pc"]) 블록에서 정한다. */
  .app {
    margin: 0 auto;
    display: grid;
    align-items: start;
  }
  /* 헤더: [← 게임 목록 … 언어] / [제목 … 화면 배치] / 상태 */
  .head { grid-area: head; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .head-row, .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .back {
    color: var(--on-page-muted); font-size: 14px; text-decoration: none;
    padding: 10px 8px; margin: 0 0 0 -8px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 4px;
  }
  /* 사용자 배경 위에서도 보이도록 페이지 글자색으로 포커스 링 */
  .back:focus-visible { outline-color: var(--on-page); }
  /* 화면 배치 세그먼트: 선택 표시는 html[data-layout] 기준(JS가 .on/aria-pressed 를 붙여도 같은 모양) */
  #layoutSeg { margin-left: auto; flex: none; }
  #layoutSeg button { min-width: 60px; padding: 9px 10px; white-space: nowrap; }
  /* 폰에서 PC 모드(viewport 1280 축소)일 때만 --vp-zoom 이 있음 → 실제 손가락 크기 유지 (없으면 배율 1 = 기존 크기) */
  :root[data-layout="pc"] #layoutSeg button {
    min-height: calc(44px * var(--vp-zoom, 1)); min-width: max(60px, calc(52px * var(--vp-zoom, 1)));
    font-size: calc(13px * min(var(--vp-zoom, 1), 2.8));
  }
  :root:not([data-layout="pc"]) #layoutSeg button[data-v="mobile"],
  :root[data-layout="pc"] #layoutSeg button[data-v="pc"] { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  :root:not([data-layout="pc"]) #layoutSeg button[data-v="pc"].on,
  :root[data-layout="pc"] #layoutSeg button[data-v="mobile"].on { background: transparent; color: var(--text); font-weight: 400; }
  .side { grid-area: side; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  /* 설정 카드: 2열 그리드(모드|전투 방식, 팀 수|내 공), 속도·버튼은 전체 폭 */
  .card.stack { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 8px; align-items: end; }
  .card.stack > .speed-field, .card.stack > .panel-head { grid-column: 1 / -1; }
  /* 팀 수(3칸)·내 공은 전체 폭: 반 칸(PC 사이드 약 133px)에선 팀 버튼이 40px로 44px 미만 */
  .card.stack > #teamField, .card.stack > #myField { grid-column: 1 / -1; }
  .status { font-size: 16px; font-weight: 600; min-height: 1.3em; overflow-wrap: anywhere; }
  .status-sub { color: var(--muted); font-size: 13px; margin-top: 2px; min-height: 1em; font-variant-numeric: tabular-nums; }
  .status-sub.danger { color: var(--danger); font-weight: 600; }
  .field-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
  .field-head { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .field-head .field-label { margin: 0; }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    background: var(--btn); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 3px;
  }
  .seg button {
    font: inherit; font-size: 13px; border: 0; border-radius: 7px; background: transparent; color: var(--text);
    padding: 9px 4px; min-height: 44px; cursor: pointer; white-space: normal; line-height: 1.2;
  }
  .seg button.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .seg button:disabled { opacity: .45; cursor: default; }
  /* 전투 중 잠긴 세그먼트: 선택된 칸은 흐리게 하지 않고 테두리로 "현재 값"을 계속 보여 준다 */
  .seg.disabled button.on {
    background: var(--btn-hover); color: var(--muted); opacity: 1;
    box-shadow: inset 0 0 0 1px var(--border);
  }
  /* 속도 5단계: 좁은 칸(약 49px~)에서도 한 줄 유지 */
  #speedSeg { gap: 2px; }
  #speedSeg button {
    min-width: 0; padding: 9px 2px; white-space: nowrap;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  @media (max-width: 340px) {
    #speedSeg button { font-size: 12px; padding: 9px 1px; }
  }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button.btn {
    font: inherit; font-size: 13px; flex: 1; padding: 9px 10px; min-height: 44px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--btn); color: var(--text); cursor: pointer;
  }
  button.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  button.btn:disabled { opacity: .5; cursor: default; }
  button.btn.small { flex: none; font-size: 13px; padding: 6px 12px; }
  /* 시작/일시정지/재시작/결과 바로 보기: 1행 4열 (PC 넓은 화면 사이드 열에서는 2×2) */
  .ctrl-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .ctrl-row button.btn { min-width: 0; padding: 6px 4px; line-height: 1.2; overflow-wrap: anywhere; }

  /* select 는 16px: iOS 포커스 시 자동 확대 방지 */
  select.lang, select.field {
    font: inherit; font-size: 16px; color: var(--text); background: var(--btn);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 8px; min-height: 44px;
  }
  select.lang { margin-left: auto; }
  select.field { width: 100%; min-height: 44px; padding: 8px 10px; }
  select:disabled { opacity: .5; }
  select.lang:focus-visible { outline-color: var(--on-page); }

  /* ===== 배경색 =====
     프리셋 색은 마크업 data-color + style="--sw:…" 에만 존재. 기본(테마) 스와치는 --sw 미지정 → var(--bg). */
  .bg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .bg-head .field-label { margin: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch, .swatch-custom {
    flex: none; width: 44px; height: 44px; padding: 0; margin: 0; border-radius: 50%;
    border: 1px solid var(--border); cursor: pointer; position: relative;
  }
  .swatch { background: var(--sw, var(--bg)); font: inherit; }
  /* 기본 스와치: 테마 배경 + 대각선 표시로 "기본값"임을 구분 */
  .swatch.default {
    background:
      linear-gradient(135deg, transparent calc(50% - 1px), var(--muted) calc(50% - 1px), var(--muted) calc(50% + 1px), transparent calc(50% + 1px)),
      var(--bg);
  }
  .swatch.on, .swatch-custom.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  .swatch:focus-visible { outline-offset: 4px; }
  /* 사용자 지정: 원형 color input */
  .swatch-custom {
    display: inline-block; overflow: hidden; background: var(--btn);
  }
  .swatch-custom:focus-within { outline: 2px solid var(--accent); outline-offset: 4px; }
  .swatch-custom:has(input:focus:not(:focus-visible)) { outline: none; }
  .swatch-custom input[type="color"] {
    position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px);
    padding: 0; border: 0; background: none; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .swatch-custom input[type="color"]:focus-visible { outline: none; }
  .swatch-custom input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .swatch-custom input[type="color"]::-webkit-color-swatch { border: 0; }
  .swatch-custom input[type="color"]::-moz-color-swatch { border: 0; }
  /* "+" 표식: 사용자 지정 칸임을 표시 */
  .swatch-custom::after {
    content: "+"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; line-height: 1; color: var(--text);
    pointer-events: none; text-shadow: 0 0 3px var(--panel), 0 0 2px var(--panel);
  }
  .swatch-custom.on::after { content: none; }

  /* ===== 아레나 ===== */
  .arena-wrap {
    grid-area: board;
    justify-self: center;
    width: 100%;
    max-width: var(--bw);
    position: relative;
  }
  canvas#arena {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    background: var(--arena);
    border-radius: 4px;
    box-shadow: 0 0 0 1px var(--arena-line), 0 10px 30px var(--shadow);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;   /* 길게 눌러 이미지 메뉴 방지 */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;    /* 평소: 스크롤은 되고 더블탭 확대만 막음 */
  }
  /* 직접 모드 전투 중: 드래그 조향이 페이지 스크롤·핀치로 빼앗기지 않게 */
  body.in-battle.mode-play canvas#arena { touch-action: none; }

  .overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--scrim); border-radius: 4px; z-index: 5; padding: 10px;
  }
  .overlay.show { display: flex; }
  .dialog {
    background: var(--panel); color: var(--text); border-radius: 12px; padding: 14px;
    text-align: center; box-shadow: 0 10px 30px var(--shadow);
    width: min(340px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; min-height: 0;
  }
  .dialog h2 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
  #ovRank {
    list-style: none; margin: 0; padding: 0; text-align: left; font-size: 14px;
    overflow-y: auto; min-height: 0; flex: 1 1 auto; max-height: 260px;
    border-top: 1px solid var(--border);
  }
  #ovRank li {
    display: flex; align-items: center; gap: 8px; padding: 6px 2px;
    border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums;
  }
  #ovRank li:first-child { font-weight: 600; }
  #ovRank .rk { color: var(--muted); min-width: 2.6em; flex: none; }
  #ovRank:empty { display: none; }

  /* ===== 공 추가 ===== */
  /* 20종: 5열×4행, 버튼 안은 점 위·이름 아래(터치 44px).
     가장 좁은 칸(360px 폰)은 약 57px → 긴 이름(Bombardero 등)은 하이픈 줄바꿈. */
  .add-bar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .add-btn {
    font: inherit; font-size: 12px; color: var(--text); background: var(--btn);
    border: 1px solid var(--border); border-radius: 8px; min-height: 44px; padding: 4px 2px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer;
    line-height: 1.1; min-width: 0; text-align: center;
  }
  .add-btn > span:last-child { max-width: 100%; overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto; }
  .add-btn:disabled { opacity: .45; cursor: default; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--ball-outline);
  }

  /* ===== 구성 목록 ===== */
  #lineup {
    list-style: none; margin: 8px 0 0; padding: 0;
    max-height: 160px; overflow-y: auto; overscroll-behavior: contain;  /* 약 3.5행 → 더 있음을 보여 줌 */
    border: 1px solid var(--border); border-radius: 8px;
  }
  #lineup:empty { display: none; }
  .lineup-item {
    display: flex; align-items: center; gap: 8px; padding: 0 2px 0 8px; min-height: 44px;
    border-bottom: 1px solid var(--border);
  }
  .lineup-item:last-child { border-bottom: 0; }
  .li-num {
    flex: none; min-width: 22px; text-align: right; font-size: 13px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .li-dot {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--ball-outline);
  }
  .li-dot.dup2 { border-style: dashed; }
  .li-dot.dup3 { border: 4px double var(--ball-outline); }
  .li-name { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-del {
    flex: none; width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent;
    color: var(--muted); font: inherit; font-size: 20px; line-height: 1; cursor: pointer;
  }
  .li-del:disabled { opacity: .35; cursor: default; }
  /* 꾸미기 버튼(✎): .li-name 뒤 · .li-team 앞. 버튼 3개가 붙으므로 간격을 줄여 이름 폭 확보 */
  .li-edit {
    flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: transparent;
    color: var(--muted); font: inherit; font-size: 18px; line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .li-edit:disabled { opacity: .35; cursor: default; }
  .li-edit:focus-visible { outline-offset: -2px; }
  /* 팀전: 팀 칩(44px)이 붙으면 간격을 줄여 360px에서 이름 폭(약 135px) 확보 */
  .lineup-item:has(.li-team) { gap: 6px; }
  .lineup-item:has(.li-edit) { gap: 4px; }
  .lineup-item:has(.li-edit) .li-dot { margin: 0 4px; }
  .hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .hint:empty { display: none; }
  /* 팀 자동 배분 / 모두 지우기: 제목 줄 오른쪽 */
  .lineup-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 6px; margin-left: auto; }

  /* ===== 팀전 =====
     .t-a ~ .t-d 가 --tc(팀 색)를 정하고, .li-team / .team-head / .rank-team 이 이를 쓴다. */
  .t-a { --tc: var(--team-a); }
  .t-b { --tc: var(--team-b); }
  .t-c { --tc: var(--team-c); }
  .t-d { --tc: var(--team-d); }
  /* 구성 목록 팀 칩: 터치 영역 44px, 보이는 칩 28px(투명 테두리 8px 안쪽) */
  .li-team {
    flex: none; width: 44px; height: 44px; padding: 0; cursor: pointer;
    border: 8px solid transparent; border-radius: 14px; background-clip: padding-box;
    background-color: color-mix(in srgb, var(--tc, var(--muted)) 12%, transparent);
    box-shadow: inset 0 0 0 2px var(--tc, var(--muted));
    color: var(--tc, var(--muted)); font: inherit; font-size: 13px; font-weight: 700; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .li-team:disabled { opacity: .45; cursor: default; }
  .li-team:focus-visible { outline-offset: -6px; }

  /* 전투 현황 팀 그룹 헤더 */
  .team-dot {
    flex: none; width: 12px; height: 12px; border-radius: 50%;
    background: var(--tc, var(--muted)); box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 2.5px var(--tc, var(--muted));
  }
  .team-head {
    display: grid; grid-template-columns: 12px minmax(0, 1fr) auto;
    grid-template-areas: "dot name alive" "bar bar bar";
    align-items: center; column-gap: 8px; row-gap: 4px;
    margin-top: 8px; padding: 6px 6px 7px; border-radius: 6px;
    border-left: 4px solid var(--tc, var(--muted));
    background: color-mix(in srgb, var(--tc, var(--muted)) 9%, transparent);
    font-size: 13px;
  }
  #hpList > .team-head:first-child { margin-top: 0; }
  .team-head .team-dot { grid-area: dot; }
  .team-name { grid-area: name; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team-alive { grid-area: alive; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .team-bar { grid-area: bar; height: 6px; border-radius: 3px; background: var(--hp-bg); overflow: hidden; }
  .team-fill { height: 100%; width: 100%; background: var(--tc, var(--hp-ok)); border-radius: 3px; transition: width .15s linear; }
  .team-head.out { opacity: .5; }
  .team-head.out .team-name { text-decoration: line-through; }
  .team-head.out .team-fill { width: 0 !important; }

  /* 오버레이 팀 순위 */
  #ovRank li.rank-team {
    font-weight: 700; padding: 7px 6px; margin-top: 4px;
    border-left: 4px solid var(--tc, var(--muted));
    background: color-mix(in srgb, var(--tc, var(--muted)) 10%, transparent);
  }
  #ovRank li.rank-team:first-child { margin-top: 0; }
  #ovRank li.rank-team .rk { color: var(--text); }
  .rank-team-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #ovRank li.rank-member { padding-left: 22px; font-weight: 400; }
  #ovRank li.rank-member .rk { min-width: 2em; }
  /* 탈락한 팀원: 글자 muted + 점만 흐리게 (줄 구분선은 그대로 유지) */
  #ovRank li.rank-member.out { color: var(--muted); }
  #ovRank li.rank-member.out .li-dot { opacity: .45; }
  /* 순위 행 이름(마지막 span): 좁은 대화상자에서 넘치지 않게 */
  #ovRank li > span:last-child { min-width: 0; overflow-wrap: anywhere; }

  #myField:has(#mySelect.hidden) { display: none; }

  /* ===== 스킬 버튼 ===== */
  button#skillBtn {
    position: relative; isolation: isolate; overflow: hidden; width: 100%; flex: none;
    font-weight: 600; min-height: 48px;
  }
  button#skillBtn::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    width: calc(var(--p, 0) * 100%);
    background: var(--accent); opacity: .28;
  }
  button#skillBtn.ready {
    background: var(--accent); color: var(--accent-text); border-color: transparent;
    animation: pulse 1.2s ease-in-out infinite;
  }
  button#skillBtn.ready::before { display: none; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent); }
    50% { box-shadow: 0 0 0 4px var(--accent); }
  }

  /* ===== 전투 현황 (HP 목록) ===== */
  /* 공 20개: 전투 현황이 너무 길어지지 않게 높이 제한, #hpList 안에서 스크롤 */
  .battle {
    grid-area: left; display: flex; flex-direction: column; min-height: 0;
    max-height: min(45vh, 360px);
  }
  .battle .field-label { flex: none; }
  #hpList {
    display: flex; flex-direction: column; gap: 1px;
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    margin: 0 -4px; padding: 0 4px;
  }
  #hpList:empty { display: none; }
  .hp-row {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(56px, 1.2fr) 7.5ch 34px;
    align-items: center; gap: 6px; min-height: 26px; font-size: 13px;
    padding: 0 4px; border-radius: 6px;
  }
  .hp-row.mine {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    box-shadow: inset 0 0 0 1.5px var(--accent);
  }
  .hp-row.mine .hp-name { font-weight: 600; }
  .hp-num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hp-bar { height: 8px; border-radius: 4px; background: var(--hp-bg); overflow: hidden; }
  .hp-fill { height: 100%; width: 100%; background: var(--hp-ok); border-radius: 4px; transition: width .15s linear; }
  .hp-fill.low { background: var(--hp-low); }
  .hp-val {
    text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap;
    color: var(--hp-text); font-weight: 700;
  }
  .cd { text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .hp-row.out { opacity: .5; }
  .hp-row.out .hp-name { text-decoration: line-through; }
  .hp-row.out .hp-fill { width: 0 !important; }
  .hp-val .hp-max { color: var(--muted); font-weight: 400; }

  @media (max-width: 380px) {
    /* 아주 좁은 폰: 5열×4행 유지 (칸 약 57px @360), 점 위·이름 아래, 글자만 조금 작게 */
    .add-btn { font-size: 11px; padding: 4px 1px; }
    .hp-row { grid-template-columns: 20px minmax(0, 1fr) minmax(40px, 1fr) 7.5ch 30px; gap: 4px; font-size: 12px; }
  }

  /* ===== 액션 도크 / 도구 막대 / 패널 (공통 모양) =====
     #actionDock = 스킬 + 시작/일시정지/재시작/결과 바로 보기. 고정(fixed) 도크는 없다:
     모바일은 아레나 바로 아래 줄, PC는 사이드 열 카드 안 → 어떤 화면 높이에서도 아레나를 가리지 않는다. */
  .action-dock { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  button#skillBtn { min-height: 52px; font-size: 16px; }

  /* ===== 가상 조이스틱 =====
     #joystick(터치 영역 120px) > .joy-base(바탕 108px) > .joy-knob(손잡이 48px).
     손잡이 이동 반지름 --joy-r = (108 - 48) / 2 = 30px, JS가 --jx/--jy(-1~1)를 #joystick 에 넣는다.
     보이는 조건: body.in-battle.mode-play 이면서 (모바일 배치 또는 pointer: coarse). 그 밖에는 숨김.
     보일 때 도크 = [조이스틱 | 스킬(조이스틱 높이)] / [시작·일시정지·재시작·결과] (가로 폰은 아래 모바일 가로 블록) */
  .joystick {
    --joy-size: 120px; --joy-base: 108px; --joy-knob: 48px;
    --joy-r: calc((var(--joy-base) - var(--joy-knob)) / 2);
    display: none; flex: none; width: var(--joy-size); height: var(--joy-size);
    align-items: center; justify-content: center; position: relative;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    cursor: grab;
  }
  .joy-base {
    width: var(--joy-base); height: var(--joy-base); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; position: relative;
    background: var(--btn); border: 1px solid var(--border);
    box-shadow: inset 0 2px 8px var(--shadow);
    pointer-events: none;
  }
  /* 이동 범위 안내 원 */
  .joy-base::before {
    content: ""; position: absolute; inset: calc(var(--joy-knob) / 2 - 1px); border-radius: 50%;
    border: 1px dashed var(--border);
  }
  .joy-knob {
    width: var(--joy-knob); height: var(--joy-knob); border-radius: 50%; position: relative;
    background: var(--panel); border: 2px solid var(--accent);
    box-shadow: 0 2px 6px var(--shadow);
    transform: translate(calc(var(--jx, 0) * var(--joy-r)), calc(var(--jy, 0) * var(--joy-r)));
    transition: transform .12s ease-out;   /* 손을 떼면 가운데로 부드럽게 복귀 */
  }
  .joystick.active { cursor: grabbing; }
  .joystick.active .joy-base {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--btn));
    box-shadow: inset 0 2px 8px var(--shadow), 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .joystick.active .joy-knob { background: var(--accent); border-color: var(--accent-text); transition: none; }
  /* 보이기 + 도크 2열 배치 (같은 규칙을 모바일 배치 / 터치 기기 두 조건에 둔다) */
  :root:not([data-layout="pc"]) body.in-battle.mode-play .joystick { display: flex; }
  :root:not([data-layout="pc"]) body.in-battle.mode-play .action-dock {
    display: grid; grid-template-columns: var(--joy-size, 120px) minmax(0, 1fr); gap: 6px;
  }
  :root:not([data-layout="pc"]) body.in-battle.mode-play .action-dock > .joystick { grid-column: 1; grid-row: 1; }
  :root:not([data-layout="pc"]) body.in-battle.mode-play .action-dock > #skillBtn { grid-column: 2; grid-row: 1; min-height: 120px; height: auto; font-size: 18px; }
  :root:not([data-layout="pc"]) body.in-battle.mode-play .action-dock > .ctrl-row { grid-column: 1 / -1; }
  @media (pointer: coarse) {
    body.in-battle.mode-play .joystick { display: flex; }
    body.in-battle.mode-play .action-dock {
      display: grid; grid-template-columns: var(--joy-size, 120px) minmax(0, 1fr); gap: 6px;
    }
    body.in-battle.mode-play .action-dock > .joystick { grid-column: 1; grid-row: 1; }
    body.in-battle.mode-play .action-dock > #skillBtn { grid-column: 2; grid-row: 1; min-height: 120px; height: auto; font-size: 18px; }
    body.in-battle.mode-play .action-dock > .ctrl-row { grid-column: 1 / -1; }
  }
  .panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; min-height: 0; }
  .panel-head .field-label { margin: 0; }
  .panel-close {
    flex: none; width: 44px; height: 44px; margin: -10px -8px -10px auto; padding: 0;
    border: 0; border-radius: 8px; background: transparent; color: var(--muted);
    font: inherit; font-size: 22px; line-height: 1; cursor: pointer;
  }
  .panel-close:active { background: var(--btn-hover); color: var(--text); }
  .field-head > .panel-close { margin: -6px -8px -6px 0; }
  .tool {
    width: 100%; min-height: 48px; padding: 0; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 10px; background: var(--btn); color: var(--text); cursor: pointer;
  }
  .tool svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tool:active { background: var(--btn-hover); }
  .tool[aria-expanded="true"] { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  /* 직접 모드 일시정지 중엔 페이지 스크롤 허용(JS가 body.paused 를 붙일 때) */
  body.in-battle.mode-play.paused canvas#arena { touch-action: manipulation; }

  /* ===== 모바일 배치 (기본: data-layout 없음 또는 "mobile") =====
     [헤더: ← … 모바일|PC 언어 / 제목 / 상태 카드]
     [아레나 | 도구 막대(52px)]
     [도크: (직접 모드면 스킬, 전투 중엔 조이스틱|스킬) + 시작/일시정지/재시작/결과]
     [열린 패널 1개: .app[data-open] 과 같은 data-panel-id]
     아레나 폭 = 격자 열 폭(100%, 스크롤바 제외 실제 폭) 과 --bw(높이 기준 한 변) 중 작은 값.
     --bw = max(160px, 화면 높이 - 여백 - 헤더 - 도크). --head-h / --dock-h 는 그 상태의 "최대" 높이
     → 글이 짧으면 아레나가 몇 px 덜 커질 뿐 넘치지 않는다. 100vw 는 스크롤바를 포함해 쓰지 않는다. */
  :root:not([data-layout="pc"]) { scrollbar-gutter: stable; }   /* 패널을 열어 스크롤바가 생겨도 폭이 그대로 */
  :root:not([data-layout="pc"]) .app {
    --app-max: 480px;
    --tools-w: 52px;
    /* 헤더 줄 52 + 6 + 제목 22 + 6 + 상태 카드 최대 72(여백·테두리 14 + 상태 2줄 40 + 2 + 보조 1줄 16) */
    --head-h: 158px;
    --dock-h: 52px;    /* 버튼 줄 44 + gap 8 */
    --pad-y: 20px;
    --bw: max(160px, calc(100vh - var(--pad-y) - var(--head-h) - 8px - var(--dock-h)));
    max-width: var(--app-max);
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    grid-template-columns: minmax(0, 1fr) var(--tools-w);
    grid-template-areas: "head head" "board tools" "dock dock" "panel panel";
    gap: 8px;
  }
  @supports (height: 100dvh) {
    :root:not([data-layout="pc"]) .app {
      --bw: max(160px, calc(100dvh - var(--pad-y) - var(--head-h) - 8px - var(--dock-h)));
    }
  }
  /* 직접 모드(준비 중): 스킬 버튼(52) + 6 이 도크에 더해지고, 조작 안내가 보조 줄 최대 3줄(+32) */
  :root:not([data-layout="pc"]) body.mode-play .app { --dock-h: 110px; --head-h: 190px; }
  /* 직접 모드 전투 중: 조이스틱|스킬 줄 120 + 6 + 버튼 줄 44 + gap 8. 보조 줄은 시간 1줄 */
  :root:not([data-layout="pc"]) body.in-battle.mode-play .app { --dock-h: 178px; --head-h: 158px; }
  /* 헤더 2줄: [←][        ][모바일|PC][언어] / [제목(전체 폭)] / [상태 카드] */
  :root:not([data-layout="pc"]) .head {
    display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; align-items: center; gap: 6px;
  }
  :root:not([data-layout="pc"]) .head-row,
  :root:not([data-layout="pc"]) .title-row { display: contents; }
  :root:not([data-layout="pc"]) .back {
    order: 1; width: 44px; margin: 0; padding: 0; justify-content: center;
    font-size: 0; /* 글자는 접근성 이름으로 남기고 화살표만 표시 */
  }
  :root:not([data-layout="pc"]) .back::before { content: "\2190"; font-size: 22px; line-height: 1; }
  :root:not([data-layout="pc"]) #layoutSeg { order: 3; grid-column: 3; margin: 0; }
  :root:not([data-layout="pc"]) #layoutSeg button { min-width: 44px; padding: 6px 8px; font-size: 12px; }
  :root:not([data-layout="pc"]) select.lang { order: 4; grid-column: 4; margin: 0; max-width: 92px; padding: 8px 4px; }
  /* 제목: 둘째 줄 전체 폭(360px에서 약 328px → 가장 긴 fr "Bataille de boules" 약 160px 도 한 줄) */
  :root:not([data-layout="pc"]) h1 {
    order: 5; grid-column: 1 / -1; font-size: 17px; line-height: 22px; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  :root:not([data-layout="pc"]) .head > .card { order: 6; grid-column: 1 / -1; padding: 6px 10px; }
  /* 상태: 최대 2줄, 보조 줄(조작 안내): 최대 3줄. 넘치면 마지막 줄 말줄임(전체 문장은 role=status 로 읽힘).
     높이 상한이 정해져 있어 --head-h(최대값)로 한 화면 맞춤이 유지된다 */
  :root:not([data-layout="pc"]) .status {
    font-size: 15px; line-height: 20px; min-height: 20px; max-height: 40px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
  }
  :root:not([data-layout="pc"]) .status-sub {
    line-height: 16px; min-height: 16px; max-height: 48px; margin-top: 2px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
  }
  /* 아레나: 열 폭(100%) 안에서 --bw 이하. 열 폭은 스크롤바를 뺀 실제 폭이라 패널을 열어도 밀리지 않는다 */
  :root:not([data-layout="pc"]) .arena-wrap { width: 100%; max-width: var(--bw); justify-self: end; }
  :root:not([data-layout="pc"]) .tools { display: contents; }
  :root:not([data-layout="pc"]) .tool-group {
    grid-area: tools; display: flex; flex-direction: column; gap: 6px;
    max-height: var(--bw); overflow-y: auto; overscroll-behavior: contain;
  }
  /* 버튼 4개 + 간격 3개(18)가 --bw 안에 들도록 높이를 44~48px 사이로 줄인다(1px 여유). --bw 가 194px 미만이면 44px 고정 + 스크롤 */
  :root:not([data-layout="pc"]) .tool { min-height: clamp(44px, calc((var(--bw) - 19px) / 4), 48px); }
  :root:not([data-layout="pc"]) .action-dock { grid-area: dock; }
  :root:not([data-layout="pc"]) .side { display: contents; }
  :root:not([data-layout="pc"]) [data-panel-id] { grid-area: panel; box-shadow: 0 6px 20px var(--shadow); }
  /* 한 번에 하나: .app[data-open] 과 같은 패널만 보인다(속성 없음 = 모두 닫힘) */
  :root:not([data-layout="pc"]) .app:not([data-open="battle"]) [data-panel-id="battle"],
  :root:not([data-layout="pc"]) .app:not([data-open="controls"]) [data-panel-id="controls"],
  :root:not([data-layout="pc"]) .app:not([data-open="lineup"]) [data-panel-id="lineup"],
  :root:not([data-layout="pc"]) .app:not([data-open="bg"]) [data-panel-id="bg"] { display: none; }
  /* 배경 패널: 패널 자체가 접힘 역할 → summary 숨김(JS가 패널을 열 때 #bgSettings.open = true) */
  :root:not([data-layout="pc"]) .settings > summary { display: none; }
  :root:not([data-layout="pc"]) .settings-body { padding: 0; border-top: 0; }
  /* 전투 중: 잠긴 설정(모드·전투 방식·팀 수·내 공)은 숨기고 설정 패널엔 속도만 */
  :root:not([data-layout="pc"]) body.in-battle .card.stack > .set-field { display: none; }

  /* 모바일 가로(높이 ≤500px): [헤더 / 도크 / 패널 | 아레나 | 도구 막대]
     왼쪽 열 최소 272px: 카드 안쪽 246px → 공 추가 5열 46px, 속도 5칸 46px, 모드·전투 방식 54px, 팀 수 77px.
     아레나 열 = minmax(0, --bw): 왼쪽 최소·도구 막대를 뺀 남은 폭과 --bw(높이) 중 작은 값을 격자가 정한다(100vw 미사용). */
  @media (orientation: landscape) and (max-height: 500px) {
    :root:not([data-layout="pc"]) .app {
      --app-max: 1000px;
      --left-min: 272px;
      --dock-h: 94px;    /* 버튼 2×2 = 44 + 6 + 44 */
      --bw: max(160px, calc(100vh - var(--pad-y)));
      grid-template-columns: minmax(var(--left-min), 1fr) minmax(0, var(--bw)) var(--tools-w);
      grid-template-areas: "head board tools" "dock board tools" "panel board tools";
      grid-template-rows: auto auto 1fr;
    }
    @supports (height: 100dvh) {
      :root:not([data-layout="pc"]) .app { --bw: max(160px, calc(100dvh - var(--pad-y))); }
    }
    /* 직접 모드: 스킬 52 + 6 + 2×2(94). 전투 중 조이스틱(120)은 그 왼쪽에 놓여 높이가 늘지 않는다 */
    :root:not([data-layout="pc"]) body.mode-play .app,
    :root:not([data-layout="pc"]) body.in-battle.mode-play .app { --dock-h: 152px; }
    :root:not([data-layout="pc"]) .arena-wrap { width: 100%; max-width: none; }
    :root:not([data-layout="pc"]) .ctrl-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    /* 조작 안내는 좁은 열(약 250px)에서 3줄 안에 들도록 12px */
    :root:not([data-layout="pc"]) .status-sub { font-size: 12px; line-height: 15px; min-height: 15px; max-height: 45px; }
    /* 전투 중 직접 모드 도크: [조이스틱 | 스킬 / 버튼 2×2] (왼쪽 열 높이 = 헤더 + 152) */
    :root:not([data-layout="pc"]) body.in-battle.mode-play .action-dock {
      grid-template-columns: 120px minmax(0, 1fr); grid-template-rows: auto auto; align-items: center;
    }
    :root:not([data-layout="pc"]) body.in-battle.mode-play .action-dock > .joystick { grid-row: 1 / span 2; }
    :root:not([data-layout="pc"]) body.in-battle.mode-play .action-dock > #skillBtn { min-height: 52px; font-size: 16px; }
    :root:not([data-layout="pc"]) body.in-battle.mode-play .action-dock > .ctrl-row { grid-column: 2; grid-row: 2; }
    :root:not([data-layout="pc"]) body.in-battle.mode-play .ctrl-row button.btn { font-size: 12px; padding: 6px 2px; overflow-wrap: normal; hyphens: auto; -webkit-hyphens: auto; }
    /* 전투 현황: 좁은 열 → 행을 2줄(번호·이름·HP·쿨다운 / HP 바)로 해서 이름 폭 확보(약 110px) */
    :root:not([data-layout="pc"]) .hp-row {
      grid-template-columns: 22px minmax(0, 1fr) auto 34px;
      grid-template-areas: "num name val cd" ". bar bar bar";
      row-gap: 3px; padding: 5px 4px;
    }
    :root:not([data-layout="pc"]) .hp-num { grid-area: num; }
    :root:not([data-layout="pc"]) .hp-name { grid-area: name; }
    :root:not([data-layout="pc"]) .hp-bar { grid-area: bar; }
    :root:not([data-layout="pc"]) .hp-val { grid-area: val; }
    :root:not([data-layout="pc"]) .cd { grid-area: cd; }
    :root:not([data-layout="pc"]) [data-panel-id] {
      /* 헤더·도크·격자 간격(8×2)을 뺀 남은 높이 */
      max-height: max(120px, calc(100dvh - var(--pad-y) - var(--head-h) - var(--dock-h) - 16px));
      overflow-y: auto; overscroll-behavior: contain;
      /* 데스크톱 스크롤바(약 15px)가 패널 안쪽 폭을 줄여도 공 추가·속도 5칸이 44px 이상: 272 - 2 - 14 - 15 = 241 → 45px */
      padding-left: 8px; padding-right: 6px;
    }
  }

  /* ===== 배경 설정 (접힘, <details>) ===== */
  /* PC: 카드 = 접힘 summary 한 줄. 모바일 패널에서는 일반 카드 여백(아래 모바일 블록) */
  :root[data-layout="pc"] .settings-card { padding: 0; }
  .settings > summary {
    list-style: none; display: flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 14px 0 12px; border-radius: 11px;
    font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .settings > summary::-webkit-details-marker { display: none; }
  /* 펼침 표시: 닫힘 ▽ / 열림 △ 모양의 꺾쇠 */
  .settings > summary::after {
    content: ""; flex: none; margin-left: auto; width: 8px; height: 8px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-2px) rotate(45deg); transition: transform .15s ease;
  }
  .settings[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
  .settings[open] > summary { border-radius: 11px 11px 0 0; }
  .settings > summary:focus-visible { outline-offset: -2px; }
  .settings > summary:active { background: var(--btn-hover); }
  .settings-body {
    display: flex; flex-direction: column; gap: 12px;
    padding: 10px 12px 12px; border-top: 1px solid var(--border);
  }

  /* ===== 아레나 배경 테마 선택 =====
     버튼마다 --p1(하늘) --p2(먼 배경) --p3(가까운 배경) --pa(포인트)를 토큰에서 받아 미리보기 띠를 그린다. */
  .theme-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .theme-btn {
    font: inherit; font-size: 12px; color: var(--text); background: var(--btn);
    border: 1px solid var(--border); border-radius: 8px; min-height: 60px; padding: 5px 4px 6px;
    display: flex; flex-direction: column; align-items: stretch; gap: 5px; cursor: pointer;
    line-height: 1.15; min-width: 0; text-align: center;
  }
  .theme-btn > span:last-child { overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto; }
  .theme-btn.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
  .theme-sw {
    display: block; height: 26px; border-radius: 5px;
    box-shadow: inset 0 0 0 1px var(--border);
    background:
      radial-gradient(circle at 76% 30%, var(--pa) 0 3px, transparent 3.5px),
      radial-gradient(circle at 28% 22%, var(--pa) 0 1.5px, transparent 2px),
      linear-gradient(to bottom, var(--p1) 0 30%, var(--p2) 30% 55%, var(--p2) 55% 68%, var(--p3) 68% 100%);
  }
  .theme-btn[data-v="city"]    { --p1: var(--sky-top); --p2: var(--bldg-far); --p3: var(--bldg-near); --pa: var(--bldg-window); }
  .theme-btn[data-v="forest"]  { --p1: var(--abg-forest-sky1);  --p2: var(--abg-forest-far);  --p3: var(--abg-forest-near);  --pa: var(--abg-forest-accent); }
  .theme-btn[data-v="desert"]  { --p1: var(--abg-desert-sky1);  --p2: var(--abg-desert-far);  --p3: var(--abg-desert-near);  --pa: var(--abg-desert-accent); }
  .theme-btn[data-v="space"]   { --p1: var(--abg-space-sky1);   --p2: var(--abg-space-far);   --p3: var(--abg-space-near);   --pa: var(--abg-space-accent); }
  .theme-btn[data-v="ocean"]   { --p1: var(--abg-ocean-sky1);   --p2: var(--abg-ocean-far);   --p3: var(--abg-ocean-near);   --pa: var(--abg-ocean-accent); }
  .theme-btn[data-v="volcano"] { --p1: var(--abg-volcano-sky1); --p2: var(--abg-volcano-far); --p3: var(--abg-volcano-near); --pa: var(--abg-volcano-accent); }
  .theme-btn[data-v="snow"]    { --p1: var(--abg-snow-sky1);    --p2: var(--abg-snow-far);    --p3: var(--abg-snow-near);    --pa: var(--abg-snow-accent); }
  .theme-btn[data-v="plain"] .theme-sw { background: var(--arena); }

  /* ===== 공 꾸미기 다이얼로그 =====
     #customOverlay(화면 고정 스크림, 기본 .hidden) > #customDialog(role=dialog).
     머리(제목)·발(버튼)은 고정, 가운데 .custom-body 만 스크롤 → 375px·낮은 화면 대응.
     z-index 20 > 액션 도크 4, 결과 오버레이 5. */
  .modal-scrim {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: var(--scrim);
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    overscroll-behavior: contain;
  }
  .dialog.custom-dialog {
    width: min(420px, 100%); max-height: 100%; max-height: calc(100dvh - 32px);
    padding: 0; gap: 0; text-align: left; overflow: hidden;
  }
  .custom-head { padding: 16px 18px 10px; border-bottom: 1px solid var(--border); flex: none; }
  .custom-head h2 { font-size: 18px; }
  .custom-head .custom-target { color: var(--muted); font-weight: 400; }
  .custom-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding: 14px 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .custom-foot {
    flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
    padding: 12px 18px 16px; border-top: 1px solid var(--border);
  }
  .custom-foot button.btn { min-width: 0; padding: 9px 6px; line-height: 1.2; overflow-wrap: anywhere; }
  canvas#customPreview {
    display: block; width: 160px; height: 160px; margin: 0 auto; flex: none;
    background: var(--arena); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--arena-line);
  }
  input.text-field {
    font: inherit; font-size: 16px; /* iOS 확대 방지 */
    width: 100%; min-height: 44px; padding: 8px 10px;
    color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 8px;
  }
  input.text-field::placeholder { color: var(--muted); opacity: 1; }
  input.text-field:focus-visible { outline-offset: 1px; }
  /* 옵션 칩: 6·5개 → 3열 그리드 (.seg 모양 유지) */
  .seg.chips { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .seg.chips button { font-size: 13px; padding: 8px 4px; overflow-wrap: anywhere; }
  /* 공 색: 기본 스와치는 직업색(JS가 #customColors 에 --sw-def 지정) + 대각선 */
  #customColors .swatch.default {
    background:
      linear-gradient(135deg, transparent calc(50% - 1px), var(--muted) calc(50% - 1px), var(--muted) calc(50% + 1px), transparent calc(50% + 1px)),
      var(--sw-def, var(--btn));
  }
  #customColors { gap: 8px; }
  @media (max-width: 400px) {
    .custom-head { padding: 14px 14px 8px; }
    .custom-body { padding: 12px 14px; gap: 12px; }
    .custom-foot { padding: 10px 14px 14px; gap: 6px; }
    .custom-foot button.btn { font-size: 13px; }
    #customColors { gap: 6px; }
  }

  /* ===== 누름 / 호버 =====
     터치: 누르는 동안 :active 로 즉시 피드백 (상태 정보는 hover 에 두지 않는다).
     hover 는 마우스 등 실제 호버가 되는 기기에서만 → 탭 후 호버색이 남는 문제 방지. */
  button.btn:not(:disabled):active, .add-btn:not(:disabled):active, .theme-btn:active,
  .li-del:not(:disabled):active, .li-edit:not(:disabled):active { background: var(--btn-hover); }
  button.btn.primary:not(:disabled):active, button#skillBtn.ready:active { background: var(--accent); filter: brightness(.92); }
  .li-team:not(:disabled):active { background-color: color-mix(in srgb, var(--tc, var(--muted)) 24%, transparent); }
  .seg button:not(:disabled):not(.on):active { background: var(--btn-hover); }
  .swatch:active, .swatch-custom:active { transform: scale(.92); }
  .back:active { color: var(--on-page); background: color-mix(in srgb, var(--on-page) 12%, transparent); }
  @media (hover: hover) {
    .back:hover { color: var(--on-page); }
    button.btn:not(:disabled):hover { background: var(--btn-hover); }
    button.btn.primary:not(:disabled):hover { background: var(--accent); filter: brightness(1.08); }
    .swatch:hover, .swatch-custom:hover { box-shadow: 0 0 0 2px var(--btn-hover); }
    .swatch.on:hover, .swatch-custom.on:hover { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
    .add-btn:not(:disabled):hover { background: var(--btn-hover); }
    .li-del:not(:disabled):hover, .li-edit:not(:disabled):hover { background: var(--btn-hover); color: var(--text); }
    .li-team:not(:disabled):hover { background-color: color-mix(in srgb, var(--tc, var(--muted)) 24%, transparent); }
    .theme-btn:hover { background: var(--btn-hover); }
    .settings > summary:hover { background: var(--btn-hover); }
  }

  /* ===== PC 배치: html[data-layout="pc"] =====
     "pc" = 이전 PC 배치를 폭 제한 없이(모바일 도구 막대·패널 전환은 쓰지 않고 모든 카드가 보임):
     >1100px : [전투 현황 | 아레나 | 헤더 / 도크 / 사이드] 3열
     821~1100: [아레나 | 헤더 / 도크 / 전투 현황 / 사이드] 2열
     ≤820px  : 1열(헤더 → 아레나 → 도크 → 전투 현황 → 사이드, 화면 폭 전체, 아레나 최대 600px)
     도크(#actionDock 카드)는 항상 문서 흐름 안 → 아레나를 가리지 않는다.
     -20px 은 세로 스크롤바 폭 여유. 이번 압축(접힌 배경 설정·5열 공 추가 등)은 그대로 쓴다. */
  :root[data-layout="pc"] .app {
    --left-w: 232px;
    --side-w: 300px;
    --bw: min(calc(100vw - 32px - var(--left-w) - var(--side-w) - 48px - 20px), calc(100vh - 48px), 640px);
    max-width: 1280px;
    padding: 24px 16px 40px;
    grid-template-columns: var(--left-w) auto var(--side-w);
    grid-template-areas: "left board head" "left board dock" "left board side";
    grid-template-rows: auto auto 1fr;
    gap: 14px 24px;
    justify-content: center;
  }
  :root[data-layout="pc"] .head { gap: 8px; }
  :root[data-layout="pc"] .arena-wrap { width: var(--bw); max-width: none; justify-self: start; }
  :root[data-layout="pc"] .battle { max-height: var(--bw); }
  :root[data-layout="pc"] .tools {
    grid-area: dock; min-width: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
  }
  :root[data-layout="pc"] .tool-group,
  :root[data-layout="pc"] .panel-close,
  :root[data-layout="pc"] .m-only { display: none; }
  :root[data-layout="pc"] .ctrl-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (min-width: 1101px) {
    /* 3열: 좁은 왼쪽 패널 → 행을 2줄(번호·이름·HP·쿨다운 / HP 바)로 */
    :root[data-layout="pc"] .hp-row {
      grid-template-columns: 22px minmax(0, 1fr) auto 34px;
      grid-template-areas: "num name val cd" ". bar bar bar";
      row-gap: 3px; padding: 5px 4px;
    }
    :root[data-layout="pc"] .hp-num { grid-area: num; }
    :root[data-layout="pc"] .hp-name { grid-area: name; }
    :root[data-layout="pc"] .hp-bar { grid-area: bar; }
    :root[data-layout="pc"] .hp-val { grid-area: val; }
    :root[data-layout="pc"] .cd { grid-area: cd; }
  }
  @media (max-width: 1100px) {
    :root[data-layout="pc"] .app {
      --bw: min(calc(100vw - 32px - var(--side-w) - 24px - 20px), calc(100vh - 48px), 600px);
      max-width: 1000px;
      grid-template-columns: auto var(--side-w);
      grid-template-areas: "board head" "board dock" "board left" "board side";
      grid-template-rows: auto auto auto 1fr;
    }
    /* 2열: 오른쪽 열 중간에 놓이므로 고정 높이 */
    :root[data-layout="pc"] .battle { max-height: 260px; }
  }
  @media (max-width: 820px) {
    :root[data-layout="pc"] .app {
      --bw: min(calc(100vw - 32px), 70vh, 600px);
      max-width: none;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "head" "board" "dock" "left" "side";
      grid-template-rows: auto;
      padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left));
      gap: 10px;
      justify-content: normal;
    }
    :root[data-layout="pc"] .arena-wrap { width: 100%; max-width: var(--bw); justify-self: center; }
    :root[data-layout="pc"] .battle { max-height: min(45vh, 360px); }
    :root[data-layout="pc"] .ctrl-row { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="head-row">
      <a class="back" href="index.html" data-i18n="back">← 게임 목록</a>
      <select class="lang" id="lang" aria-label="Language"></select>
    </div>
    <div class="title-row">
      <h1 data-i18n="title">공 배틀</h1>
      <div class="seg" id="layoutSeg" role="group" aria-label="화면 배치" data-i18n-aria="layout">
        <button type="button" data-v="mobile" aria-pressed="true" data-i18n="layoutMobile">모바일</button>
        <button type="button" data-v="pc" aria-pressed="false" data-i18n="layoutPc">PC</button>
      </div>
    </div>
    <div class="card">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="status-sub" id="statusSub"></div>
    </div>
  </header>

  <div class="arena-wrap">
    <canvas id="arena" role="img" aria-label="공 배틀 아레나" data-i18n-aria="arena"></canvas>
    <div class="overlay" id="overlay">
      <div class="dialog" role="dialog" aria-modal="false" aria-labelledby="ovTitle">
        <h2 id="ovTitle"></h2>
        <ol id="ovRank"></ol>
        <div class="row">
          <button class="btn" id="ovSelect" data-i18n="changeLineup">구성 변경</button>
          <button class="btn primary" id="ovRestart" data-i18n="restart">재시작</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 도구 막대: 모바일은 아레나 오른쪽 세로 열(아이콘), PC는 사이드 열의 시작/일시정지 카드.
       .tool[data-panel] 은 아래 [data-panel-id] 패널을 연다(JS: .app[data-open]). -->
  <nav class="tools" id="tools" aria-label="도구" data-i18n-aria="tools">
    <div class="action-dock" id="actionDock">
      <!-- 가상 조이스틱(직접 모드 전투 중, 모바일 배치 또는 터치 기기). 손잡이 위치 = JS가 --jx/--jy(-1~1), 누르는 중 .active -->
      <div id="joystick" class="joystick" aria-hidden="true"><div class="joy-base"><div class="joy-knob"></div></div></div>
      <button class="btn hidden" id="skillBtn" data-i18n="skill">스킬 사용</button>
      <div class="row ctrl-row">
        <button class="btn primary" id="startBtn" data-i18n="start">시작</button>
        <button class="btn" id="pauseBtn" data-i18n="pause">일시정지</button>
        <button class="btn" id="restartBtn" data-i18n="restart">재시작</button>
        <button id="skipBtn" class="btn" data-i18n="skip">결과 바로 보기</button>
      </div>
    </div>
    <div class="tool-group">
      <button type="button" class="tool" data-panel="lineup" aria-controls="panelLineup" aria-expanded="false" aria-label="공 구성" data-i18n-aria="lineup">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="7" cy="8" r="3.2"/><circle cx="17" cy="8" r="3.2"/><circle cx="12" cy="16.5" r="3.2"/></svg>
      </button>
      <button type="button" class="tool" data-panel="controls" aria-controls="panelControls" aria-expanded="false" aria-label="게임 설정" data-i18n-aria="controls">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
      </button>
      <button type="button" class="tool" data-panel="battle" aria-controls="panelBattle" aria-expanded="false" aria-label="전투 현황" data-i18n-aria="battleStatus">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h11M4 18h7"/></svg>
      </button>
      <button type="button" class="tool" data-panel="bg" aria-controls="panelBg" aria-expanded="false" aria-label="배경 설정" data-i18n-aria="bgSettings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 16l5-5 4 4 3-3 5 5"/><circle cx="15.5" cy="9" r="1.6"/></svg>
      </button>
    </div>
  </nav>

  <section class="card battle" id="panelBattle" data-panel-id="battle" aria-labelledby="hpLabel">
    <div class="panel-head">
      <span class="field-label" id="hpLabel" data-i18n="battleStatus">전투 현황</span>
      <button type="button" class="panel-close" aria-label="닫기" data-i18n-aria="close">×</button>
    </div>
    <div id="hpList"></div>
  </section>

  <div class="side">
    <section class="card stack" id="panelControls" data-panel-id="controls" aria-labelledby="controlsTitle">
      <div class="panel-head m-only">
        <span class="field-label panel-title" id="controlsTitle" data-i18n="controls">게임 설정</span>
        <button type="button" class="panel-close" aria-label="닫기" data-i18n-aria="close">×</button>
      </div>
      <div class="set-field">
        <span class="field-label" id="modeLabel" data-i18n="mode">모드</span>
        <div class="seg" id="modeSeg" role="group" aria-labelledby="modeLabel">
          <button data-v="watch" class="on" data-i18n="modeWatch">관전</button>
          <button data-v="play" data-i18n="modePlay">직접</button>
        </div>
      </div>
      <div class="set-field">
        <span class="field-label" id="battleLabel" data-i18n="battleMode">전투 방식</span>
        <div class="seg" id="battleSeg" role="group" aria-labelledby="battleLabel">
          <button data-v="ffa" class="on" data-i18n="ffa">개인전</button>
          <button data-v="team" data-i18n="team">팀전</button>
        </div>
      </div>
      <div id="teamField" class="set-field hidden">
        <span class="field-label" id="teamCountLabel" data-i18n="teamCount">팀 수</span>
        <div class="seg" id="teamCountSeg" role="group" aria-labelledby="teamCountLabel">
          <button data-v="2" class="on">2</button>
          <button data-v="3">3</button>
          <button data-v="4">4</button>
        </div>
      </div>
      <div id="myField" class="set-field">
        <label class="field-label" for="mySelect" data-i18n="myBall">내 공</label>
        <select class="field hidden" id="mySelect"></select>
      </div>
      <div class="speed-field">
        <span class="field-label" id="speedLabel" data-i18n="speed">속도</span>
        <div class="seg" id="speedSeg" role="group" aria-labelledby="speedLabel">
          <button data-v="1" class="on">1x</button>
          <button data-v="1.5">1.5x</button>
          <button data-v="2">2x</button>
          <button data-v="2.5">2.5x</button>
          <button data-v="3">3x</button>
        </div>
      </div>
    </section>

    <section class="card lineup-card" id="panelLineup" data-panel-id="lineup" aria-labelledby="lineupLabel">
      <div class="field-head">
        <span class="field-label" id="lineupLabel" data-i18n="lineup">공 구성</span>
        <span class="count" id="lineupCount">0 / 20</span>
        <div class="lineup-foot">
          <button class="btn small hidden" id="autoTeamBtn" data-i18n="autoTeam">팀 자동 배분</button>
          <button class="btn small" id="clearBtn" data-i18n="clear">모두 지우기</button>
        </div>
        <button type="button" class="panel-close" aria-label="닫기" data-i18n-aria="close">×</button>
      </div>
      <div class="add-bar" id="addBar">
        <button class="add-btn" data-type="charger" aria-label="돌격 추가" data-i18n-aria="addCharger"><span class="dot" style="background: var(--c-charger)"></span><span data-i18n="charger">돌격</span></button>
        <button class="add-btn" data-type="spike" aria-label="가시 추가" data-i18n-aria="addSpike"><span class="dot" style="background: var(--c-spike)"></span><span data-i18n="spike">가시</span></button>
        <button class="add-btn" data-type="healer" aria-label="치유 추가" data-i18n-aria="addHealer"><span class="dot" style="background: var(--c-healer)"></span><span data-i18n="healer">치유</span></button>
        <button class="add-btn" data-type="twin" aria-label="분신 추가" data-i18n-aria="addTwin"><span class="dot" style="background: var(--c-twin)"></span><span data-i18n="twin">분신</span></button>
        <button class="add-btn" data-type="shooter" aria-label="사수 추가" data-i18n-aria="addShooter"><span class="dot" style="background: var(--c-shooter)"></span><span data-i18n="shooter">사수</span></button>
        <button class="add-btn" data-type="guardian" aria-label="수호 추가" data-i18n-aria="addGuardian"><span class="dot" style="background: var(--c-guardian)"></span><span data-i18n="guardian">수호</span></button>
        <button class="add-btn" data-type="mage" aria-label="마법 추가" data-i18n-aria="addMage"><span class="dot" style="background: var(--c-mage)"></span><span data-i18n="mage">마법</span></button>
        <button class="add-btn" data-type="bomber" aria-label="폭탄 추가" data-i18n-aria="addBomber"><span class="dot" style="background: var(--c-bomber)"></span><span data-i18n="bomber">폭탄</span></button>
        <button class="add-btn" data-type="vampire" aria-label="흡혈 추가" data-i18n-aria="addVampire"><span class="dot" style="background: var(--c-vampire)"></span><span data-i18n="vampire">흡혈</span></button>
        <button class="add-btn" data-type="frost" aria-label="빙결 추가" data-i18n-aria="addFrost"><span class="dot" style="background: var(--c-frost)"></span><span data-i18n="frost">빙결</span></button>
        <button class="add-btn" data-type="blink" aria-label="섬광 추가" data-i18n-aria="addBlink"><span class="dot" style="background: var(--c-blink)"></span><span data-i18n="blink">섬광</span></button>
        <button class="add-btn" data-type="magnet" aria-label="자석 추가" data-i18n-aria="addMagnet"><span class="dot" style="background: var(--c-magnet)"></span><span data-i18n="magnet">자석</span></button>
        <button class="add-btn" data-type="giant" aria-label="거인 추가" data-i18n-aria="addGiant"><span class="dot" style="background: var(--c-giant)"></span><span data-i18n="giant">거인</span></button>
        <button class="add-btn" data-type="poison" aria-label="독 추가" data-i18n-aria="addPoison"><span class="dot" style="background: var(--c-poison)"></span><span data-i18n="poison">독</span></button>
        <button class="add-btn" data-type="storm" aria-label="번개 추가" data-i18n-aria="addStorm"><span class="dot" style="background: var(--c-storm)"></span><span data-i18n="storm">번개</span></button>
        <button class="add-btn" data-type="berserker" aria-label="광전사 추가" data-i18n-aria="addBerserker"><span class="dot" style="background: var(--c-berserker)"></span><span data-i18n="berserker">광전사</span></button>
        <button class="add-btn" data-type="ghost" aria-label="유령 추가" data-i18n-aria="addGhost"><span class="dot" style="background: var(--c-ghost)"></span><span data-i18n="ghost">유령</span></button>
        <button class="add-btn" data-type="mirror" aria-label="반사 추가" data-i18n-aria="addMirror"><span class="dot" style="background: var(--c-mirror)"></span><span data-i18n="mirror">반사</span></button>
        <button class="add-btn" data-type="sniper" aria-label="저격 추가" data-i18n-aria="addSniper"><span class="dot" style="background: var(--c-sniper)"></span><span data-i18n="sniper">저격</span></button>
        <button class="add-btn" data-type="swapper" aria-label="교환 추가" data-i18n-aria="addSwapper"><span class="dot" style="background: var(--c-swapper)"></span><span data-i18n="swapper">교환</span></button>
      </div>
      <ul id="lineup" aria-labelledby="lineupLabel"></ul>
      <p class="hint" id="lineupHint" aria-live="polite"></p>
    </section>

    <section class="card settings-card" id="panelBg" data-panel-id="bg" aria-labelledby="bgSettingsTitle">
    <div class="panel-head m-only">
      <span class="field-label panel-title" id="bgSettingsTitle" data-i18n="bgSettings">배경 설정</span>
      <button type="button" class="panel-close" aria-label="닫기" data-i18n-aria="close">×</button>
    </div>
    <details class="settings" id="bgSettings">
      <summary data-i18n="bgSettings">배경 설정</summary>
      <div class="settings-body">
    <section id="bgField" aria-labelledby="bgLabel">
      <div class="bg-head">
        <span class="field-label" id="bgLabel" data-i18n="bgColor">배경색</span>
        <button class="btn small" id="bgResetBtn" data-i18n="reset">초기화</button>
      </div>
      <div class="swatches" id="bgSwatches" role="group" aria-labelledby="bgLabel">
        <button class="swatch default on" data-color="" aria-pressed="true" aria-label="기본" data-i18n-aria="swDefault"></button>
        <button class="swatch" data-color="#1f2a44" style="--sw:#1f2a44" aria-pressed="false" aria-label="남색" data-i18n-aria="swNavy"></button>
        <button class="swatch" data-color="#2f4a3a" style="--sw:#2f4a3a" aria-pressed="false" aria-label="숲색" data-i18n-aria="swForest"></button>
        <button class="swatch" data-color="#4a2f45" style="--sw:#4a2f45" aria-pressed="false" aria-label="자두색" data-i18n-aria="swPlum"></button>
        <button class="swatch" data-color="#2a2a2e" style="--sw:#2a2a2e" aria-pressed="false" aria-label="숯색" data-i18n-aria="swCharcoal"></button>
