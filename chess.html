function applySkin() {
  app.dataset.pieces = skin.pieces;
  boardEl.dataset.board = skin.board;
  for (const b of $('skinPieces').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.v === skin.pieces));
  for (const b of $('skinBoard').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.v === skin.board));
}

// 픽셀 말: 12×12 몸통 격자('x'). 외곽선은 몸통 둘레 8칸(구멍 포함)에서 자동으로 만들어 14×14 SVG 로 그림
// SVG 의 rect: 몸통 class="pf", 외곽선 class="pe" (색은 CSS 가 백/흑에 따라 칠함)
const PX_PIECES = {
  P: ['............',
      '............',
      '.....xx.....',
      '....xxxx....',
      '....xxxx....',
      '.....xx.....',
      '....xxxx....',
      '.....xx.....',
      '.....xx.....',
      '....xxxx....',
      '...xxxxxx...',
      '..xxxxxxxx..'],
  R: ['............',
      '..xx.xx.xx..',
      '..xx.xx.xx..',
      '..xxxxxxxx..',
      '...xxxxxx...',
      '....xxxx....',
      '....xxxx....',
      '....xxxx....',
      '....xxxx....',
      '...xxxxxx...',
      '..xxxxxxxx..',
      '..xxxxxxxx..'],
  N: ['............',
      '.....x......',
      '....xxxx....',
      '...xxxxxx...',
      '..xxx.xxxx..',
      '.xxxxxxxxx..',
      '.xxx..xxxx..',
      '......xxxx..',
      '.....xxxxx..',
      '....xxxxx...',
      '...xxxxxxx..',
      '..xxxxxxxx..'],
  B: ['.....xx.....',
      '....xxxx....',
      '....xx.x....',
      '...xxx.xx...',
      '...xxxxxx...',
      '....xxxx....',
      '.....xx.....',
      '....xxxx....',
      '....xxxx....',
      '...xxxxxx...',
      '..xxxxxxxx..',
      '..xxxxxxxx..'],
  Q: ['.x..x..x..x.',
      '.x..x..x..x.',
      '.xx.xxxx.xx.',
      '.xxxxxxxxxx.',
      '..xxxxxxxx..',
      '...xxxxxx...',
      '....xxxx....',
      '....xxxx....',
      '...xxxxxx...',
      '..xxxxxxxx..',
      '.xxxxxxxxxx.',
      '.xxxxxxxxxx.'],
  K: ['.....xx.....',
      '....xxxx....',
      '.....xx.....',
      '..xx.xx.xx..',
      '.xxxxxxxxxx.',
      '.xxxxxxxxxx.',
      '..xxxxxxxx..',
      '...xxxxxx...',
      '...xxxxxx...',
      '..xxxxxxxx..',
      '.xxxxxxxxxx.',
      '.xxxxxxxxxx.'],
};
function pixelSprite(rows) {
  const W = 14, H = 14, g = [];
  for (let y = 0; y < H; y++) g.push(Array(W).fill('.'));
  rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) if (row[x] === 'x') g[y + 1][x + 1] = 'x'; });
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (g[y][x] !== '.') continue;
      let near = false;
      for (let dy = -1; dy <= 1 && !near; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const yy = y + dy, xx = x + dx;
          if (yy >= 0 && yy < H && xx >= 0 && xx < W && g[yy][xx] === 'x') { near = true; break; }
        }
      }
      if (near) g[y][x] = 'o';
    }
  }
  // 같은 색이 이어지는 가로 칸은 rect 하나로
  let out = '';
  for (let y = 0; y < H; y++) {
    let x = 0;
    while (x < W) {
      const ch = g[y][x];
      if (ch === '.') { x++; continue; }
      let e = x;
      while (e < W && g[y][e] === ch) e++;
      out += '<rect class="' + (ch === 'x' ? 'pf' : 'pe') + '" x="' + x + '" y="' + y + '" width="' + (e - x) + '" height="1"/>';
      x = e;
    }
  }
  return '<svg viewBox="0 0 14 14" shape-rendering="crispEdges" aria-hidden="true" focusable="false">' + out + '</svg>';
}
const PX_SVG = {};
for (const k of Object.keys(PX_PIECES)) PX_SVG[k] = pixelSprite(PX_PIECES[k]);

// 판·승진 창의 기물 하나 (말 세트에 따라 기호 / 픽셀 SVG / 글자)
function pieceEl(p) {
  const sp = document.createElement('span');
  sp.className = 'piece ' + p[0];
  sp.setAttribute('aria-hidden', 'true');
  if (skin.pieces === 'pixel') sp.innerHTML = PX_SVG[p[1]];
  else sp.textContent = skin.pieces === 'letter' ? p[1] : GLYPH[p[1]];
  return sp;
}

function newGame() {
  gen++;
  states = [initState()];
  moves = [];
  keys = [posKey(states[0])];
  selected = null;
  thinking = false;
  pendingPromo = null;
  justMoved = -1;
  flipped = mode === 'ai-w';
  focusSq = flipped ? 12 : 52; // 키보드 커서: 내 쪽 e폰
  closeDialog($('promo'));
  closeDialog($('endOverlay'));
  refresh();
  maybeAI();
}

// 결과 화면 종류: AI 전은 사람 기준 승/패, 2인 대전은 누가 이기든 win, 비기면 draw
function outcome() {
  if (!over) return '';
  if (over.title !== 'checkmate') return 'draw';
  const winner = over.text === 'winW' ? 'w' : 'b';
  const ai = aiColor();
  return ai && winner === ai ? 'lose' : 'win';
}

function refresh() {
  const s = cur();
  legal = legalMoves(s);
  const wasOver = !!over;
  over = null;
  if (legal.length === 0) {
    // over 에는 번역 키를 저장 → 언어를 바꾸면 결과 문구도 바로 바뀜
    over = inCheck(s, s.turn)
      ? { title: 'checkmate', text: s.turn === 'w' ? 'winB' : 'winW' }
      : { title: 'stalemate', text: 'draw' };
  } else if (s.half >= 100) {
    over = { title: 'draw', text: 'fifty' };
  } else if (keys.filter(k => k === keys[keys.length - 1]).length >= 3) {
    over = { title: 'draw', text: 'repetition' };
  } else if (insufficient(s.board)) {
    over = { title: 'draw', text: 'material' };
  }
  render();
  if (over) {
    const oc = outcome();
    $('endOverlay').dataset.outcome = oc;
    if (!wasOver) Sfx.play(oc);
    openDialog($('endOverlay'));
  }
}

// 플레이어 패널: #plTop 은 늘 흑, #plBottom 은 늘 백. 뒤집으면 .app.flipped 로 자리만 바뀜
const ROBOT_AVATAR = 2; // PX_AVATARS 의 로봇
function syncPlayers() {
  const s = cur();
  const ai = aiColor();
  const prof = loadProfile();
  for (const [col, key] of [['w', 'plBottom'], ['b', 'plTop']]) {
    let name, av, avColor;
    if (!ai) {
      // 2인 대전: 백 = 1P(내 프로필 아바타), 흑 = 2P(기본 아바타)
      name = col === 'w' ? '1P' : '2P';
      av = col === 'w' ? prof.avatar : 0;
      avColor = col === 'w' ? prof.color : 'blue';
    } else if (col === ai) {
      name = t('ai') + ' · ' + t('lv' + level);
      av = ROBOT_AVATAR;
      avColor = 'cyan';
    } else {
      name = prof.name || t('player');
      av = prof.avatar;
      avColor = prof.color;
    }
    $(key + 'Name').textContent = name;
    renderAvatar($(key + 'Avatar'), av, avColor);
    $(key).classList.toggle('active', !over && s.turn === col);
  }
  app.classList.toggle('flipped', !!flipped);
}

function render() {
  const s = cur();
  const last = moves.length ? moves[moves.length - 1].m : null;
  const checkSq = inCheck(s, s.turn) ? s.board.indexOf(s.turn + 'K') : -1;
  const targets = selected != null ? legal.filter(m => m.from === selected) : [];
  // 방금 둔 칸 연출은 둔 직후 한 번만(이후 다시 그릴 때는 붙이지 않음)
  const jm = Date.now() - justMovedAt < 400 ? justMoved : -1;
  // 다시 그리면 칸 요소가 바뀌므로, 판에 포커스가 있었다면 그린 뒤 같은 칸으로 되돌림
  const hadFocus = boardEl.contains(document.activeElement);
  const frag = document.createDocumentFragment();
  let rank = null;
  for (let di = 0; di < 64; di++) {
    const i = flipped ? 63 - di : di;
    const r = i >> 3, c = i & 7;
    if (di % 8 === 0) {
      rank = document.createElement('div');
      rank.className = 'rank';
      rank.setAttribute('role', 'row');
      frag.appendChild(rank);
    }
    const el = document.createElement('div');
    el.className = 'sq ' + ((r + c) % 2 ? 'd' : 'l');
    el.dataset.sq = i;
    el.setAttribute('role', 'gridcell');
    el.tabIndex = i === focusSq ? 0 : -1; // 로빙 tabindex: 판 전체에서 한 칸만 Tab 으로 들어옴
    el.setAttribute('aria-selected', selected === i ? 'true' : 'false');
    if (last && (last.from === i || last.to === i)) el.classList.add('last');
    if (jm === i) el.classList.add('just-moved');
    if (selected === i) el.classList.add('sel');
    if (checkSq === i) el.classList.add('check');
    const tm = targets.find(m => m.to === i);
    if (tm) { el.classList.add('target'); if (tm.captured) el.classList.add('cap'); }
    const p = s.board[i];
    el.setAttribute('aria-label', sqLabel(i, p, !!tm));
    if (p) el.appendChild(pieceEl(p));
    if (di % 8 === 0) {
      const lab = document.createElement('span');
      lab.className = 'coord r';
      lab.textContent = 8 - r;
      lab.setAttribute('aria-hidden', 'true');
      el.appendChild(lab);
    }
    if (di >= 56) {
      const lab = document.createElement('span');
      lab.className = 'coord f';
      lab.textContent = FILES[c];
      lab.setAttribute('aria-hidden', 'true');
      el.appendChild(lab);
    }
    el.addEventListener('click', () => {
      if (menuOpen()) return;
      focusSq = i;
      updateRoving();
      onSquare(i);
    });
    rank.appendChild(el);
  }
  boardEl.replaceChildren(frag);
  if (hadFocus) focusSquare();

  // status
  $('turnDot').className = 'turn-dot ' + s.turn;
  if (over) {
    $('status').textContent = t(over.title) + ' ' + t(over.text);
    $('statusSub').textContent = t('restart');
    $('endTitle').textContent = t(over.title);
    $('endText').textContent = t(over.text);
  } else {
    $('status').textContent = t(s.turn === 'w' ? 'turnW' : 'turnB') + (checkSq >= 0 ? t('check') : '');
    $('statusSub').textContent = thinking ? t('thinking') : (aiColor() && s.turn !== aiColor() ? t('yourTurn') : '');
  }

  // captured (플레이어 패널: 백이 잡은 기물은 백 쪽, 흑이 잡은 기물은 흑 쪽)
  const capBy = { w: [], b: [] };
  for (const { m } of moves) if (m.captured) capBy[m.piece[0]].push(m.captured[1]);
  const order = 'QRBNP';
  const pcs = arr => arr.slice().sort((a, b) => order.indexOf(a) - order.indexOf(b)).map(t => GLYPH[t]).join('');
  let mat = 0;
  for (const p of s.board) if (p && p[1] !== 'K') mat += (p[0] === 'w' ? 1 : -1) * VAL[p[1]];
  const diff = Math.round(mat / 100);
  $('capW').textContent = pcs(capBy.w);
  $('capB').textContent = pcs(capBy.b);
  $('advW').textContent = diff > 0 ? '+' + diff : '';
  $('advB').textContent = diff < 0 ? '+' + (-diff) : '';
  syncPlayers();

  // move list
  const ml = $('moves');
  ml.replaceChildren();
  if (!moves.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.style.gridColumn = '1 / -1';
    e.textContent = t('noMoves');
    ml.appendChild(e);
  }
  for (let i = 0; i < moves.length; i += 2) {
    const n = document.createElement('div');
    n.className = 'n';
    n.textContent = (i / 2 + 1) + '.';
    ml.appendChild(n);
    for (let j = i; j < i + 2; j++) {
      const d = document.createElement('div');
      d.className = 'm' + (j === moves.length - 1 ? ' cur' : '');
      d.textContent = moves[j] ? moves[j].san : '';
      ml.appendChild(d);
    }
  }
  ml.scrollTop = ml.scrollHeight;

  $('undoBtn').disabled = thinking || moves.length === 0;
  syncSeg();
}

function humanTurn() {
  return !over && !thinking && cur().turn !== aiColor();
}

function onSquare(i) {
  // 메뉴·시트가 열려 있으면 판 입력은 무시
  if (root.dataset.menu || !humanTurn() || pendingPromo) return;
  const s = cur();
  const p = s.board[i];
  if (selected != null) {
    const cands = legal.filter(m => m.from === selected && m.to === i);
    if (cands.length) {
      if (cands[0].promo) showPromo(cands);
      else play(cands[0]);
      return;
    }
  }
  const pick = !!(p && p[0] === s.turn && selected !== i);
  if (pick) Sfx.play('ui-move');
  else if (selected != null && selected !== i) Sfx.play('illegal'); // 갈 수 없는 칸
  else if (selected === i) Sfx.play('ui-back');                      // 같은 기물 다시 누름 → 선택 해제
  selected = pick ? i : null;
  render();
}

// 칸의 스크린리더 이름: "e4", "e4 백 폰", 이동 가능한 칸이면 ", 이동 가능"
function sqLabel(i, p, isTarget) {
  let s = sqName(i);
  if (p) s += ' ' + t(p[0] === 'w' ? 'white' : 'black') + ' ' + t('p' + p[1]);
  if (isTarget) s += ', ' + t('canMove');
  return s;
}
function sqEl(i) { return boardEl.querySelector('[data-sq="' + i + '"]'); }
function focusSquare() {
  const el = sqEl(focusSq);
  if (el) el.focus({ preventScroll: true });
}
function updateRoving() {
  for (const el of boardEl.querySelectorAll('.sq')) el.tabIndex = +el.dataset.sq === focusSq ? 0 : -1;
}

// 키보드: 방향키는 화면 기준(판을 뒤집어도 ↑ 는 항상 화면 위쪽), Enter/Space 는 클릭과 같음
const ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
boardEl.addEventListener('keydown', e => {
  if (root.dataset.menu) return;
  const d = ARROWS[e.key];
  if (d) {
    e.preventDefault();
    const di = flipped ? 63 - focusSq : focusSq;
    const r = Math.min(7, Math.max(0, (di >> 3) + d[0]));
    const c = Math.min(7, Math.max(0, (di & 7) + d[1]));
    const ni = r * 8 + c;
    focusSq = flipped ? 63 - ni : ni;
    updateRoving();
    focusSquare();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (!e.repeat) onSquare(focusSq);
  } else if (e.key === ' ') {
    e.preventDefault(); // 스크롤 방지. 실행은 keyup 에서
  }
});
// Space 는 keyup 에서 처리: keydown 에서 대화상자를 열면 이어지는 keyup 이 그 안의 첫 버튼을 눌러버림
boardEl.addEventListener('keyup', e => {
  if (e.key === ' ') { e.preventDefault(); onSquare(focusSq); }
});

// ----- 대화상자(승진·결과): 열 때 첫 버튼으로 포커스, 닫을 때 원래 자리로 -----
let returnFocus = null;
function openDialog(ov) {
  if (ov.classList.contains('show')) return;
  const a = document.activeElement;
  // 판 칸은 다시 그리면 요소가 바뀌므로 'board' 로 기억했다가 focusSq 칸으로 돌아감
  returnFocus = boardEl.contains(a) ? 'board' : a;
  ov.classList.add('show');
  const first = ov.querySelector('button');
  if (first) first.focus();
}
function closeDialog(ov) {
  if (!ov.classList.contains('show')) return;
  const hadFocus = ov.contains(document.activeElement);
  ov.classList.remove('show');
  if (hadFocus) {
    if (returnFocus === 'board') focusSquare();
    else if (returnFocus && returnFocus !== document.body && returnFocus.isConnected) returnFocus.focus();
  }
  returnFocus = null;
}
function openOverlay() {
  if ($('promo').classList.contains('show')) return $('promo');
  if ($('endOverlay').classList.contains('show')) return $('endOverlay');
  return null;
}
function showPromo(cands) {
  pendingPromo = cands;
  const row = $('promoRow');
  row.replaceChildren();
  const col = cur().turn;
  for (const pc of ['Q', 'R', 'B', 'N']) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.p = pc;
    btn.appendChild(pieceEl(col + pc));
    btn.addEventListener('click', () => {
      const m = pendingPromo.find(x => x.promo === pc);
      pendingPromo = null;
      closeDialog($('promo'));
      play(m);
    });
    row.appendChild(btn);
  }
  labelPromo();
  Sfx.play('ui-ok');
  openDialog($('promo'));
}
function labelPromo() {
  for (const btn of $('promoRow').children) {
    const name = t('p' + btn.dataset.p);
    btn.title = name;
    btn.setAttribute('aria-label', name);
  }
}
// 승진 취소: 이동하지 않고 선택도 해제
function cancelPromo() {
  if (!pendingPromo) return;
  pendingPromo = null;
  selected = null;
  closeDialog($('promo'));
  Sfx.play('ui-back');
  render();
}

// ----- 토스트("체크!"): 판 위에 잠깐. 애니메이션이 꺼져 있어도 약 1.2초 뒤 JS 가 지움 -----
let toastTimer = 0;
function showToast(text) {
  const el = $('gxToast');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth; // 다시 붙여 애니메이션을 처음부터
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1250);
}

function play(m) {
  const s = cur();
  const san = toSAN(s, m, legal);
  const ns = makeMove(s, m);
  states.push(ns);
  moves.push({ m, san });
  keys.push(posKey(ns));
  selected = null;
  justMoved = m.to;
  justMovedAt = Date.now();
  refresh();
  // 끝났으면 결과 소리(refresh)만. 아니면 체크 > 승진 > 캐슬링 > 잡기 > 이동
  if (!over) {
    if (inCheck(ns, ns.turn)) {
      Sfx.play('check');
      showToast(t('checkToast'));
    } else {
      Sfx.play(m.promo ? 'promote' : (m.flag === 'castleK' || m.flag === 'castleQ') ? 'castle' : m.captured ? 'capture' : 'move');
    }
  }
  maybeAI();
}

function maybeAI() {
  if (!started || over || cur().turn !== aiColor()) return;
  thinking = true;
  render();
  const myGen = gen;
  setTimeout(() => {
    if (myGen !== gen) return;
    if (menuOpen()) { aiWaiting = myGen; return; } // 메뉴 중에는 두지 않고 닫을 때 이어서
    const m = bestMove(cur(), level);
    if (myGen !== gen) return;
    thinking = false;
    if (m) play(m);
  }, 300);
}

function undo() {
  if (thinking || !moves.length) return;
  gen++;
  const pop = () => { states.pop(); moves.pop(); keys.pop(); };
  pop();
  if (aiColor() && cur().turn === aiColor() && moves.length) pop();
  selected = null;
  pendingPromo = null;
  justMoved = -1;
  closeDialog($('promo'));
  closeDialog($('endOverlay'));
  Sfx.play('ui-back');
  refresh();
  maybeAI();
}

$('endNew').addEventListener('click', () => { Sfx.play('start'); newGame(); });
$('endClose').addEventListener('click', () => { Sfx.play('ui-back'); closeDialog($('endOverlay')); });
$('endExit').addEventListener('click', leaveGame);
$('promoCancel').addEventListener('click', cancelPromo);
$('undoBtn').addEventListener('click', undo);
$('flipBtn').addEventListener('click', () => { flipped = !flipped; Sfx.play('ui-move'); render(); });
// 난이도는 게임 도중에도 바로 바뀜 (다음 AI 수부터 적용)
$('levelSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  level = +b.dataset.v;
  saveSettings();
  Sfx.play('ui-move');
  render();
});
// 대전 방식은 준비 시트에서 고르기만 하고, "대국 시작"을 누르면 새 게임으로 적용
$('modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  pendMode = b.dataset.v;
  Sfx.play('ui-move');
  syncSeg();
});

// ===== 메뉴·시트: html[data-menu] = 'pause'|'settings'|'help'|'setup' (#gxMenu, 공유 GxMenu) | 'moves'(기보 시트) =====
const Menu = GxMenu($('gxMenu'), {
  button: $('menuBtn'),
  fallbackFocus: () => sqEl(focusSq),
  focusFor: name => (name === 'setup' ? $('setupStart') : null),
  onShow(name) {
    $('exitConfirm').hidden = true;
    $('menuList').hidden = false;
    if (name === 'setup') pendMode = mode; // 준비 시트는 지금 대전 방식에서 시작
    syncSeg();
  },
  onEscape() {
    if ($('exitConfirm').hidden) return false;
    hideExitConfirm();
    return true;
  },
  onClose() {
    // 메뉴 때문에 미뤄 둔 AI 차례를 이어서
    if (aiWaiting === gen) { aiWaiting = -1; maybeAI(); }
  },
});
const menuOpen = () => Menu.isOpen();
const movesOpen = () => root.dataset.menu === 'moves';
function rememberFocus() {
  const a = document.activeElement;
  return boardEl.contains(a) ? 'board' : a;
}
function restoreFocus(r) {
  if (r === 'board') focusSquare();
  else GxUI.focusSafe(r);
}
// 일시정지 메뉴 열기. 결과 화면이 떠 있으면 그쪽이 먼저, 승진 선택 중이면 승진을 취소하고 연다
function openPause() {
  if (Menu.isOpen() || $('endOverlay').classList.contains('show')) return;
  if (pendingPromo) cancelPromo();
  if (movesOpen()) closeMoves(false);
  Menu.open('pause', { returnTo: document.activeElement });
}
function showExitConfirm() {
  $('menuList').hidden = true;
  $('exitConfirm').hidden = false;
  GxUI.focusSafe($('exitNo'));
  Sfx.play('ui-move');
}
function hideExitConfirm() {
  $('exitConfirm').hidden = true;
  $('menuList').hidden = false;
  GxUI.focusSafe($('menuExit'));
  Sfx.play('ui-back');
}
// 진행 중(한 수라도 두었고 끝나지 않음)이면 나가기 전에 한 번 더 묻는다
function inProgress() { return started && moves.length > 0 && !over; }
function leaveGame() {
  Sfx.play('ui-ok');
  GxUI.leave('index.html#select');
}
// 준비 시트의 "대국 시작": 고른 대전 방식을 적용하고 새 게임
function startMatch() {
  mode = pendMode;
  saveSettings();
  started = true;
  aiWaiting = -1;
  Menu.close({ restore: false, silent: true });
  newGame();
  Sfx.play('start');
  focusSquare();
}

$('menuBtn').addEventListener('click', openPause);
$('menuResume').addEventListener('click', () => Menu.close());
$('menuRestart').addEventListener('click', () => Menu.push('setup'));
$('menuSettings').addEventListener('click', () => Menu.push('settings'));
$('menuHelp').addEventListener('click', () => Menu.push('help'));
$('settingsSetup').addEventListener('click', () => Menu.push('setup'));
$('setupStart').addEventListener('click', startMatch);
// 준비 시트의 나가기: 대국 전 화면이므로 확인 없이 바로
$('setupExit').addEventListener('click', () => { Sfx.play('ui-ok'); GxUI.leave('index.html#select'); });
$('menuExit').addEventListener('click', () => {
  if (inProgress()) showExitConfirm();
  else leaveGame();
});
$('exitYes').addEventListener('click', leaveGame);
$('exitNo').addEventListener('click', hideExitConfirm);
// 마우스를 올리면 그 항목으로 커서 ▶ 이동
$('menuList').addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const b = e.target.closest('.gx-btn');
  if (b && b !== document.activeElement) GxUI.focusSafe(b);
});

// ----- 기보 시트(좁은 화면): html[data-menu="moves"] → .side 가 가운데 시트로 -----
let movesReturn = null;
function openMoves() {
  if (Menu.isOpen()) return;
  movesReturn = rememberFocus();
  root.dataset.menu = 'moves';
  $('movesBtn').setAttribute('aria-expanded', 'true');
  Sfx.play('menu-open');
  const ml = $('moves');
  ml.scrollTop = ml.scrollHeight;
  GxUI.focusSafe($('movesBack'));
}
function closeMoves(restore = true) {
  if (!movesOpen()) return;
  root.dataset.menu = '';
  $('movesBtn').setAttribute('aria-expanded', 'false');
  Sfx.play('menu-close');
  const r = movesReturn;
  movesReturn = null;
  if (restore) restoreFocus(r);
}
$('movesBtn').addEventListener('click', () => { if (movesOpen()) closeMoves(); else openMoves(); });
$('movesBack').addEventListener('click', () => closeMoves());
// 넓은 화면으로 바뀌어 기보가 오른쪽 패널로 돌아가면(#movesBack 안 보임) 시트 상태도 닫음
function checkMovesSheet() {
  if (movesOpen() && !$('movesBack').getClientRects().length) closeMoves(false);
}
window.addEventListener('resize', checkMovesSheet);
// 기보 시트 바깥을 누르면 닫기. 그 누름이 판 클릭으로 이어지지 않게 다음 click 한 번은 삼킴
let swallowClick = false;
document.addEventListener('pointerdown', e => {
  swallowClick = false;
  if (!movesOpen() || !e.target.closest) return;
  if (e.target.closest('#side, #movesBtn')) return;
  closeMoves(false);
  swallowClick = true;
  setTimeout(() => { swallowClick = false; }, 600);
});
document.addEventListener('click', e => {
  if (!swallowClick) return;
  swallowClick = false;
  e.stopPropagation();
  e.preventDefault();
}, true);

// ----- 키보드 (우선순위: 승진 창 → 결과 화면 → 메뉴(GxMenu 가 Esc·Tab·↑↓ 처리) → 기보 시트 → 판) -----
const isTyping = el => !!(el && el.closest && el.closest('input, textarea, select, [contenteditable="true"]'));
document.addEventListener('keydown', e => {
  const ov = openOverlay();
  if (ov) {
    if (e.key === 'Escape') {
      e.preventDefault();
      if (ov.id === 'promo') cancelPromo();
      else { Sfx.play('ui-back'); closeDialog(ov); }
    } else if (e.key === 'Tab') {
      GxUI.trapTab(ov, e);
    }
    return;
  }
  if (Menu.isOpen()) {
    // 준비 시트: Enter = 대국 시작. 단 대전 방식·난이도 버튼([role=group] 안), 뒤로, 나가기 버튼에서는
    // 막지 않음 → 브라우저 기본 동작으로 그 버튼이 눌림
    const a = document.activeElement;
    if (e.key === 'Enter' && !e.repeat && !e.defaultPrevented && Menu.current() === 'setup' &&
        !(a && a.closest && (a.closest('[role="group"], [data-back]') || a.id === 'setupExit'))) {
      e.preventDefault();
      startMatch();
    }
    return;
  }
  if (e.defaultPrevented) return;
  if (movesOpen()) {
    if (e.key === 'Escape') { e.preventDefault(); closeMoves(); }
    else if (e.key === 'Tab') GxUI.trapTab($('side'), e);
    return;
  }
  if (e.isComposing || e.ctrlKey || e.metaKey || e.altKey || isTyping(e.target)) return;
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (e.repeat) return;
    e.preventDefault();
    openPause();
  }
});

// ----- 설정: 소리 / 꾸미기 (화면 테마 스와치는 공유 UI 테마 블록이 연결) -----
$('soundBtn').addEventListener('click', () => Sfx.toggle());
$('soundToggle').addEventListener('click', () => Sfx.toggle());
$('skinPieces').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (!b || !SKIN_PIECES.includes(b.dataset.v)) return;
  skin.pieces = b.dataset.v;
  saveSkin();
  applySkin();
  Sfx.play('ui-move');
  render();
  if (pendingPromo) showPromoPieces();
});
$('skinBoard').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (!b || !SKIN_BOARDS.includes(b.dataset.v)) return;
  skin.board = b.dataset.v;
  saveSkin();
  applySkin();
  Sfx.play('ui-move');
});
// 승진 창이 열린 채 말 세트를 바꾸면 창 안 그림도 바꿈
function showPromoPieces() {
  const col = cur().turn;
  for (const btn of $('promoRow').children) btn.replaceChildren(pieceEl(col + btn.dataset.p));
}

// 화면 배치(모바일/PC): 상태는 html[data-layout], 저장은 사이트 공통 키 games-layout
function syncLayoutSeg() {
  document.querySelectorAll('#layoutSeg button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.v === document.documentElement.dataset.layout));
  });
}
document.getElementById('layoutSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  applyLayout(b.dataset.v);
  try { localStorage.setItem('games-layout', b.dataset.v); } catch (err) {}
  Sfx.play('ui-move');
  syncLayoutSeg();
});
// 다른 탭에서 바꾸면 따라감
window.addEventListener('storage', e => {
  if (e.key === 'games-layout' && (e.newValue === 'mobile' || e.newValue === 'pc')) {
    applyLayout(e.newValue);
    syncLayoutSeg();
    checkMovesSheet();
  } else if (e.key === 'chess-skin') {
    skin = readSkin(e.newValue);
    applySkin();
    render();
    if (pendingPromo) showPromoPieces();
  } else if (e.key === 'games-profile' || e.key === null) {
    syncPlayers();
  } else if (e.key === 'games-lang' && I18N[e.newValue] && e.newValue !== lang) {
    lang = e.newValue;
    applyLang();
    render();
  }
});
syncLayoutSeg();

// ----- 시작: 판은 초기 배치로 그려 두고, 준비 시트(뒤로 없음)를 연다 -----
applyLang();
applySkin();
newGame();
Menu.open('setup', { locked: true, returnTo: sqEl(focusSq) });
GxUI.enter();
</script>
</body>
</html>
