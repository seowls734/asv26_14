<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1">
<title>오목</title>
<script>/* 화면 배치(모바일/PC)를 첫 렌더 전에 정함 — 사이트 공통 키 games-layout
   PC 모드 + 기기 화면 폭 < 1024px 이면 viewport 를 width=1280 (데스크톱 사이트)으로 바꾸고,
   축소 배율을 --vp-zoom 으로 넘겨 화면 배치 버튼만 손가락 크기로 키운다.
   applyLayout(l) 는 본문 스크립트(화면 배치 버튼·storage 이벤트)에서도 그대로 다시 쓴다. */
window.applyLayout=function(l){var d=document.documentElement,w=0,vp=document.getElementById('vp');
d.dataset.layout=l;
try{w=screen.width}catch(e){}
if(l==='pc'&&w&&w<1024){vp.setAttribute('content','width=1280');d.style.setProperty('--vp-zoom',String(Math.min(1280/w,3)))}
else{vp.setAttribute('content','width=device-width, initial-scale=1');d.style.removeProperty('--vp-zoom')}
};
(function(){var l;
try{l=localStorage.getItem('games-layout')}catch(e){}
if(l!=='mobile'&&l!=='pc'){try{l=(matchMedia('(max-width: 820px)').matches||(matchMedia('(pointer: coarse)').matches&&Math.min(screen.width,screen.height)<=820))?'mobile':'pc'}catch(e){l='pc'}}
applyLayout(l);
})();
// ===== [공유] UI 테마 head 시작 =====
// 첫 렌더 전에 html[data-ui] 적용(깜빡임 방지). 사이트 공통 키 games-ui-theme = classic|gameboy|neon|famicom
(function(){var v;try{v=localStorage.getItem('games-ui-theme')}catch(e){}
document.documentElement.setAttribute('data-ui',(v==='gameboy'||v==='neon'||v==='famicom')?v:'classic');
})();
// ===== [공유] UI 테마 head 끝 =====
// 페이지 진입 와이프(html.gx-enter) — 본문 스크립트의 GxUI.enter() 가 300ms 뒤에 걷음
document.documentElement.classList.add('gx-enter');
</script>
<style>
  /* ===== 색 토큰 (라이트) — 다크는 아래 2곳에 같은 값 ===== */
  :root {
    --bg: #f4f1ea;
    --panel: #fffdf8;
    --text: #2b2620;
    --muted: #7a7064;
    --border: #e2dacb;
    --wood: #dcb35c;
    --wood-line: #5a4220;
    --accent: #8b5e34;
    --accent-text: #fff;
    --btn: #f0e9dc;
    --btn-hover: #e6dcc9;
    --stone-b-hi: #6b6b6b;      /* 흑돌 그라데이션 밝은 쪽 */
    --stone-b-lo: #0d0d0d;      /* 흑돌 그라데이션 어두운 쪽 */
    --stone-w-hi: #ffffff;
    --stone-w-lo: #cfcac0;
    --stone-b-edge: #000;
    --stone-w-edge: #9c968b;
    --dot-w: #fffaf0;           /* 차례 표시 점 */
    --dot-b: #1d1a17;
    --mark: #e03a3a;            /* 마지막 수, 승리선, 키보드 커서 */
    --overlay: rgba(0, 0, 0, .4);
    --shadow: rgba(0, 0, 0, .18);
    --shadow-strong: rgba(0, 0, 0, .3);
    --focus: #1d1a17;
    --focus-halo: #fffaf0;
    /* 허브(index.html)와 같은 값 */
    --primary: #b93a0a; --primary-hi: #c94a10; --primary-lo: #7a2606; --primary-text: #fff;
    --btn-hi: #fffaf0; --btn-edge: #c9b99c;
    --panel-hi: #ffffff; --frame: #d8c9ad; --frame-hi: rgba(255, 255, 255, .8);
    --scrim: rgba(0, 0, 0, .45);
    --pattern: rgba(139, 94, 52, .09); --vignette: rgba(90, 60, 30, .10);
    --glow: rgba(217, 83, 26, .35);
    --title-from: #d9531a; --title-to: #8b5e34; --title-edge: #5e3d1f;
    --gold: #b86e00; --gold-hi: #f2b632; --gold-lo: #7a4100; --ray: rgba(242, 182, 50, .30);
    /* 픽셀 공통 토큰 */
    --px: 4px;
    --ink: #1b1622;
    --hud-bg: #2b2238; --hud-text: #f4ead2; --hud-muted: #b9ab90; --hud-edge: #0f0b14;
    --win: #2f8f3c; --lose: #c8323c; --draw: #6e6452;
    --scanline: rgba(0, 0, 0, .05);
    /* K1 프로필 아바타 색 · K4 오목판 테마(wood = 기존 --wood) · K2 UI 테마 스와치 미리보기 */
    --av-red: #e04848; --av-orange: #f08c2a; --av-yellow: #e8c020; --av-green: #3fae4a;
    --av-cyan: #2bb8c8; --av-blue: #3a6ee8; --av-purple: #8a52e0; --av-pink: #e85aa8; --av-white: #ffffff;
    --gb-bamboo: #d8c47a; --gb-bamboo-line: #5a5020; --gb-slate: #5a6470; --gb-slate-line: #c8d0d8;
    --gb-retro: #9bbc0f; --gb-retro-line: #0f380f;
    --sw-classic-a: #2b2238; --sw-classic-b: #b93a0a; --sw-gameboy-a: #0f380f; --sw-gameboy-b: #8bac0f;
    --sw-neon-a: #1a0b2e; --sw-neon-b: #00e5ff; --sw-famicom-a: #3a3a3a; --sw-famicom-b: #b21f2d;

    /* 색이 아닌 공통 값 (테마별로 바꿀 필요 없음: var 는 :root 에서 테마 값으로 풀림) */
    --pxbox: 0 calc(-1 * var(--px)) 0 0 var(--ink), 0 var(--px) 0 0 var(--ink),
             calc(-1 * var(--px)) 0 0 0 var(--ink), var(--px) 0 0 0 var(--ink);
    --pxdrop: 0 calc(2 * var(--px)) 0 0 var(--ink);
    --px-round: polygon(25% 0, 75% 0, 75% 12.5%, 87.5% 12.5%, 87.5% 25%, 100% 25%, 100% 75%, 87.5% 75%,
                87.5% 87.5%, 75% 87.5%, 75% 100%, 25% 100%, 25% 87.5%, 12.5% 87.5%, 12.5% 75%, 0 75%,
                0 25%, 12.5% 25%, 12.5% 12.5%, 25% 12.5%);
    --mono: ui-monospace, "Cascadia Mono", Consolas, "D2Coding", monospace;
    --z: 1;   /* 폰에서 PC 배치일 때만 손가락 크기 배율 */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17; --panel: #26231f; --text: #ece6dc; --muted: #a59c90; --border: #3a352e;
      --wood: #c99d4a; --wood-line: #4a3518; --accent: #c48a52; --accent-text: #1c1a17;
      --btn: #332f29; --btn-hover: #3e3932;
      --overlay: rgba(0, 0, 0, .55); --shadow: rgba(0, 0, 0, .4); --shadow-strong: rgba(0, 0, 0, .5);
      --focus: #fffaf0; --focus-halo: #1d1a17;
      --primary: #ff8a3d; --primary-hi: #ffa766; --primary-lo: #a8460f; --primary-text: #1c1a17;
      --btn-hi: #3d3831; --btn-edge: #15130f;
      --panel-hi: #2d2924; --frame: #4a4339; --frame-hi: rgba(255, 255, 255, .07);
      --scrim: rgba(0, 0, 0, .6);
      --pattern: rgba(255, 235, 205, .045); --vignette: rgba(0, 0, 0, .35);
      --glow: rgba(255, 138, 61, .35);
      --title-from: #ffd27a; --title-to: #ff8a3d; --title-edge: #5a2a0a;
      --gold: #ffc94d; --gold-hi: #ffe08a; --gold-lo: #e09a1a; --ray: rgba(255, 201, 77, .16);
      --ink: #0b0910;
      --hud-bg: #17121f; --hud-text: #f4ead2; --hud-muted: #a89c86; --hud-edge: #000000;
      --win: #5fd46d; --lose: #ff5a64; --draw: #b8ad96;
      --scanline: rgba(0, 0, 0, .18);
      --av-red: #e04848; --av-orange: #f08c2a; --av-yellow: #e8c020; --av-green: #3fae4a;
      --av-cyan: #2bb8c8; --av-blue: #3a6ee8; --av-purple: #8a52e0; --av-pink: #e85aa8; --av-white: #ffffff;
      --gb-bamboo: #d8c47a; --gb-bamboo-line: #5a5020; --gb-slate: #5a6470; --gb-slate-line: #c8d0d8;
      --gb-retro: #9bbc0f; --gb-retro-line: #0f380f;
      --sw-classic-a: #2b2238; --sw-classic-b: #b93a0a; --sw-gameboy-a: #0f380f; --sw-gameboy-b: #8bac0f;
      --sw-neon-a: #1a0b2e; --sw-neon-b: #00e5ff; --sw-famicom-a: #3a3a3a; --sw-famicom-b: #b21f2d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17; --panel: #26231f; --text: #ece6dc; --muted: #a59c90; --border: #3a352e;
    --wood: #c99d4a; --wood-line: #4a3518; --accent: #c48a52; --accent-text: #1c1a17;
    --btn: #332f29; --btn-hover: #3e3932;
    --overlay: rgba(0, 0, 0, .55); --shadow: rgba(0, 0, 0, .4); --shadow-strong: rgba(0, 0, 0, .5);
    --focus: #fffaf0; --focus-halo: #1d1a17;
    --primary: #ff8a3d; --primary-hi: #ffa766; --primary-lo: #a8460f; --primary-text: #1c1a17;
    --btn-hi: #3d3831; --btn-edge: #15130f;
    --panel-hi: #2d2924; --frame: #4a4339; --frame-hi: rgba(255, 255, 255, .07);
    --scrim: rgba(0, 0, 0, .6);
    --pattern: rgba(255, 235, 205, .045); --vignette: rgba(0, 0, 0, .35);
    --glow: rgba(255, 138, 61, .35);
    --title-from: #ffd27a; --title-to: #ff8a3d; --title-edge: #5a2a0a;
    --gold: #ffc94d; --gold-hi: #ffe08a; --gold-lo: #e09a1a; --ray: rgba(255, 201, 77, .16);
    --ink: #0b0910;
    --hud-bg: #17121f; --hud-text: #f4ead2; --hud-muted: #a89c86; --hud-edge: #000000;
    --win: #5fd46d; --lose: #ff5a64; --draw: #b8ad96;
    --scanline: rgba(0, 0, 0, .18);
    --av-red: #e04848; --av-orange: #f08c2a; --av-yellow: #e8c020; --av-green: #3fae4a;
    --av-cyan: #2bb8c8; --av-blue: #3a6ee8; --av-purple: #8a52e0; --av-pink: #e85aa8; --av-white: #ffffff;
    --gb-bamboo: #d8c47a; --gb-bamboo-line: #5a5020; --gb-slate: #5a6470; --gb-slate-line: #c8d0d8;
    --gb-retro: #9bbc0f; --gb-retro-line: #0f380f;
    --sw-classic-a: #2b2238; --sw-classic-b: #b93a0a; --sw-gameboy-a: #0f380f; --sw-gameboy-b: #8bac0f;
    --sw-neon-a: #1a0b2e; --sw-neon-b: #00e5ff; --sw-famicom-a: #3a3a3a; --sw-famicom-b: #b21f2d;
  }

  /* ===== UI 테마 팔레트 (K2): html[data-ui] 가 UI 토큰만 덮어씀. classic = 위 기본값 =====
     라이트 블록은 기본 다크 블록 뒤에 둠(같은 우선순위 → 나중 것이 이김) → 다크에서도 먼저 적용되고,
     다크에서 바뀌는 값만 아래 다크 2곳(우선순위 더 높음)이 다시 덮어씀. */
  :root[data-ui="gameboy"] {
    --primary: #306230; --primary-hi: #4a7f3a; --primary-lo: #0f380f; --primary-text: #e0f8d0;
    --hud-bg: #0f380f; --hud-text: #e0f8d0; --hud-muted: #9bbc0f; --hud-edge: #071c07;
    --frame: #8bac0f; --glow: rgba(139, 172, 15, .45);
    --title-from: #9bbc0f; --title-to: #306230; --title-edge: #0f380f;
  }
  :root[data-ui="neon"] {
    --primary: #7b2ff7; --primary-hi: #9a5cff; --primary-lo: #4a10a8; --primary-text: #ffffff;
    --hud-bg: #1a0b2e; --hud-text: #f0e6ff; --hud-muted: #c3a6ff; --hud-edge: #0a0414;
    --frame: #c3a6ff; --glow: rgba(0, 229, 255, .40);
    --title-from: #00b8d4; --title-to: #7b2ff7; --title-edge: #2a0a5e;
  }
  :root[data-ui="famicom"] {
    --primary: #b21f2d; --primary-hi: #d23a46; --primary-lo: #6e0f18; --primary-text: #ffffff;
    --hud-bg: #3a3a3a; --hud-text: #f2ead8; --hud-muted: #c8bea8; --hud-edge: #1a1a1a;
    --frame: #c8bea8; --glow: rgba(178, 31, 45, .35);
    --title-from: #d23a46; --title-to: #8a1420; --title-edge: #3a0a0f;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-ui="gameboy"]:not([data-theme="light"]) {
      --primary: #8bac0f; --primary-hi: #9bbc0f; --primary-lo: #306230; --primary-text: #0f380f;
      --title-from: #e0f8d0; --title-to: #9bbc0f;
    }
    :root[data-ui="neon"]:not([data-theme="light"]) {
      --primary: #00e5ff; --primary-hi: #6ff6ff; --primary-lo: #008ba3; --primary-text: #0a0414;
      --hud-bg: #12061f; --frame: #4a2a7a; --title-from: #6ff6ff; --title-to: #ff4fd8;
    }
    :root[data-ui="famicom"]:not([data-theme="light"]) {
      --primary: #ff5a66; --primary-hi: #ff8a92; --primary-lo: #a8202c; --primary-text: #1a1a1a;
      --hud-bg: #222222; --frame: #4a4440; --title-from: #ffd27a; --title-to: #ff5a66;
    }
  }
  :root[data-ui="gameboy"][data-theme="dark"] {
    --primary: #8bac0f; --primary-hi: #9bbc0f; --primary-lo: #306230; --primary-text: #0f380f;
    --title-from: #e0f8d0; --title-to: #9bbc0f;
  }
  :root[data-ui="neon"][data-theme="dark"] {
    --primary: #00e5ff; --primary-hi: #6ff6ff; --primary-lo: #008ba3; --primary-text: #0a0414;
    --hud-bg: #12061f; --frame: #4a2a7a; --title-from: #6ff6ff; --title-to: #ff4fd8;
  }
  :root[data-ui="famicom"][data-theme="dark"] {
    --primary: #ff5a66; --primary-hi: #ff8a92; --primary-lo: #a8202c; --primary-text: #1a1a1a;
    --hud-bg: #222222; --frame: #4a4440; --title-from: #ffd27a; --title-to: #ff5a66;
  }
  /* 폰에서 PC 배치(viewport 1280 축소) → 버튼·글자를 손가락 크기로 */
  :root[data-layout="pc"] { --z: min(var(--vp-zoom, 1), 2.8); }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--pattern) 0 1.5px, transparent 1.5px);
    background-size: 16px 16px;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    touch-action: manipulation;
    /* 좁은 폭 규칙은 @container 로 body 폭 기준 적용 → 모바일 모드에서 body 를 480px 로 줄이면 같은 규칙이 적용됨 */
    container-type: inline-size;
    position: relative;
  }
  /* 얇은 스캔라인 (가독성 해치지 않게 약하게) */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 90;
    background: repeating-linear-gradient(0deg, var(--scanline) 0 1px, transparent 1px 3px);
  }
  /* 화면 배치: 모바일 모드는 화면 폭과 관계없이 폭 480px 세로 배치, 가운데 정렬 */
  :root[data-layout="mobile"] body { max-width: 480px; margin: 0 auto; }

  /* 화면에는 안 보이고 스크린리더만 읽는 안내 영역 */
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap;
  }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ===== 한 화면 배치 (기본 = 1열: HUD / 위 패널 / 판 / 아래 패널 / 도크) ===== */
  .app {
    height: 100vh;
    margin: 0 auto;
    max-width: 760px;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto auto;
    grid-template-areas: "hud" "top" "board" "bottom" "dock";
    gap: 6px;
  }
  @supports (height: 100dvh) { .app { height: 100dvh; } }

  /* ===== 픽셀 버튼 ===== */
  .gx-btn {
    font: inherit; font-weight: 900; letter-spacing: .06em; line-height: 1.2;
    font-size: calc(15px * var(--z));
    min-height: calc(44px * var(--z)); padding: 8px 16px; margin: var(--px) var(--px) calc(2 * var(--px));
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 0; cursor: pointer; position: relative;
    color: var(--text); background: var(--btn);
    box-shadow: var(--pxbox), var(--pxdrop),
      inset 0 calc(-1 * var(--px)) 0 0 var(--btn-edge), inset 0 var(--px) 0 0 var(--btn-hi);
    -webkit-tap-highlight-color: transparent;
  }
  .gx-btn.primary {
    background: var(--primary); color: var(--primary-text);
    text-shadow: 2px 2px 0 var(--primary-lo);
    box-shadow: var(--pxbox), var(--pxdrop),
      inset 0 calc(-1 * var(--px)) 0 0 var(--primary-lo), inset 0 var(--px) 0 0 var(--primary-hi);
  }
  .gx-btn:active:not(:disabled) {
    transform: translateY(var(--px));
    box-shadow: var(--pxbox), 0 var(--px) 0 0 var(--ink), inset 0 var(--px) 0 0 var(--btn-edge);
  }
  .gx-btn.primary:active:not(:disabled) {
    box-shadow: var(--pxbox), 0 var(--px) 0 0 var(--ink), inset 0 var(--px) 0 0 var(--primary-lo);
  }
  .gx-btn:disabled { opacity: .5; cursor: default; }
  @media (hover: hover) {
    .gx-btn:hover:not(:disabled) { background: var(--btn-hover); }
    .gx-btn.primary:hover:not(:disabled) { background: var(--primary-hi); }
  }

  /* 44×44 아이콘 버튼 (HUD 위) */
  .gx-icon {
    width: calc(44px * var(--vp-zoom, 1)); height: calc(44px * var(--vp-zoom, 1));
    margin: var(--px); padding: 0; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-radius: 0; cursor: pointer;
    background: var(--hud-edge); color: var(--hud-text);
    box-shadow: inset 0 calc(-1 * var(--px)) 0 0 var(--ink), inset 0 var(--px) 0 0 var(--hud-bg);
    -webkit-tap-highlight-color: transparent;
  }
  :root[data-layout="mobile"] .gx-icon { width: 44px; height: 44px; }
  .gx-icon svg { width: 60%; height: 60%; fill: currentColor; }
  .gx-icon:active { transform: translateY(2px); }
  .gx-icon[aria-pressed="false"] { color: var(--hud-muted); }
  .gx-icon[aria-pressed="true"] .snd-off,
  .gx-icon[aria-pressed="false"] .snd-on { display: none; }

  /* 포커스 링 (픽셀 3px 실선) */
  .gx-btn:focus-visible, .gx-icon:focus-visible, .seg button:focus-visible, .gx-back:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 6px;
  }
  .gx-hud .gx-icon:focus-visible { outline-color: var(--hud-text); outline-offset: 2px; }
  .seg button:focus-visible { outline-offset: 2px; position: relative; z-index: 1; }
  :focus:not(:focus-visible) { outline: none; }

  /* 제목 글씨 */
  .gx-title {
    margin: 0; font-size: calc(22px * var(--z)); font-weight: 900; letter-spacing: .06em; line-height: 1.2;
    color: var(--title-from);
    text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 var(--title-edge);
  }

  /* ===== HUD: [메뉴] [상태] [수] [소리] ===== */
  .gx-hud {
    grid-area: hud; min-width: 0;
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 6px;
    margin: var(--px); padding: 0 4px;
    background: var(--hud-bg); color: var(--hud-text);
    box-shadow: var(--pxbox), inset 0 calc(-1 * var(--px)) 0 0 var(--hud-edge);
  }
  .hud-center { min-width: 0; padding: 4px 0; }
  .status {
    display: flex; align-items: center; gap: 8px; min-width: 0;
    font-size: calc(16px * var(--z)); line-height: 20px; font-weight: 900; letter-spacing: .06em;
    text-shadow: 2px 2px 0 var(--hud-edge);
  }
  #status { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status-sub {
    color: var(--hud-muted); font-size: calc(12px * var(--z)); line-height: 16px; min-height: 16px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 차례 점: 픽셀 원 */
  .turn-dot {
    width: calc(14px * var(--z)); height: calc(14px * var(--z)); flex: none;
    clip-path: var(--px-round); background: transparent;
    box-shadow: inset 0 0 0 2px var(--hud-muted);
  }
  .turn-dot.w { background: var(--dot-w); }
  .turn-dot.b { background: var(--dot-b); }
  /* 수 카운터 */
  .hud-count {
    display: flex; align-items: baseline; gap: 4px; padding: 0 4px;
    color: var(--hud-muted); font-weight: 900; letter-spacing: .06em; font-size: calc(12px * var(--z));
  }
  .hud-count b {
    color: var(--hud-text); font-size: calc(18px * var(--z)); min-width: 3ch; text-align: right;
    text-shadow: 2px 2px 0 var(--hud-edge);
  }

  /* ===== 플레이어 패널 ===== */
  .gx-player {
    grid-area: top; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    min-height: calc(36px * var(--z)); margin: var(--px); padding: 4px 12px 4px 28px; position: relative;
    background: var(--panel); color: var(--text);
    font-weight: 900; letter-spacing: .06em; font-size: calc(14px * var(--z));
    box-shadow: var(--pxbox), inset 0 calc(-1 * var(--px)) 0 0 var(--btn-edge);
  }
  #plBottom { grid-area: bottom; }
  .gx-cursor { position: absolute; left: 9px; top: 50%; translate: 0 -50%; font-size: 12px; visibility: hidden; }
  .gx-stone {
    width: calc(20px * var(--z)); height: calc(20px * var(--z)); flex: none; position: relative;
    clip-path: var(--px-round);
  }
  .gx-stone::after { content: ""; position: absolute; inset: 2px; clip-path: var(--px-round); }
  .gx-player[data-color="b"] .gx-stone { background: var(--stone-b-edge); }
  .gx-player[data-color="b"] .gx-stone::after {
    background: linear-gradient(135deg, var(--stone-b-hi) 0 30%, var(--stone-b-lo) 30% 100%);
  }
  .gx-player[data-color="w"] .gx-stone { background: var(--stone-w-edge); }
  .gx-player[data-color="w"] .gx-stone::after {
    background: linear-gradient(135deg, var(--stone-w-hi) 0 60%, var(--stone-w-lo) 60% 100%);
  }
  .gx-player-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gx-player-tag {
    margin-left: auto; flex: none; color: var(--muted); font-size: calc(12px * var(--z));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%;
  }
  .gx-player.active {
    background: var(--hud-bg); color: var(--hud-text);
    box-shadow: var(--pxbox), inset 0 calc(-1 * var(--px)) 0 0 var(--hud-edge);
  }
  .gx-player.active .gx-player-tag { color: var(--hud-muted); }
  .gx-player.active .gx-cursor { visibility: visible; color: var(--gold-hi); animation: gx-blink 1s steps(2, jump-none) infinite; }

  /* ===== 판 ===== */
  .board-wrap {
    grid-area: board; position: relative; min-width: 0; min-height: 0;
    container-type: size;
    display: grid; place-items: center;
  }
  svg.board {
    /* 칸 폭·높이 중 작은 쪽 − 픽셀 나무 테두리(사방 12px + 아래 그림자 4px) */
    --bw: max(120px, min(calc(100cqw - 32px), calc(100cqh - 32px), 640px));
    display: block;
    width: var(--bw);
    height: var(--bw);
    border-radius: 0;
    /* 픽셀 나무 프레임: 안쪽 테두리 + 계단 모서리 외곽선 + 딱딱한 그림자 */
    box-shadow:
      0 0 0 var(--px) var(--wood-line),
      0 0 0 calc(2 * var(--px)) var(--wood),
      0 calc(-1 * var(--px)) 0 calc(2 * var(--px)) var(--ink), 0 var(--px) 0 calc(2 * var(--px)) var(--ink),
      calc(-1 * var(--px)) 0 0 calc(2 * var(--px)) var(--ink), var(--px) 0 0 calc(2 * var(--px)) var(--ink),
      0 calc(2 * var(--px)) 0 calc(2 * var(--px)) var(--hud-edge);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  @supports not (width: 1cqh) {
    svg.board { --bw: max(120px, min(calc(100vw - 64px), calc(100vh - 290px), 640px)); }
  }
  svg.board:focus { outline: none; }
  svg.board:focus-visible { outline: 3px solid var(--focus); outline-offset: 14px; }
  /* 키보드 커서 테두리 (SVG 속성 대신 CSS 로 색·굵기 지정) */
  svg.board .kbd-cursor {
    fill: none; stroke: var(--mark); stroke-width: 3; stroke-dasharray: 6 4;
    animation: gx-dim 1s steps(2, jump-none) infinite;
  }
  /* 판 연출 훅 (JS 가 SVG 요소에 class 를 붙임) */
  svg.board .stone-new { transform-box: fill-box; transform-origin: center; animation: gx-stone .2s steps(3, end) both; }
  svg.board .last-mark { transform-box: fill-box; transform-origin: center; animation: gx-pulse 1.2s steps(2, jump-none) infinite; }
  svg.board .win-line {
    stroke-linecap: square; stroke-dasharray: 360; stroke-dashoffset: 0;
    animation: gx-draw .6s steps(10, end) both;
  }
  svg.board .win-stone { transform-box: fill-box; transform-origin: center; animation: gx-pulse .8s steps(2, jump-none) 3; }

  /* 보드 위 잠깐 문구 */
  .gx-toast {
    position: absolute; inset: 0; margin: auto; width: max-content; height: max-content; max-width: 90%;
    z-index: 3; pointer-events: none;
    padding: 10px 18px; background: var(--hud-bg); color: var(--hud-text);
    font-size: calc(26px * var(--z)); font-weight: 900; letter-spacing: .06em; white-space: nowrap;
    text-shadow: 2px 2px 0 var(--hud-edge), 4px 4px 0 var(--title-edge);
    box-shadow: var(--pxbox), var(--pxdrop);
  }
  .gx-toast:not(.show) { display: none; }
  .gx-toast.show { animation: gx-toast 1.2s steps(6, end) both; }

  /* ===== 하단 도크 ===== */
  .dock { grid-area: dock; display: flex; justify-content: center; gap: 8px; min-width: 0; }
  .dock .gx-btn { min-width: min(180px, 60%); }

  /* ===== 일시정지 메뉴 + 하위 화면 ===== */
  .gx-menu {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 16px;
    background: var(--scrim);
  }
  .gx-menu-box {
    width: min(100%, calc(420px * var(--z)));
    max-height: calc(100vh - 32px);
    overflow-y: auto; overscroll-behavior: contain;
    margin: var(--px); padding: 16px 16px 12px;
    background: var(--panel); color: var(--text);
    box-shadow: var(--pxbox), var(--pxdrop),
      inset 0 calc(-1 * var(--px)) 0 0 var(--btn-edge), inset 0 var(--px) 0 0 var(--panel-hi);
    animation: gx-pop .2s steps(4, end) both;
  }
  @supports (height: 100dvh) { .gx-menu-box { max-height: calc(100dvh - 32px); } }
  .gx-sheet { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .gx-sheet-head { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .gx-sheet-head .gx-title { min-width: 0; overflow-wrap: anywhere; }
  .gx-back {
    flex: none; width: calc(44px * var(--z)); min-height: calc(44px * var(--z)); padding: 0;
    font-size: calc(18px * var(--z));
  }
  .gx-menu-list { display: flex; flex-direction: column; gap: 4px; }
  .gx-menu-list .gx-btn {
    width: calc(100% - 2 * var(--px)); justify-content: flex-start; text-align: left;
    padding-left: calc(36px * var(--z)); font-size: calc(17px * var(--z)); min-height: calc(48px * var(--z));
  }
  /* 선택 커서 ▶ : aria-current 또는 키보드 포커스 */
  .gx-menu-list .gx-btn::before {
    content: "\25B6"; position: absolute; left: calc(12px * var(--z)); top: 50%; translate: 0 -50%;
    font-size: .7em; visibility: hidden;
  }
  .gx-menu-list .gx-btn[aria-current="true"],
  .gx-menu-list .gx-btn:focus-visible {
    background: var(--primary); color: var(--primary-text); text-shadow: 2px 2px 0 var(--primary-lo);
    box-shadow: var(--pxbox), var(--pxdrop),
      inset 0 calc(-1 * var(--px)) 0 0 var(--primary-lo), inset 0 var(--px) 0 0 var(--primary-hi);
  }
  .gx-menu-list .gx-btn[aria-current="true"]::before,
  .gx-menu-list .gx-btn:focus-visible::before { visibility: visible; animation: gx-nudge .6s steps(2, jump-none) infinite; }
  .gx-menu-list .gx-btn:focus-visible { outline-offset: 4px; }
  /* 나가기 2단계 확인 */
  .gx-confirm {
    display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; margin: var(--px);
    background: var(--btn); box-shadow: var(--pxbox);
  }
  .gx-confirm p { margin: 0; font-weight: 700; }
  .gx-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .gx-row .gx-btn { flex: 1 1 120px; }
  .gx-sheet-foot { display: flex; flex-direction: column; }
  .gx-sheet-foot .gx-btn { width: calc(100% - 2 * var(--px)); }

  /* 설정 한 줄: [라벨] [값] */
  .gx-opt {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px 12px;
    padding: 6px 0; border-bottom: 2px dashed var(--border);
  }
  .gx-opt:last-child { border-bottom: 0; }
  .gx-opt-label { font-weight: 900; letter-spacing: .06em; font-size: calc(15px * var(--z)); min-width: 0; overflow-wrap: anywhere; }
  .gx-toggle { min-width: calc(76px * var(--z)); }
  .gx-toggle[aria-pressed="true"] {
    background: var(--primary); color: var(--primary-text); text-shadow: 2px 2px 0 var(--primary-lo);
    box-shadow: var(--pxbox), var(--pxdrop),
      inset 0 calc(-1 * var(--px)) 0 0 var(--primary-lo), inset 0 var(--px) 0 0 var(--primary-hi);
  }
  .gx-toggle[aria-pressed="true"] .v-off,
  .gx-toggle:not([aria-pressed="true"]) .v-on { display: none; }
  .gx-cycle { min-width: calc(150px * var(--z)); justify-content: space-between; padding: 8px 10px; }
  .gx-cycle-arrow { font-size: .75em; color: var(--primary); }
  .gx-cycle-val { flex: 1; text-align: center; white-space: nowrap; }

  /* 세그먼트 (모드·난이도·화면 배치) */
  .field-label { font-size: calc(13px * var(--z)); font-weight: 900; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    gap: var(--px); padding: var(--px); margin: var(--px);
    background: var(--ink);
  }
  .seg button {
    font: inherit; font-size: calc(13px * var(--z)); font-weight: 700; line-height: 1.2;
    border: 0; border-radius: 0; background: var(--btn); color: var(--text);
    padding: 8px 4px; min-height: calc(44px * var(--z)); min-width: 0; cursor: pointer;
    white-space: normal; overflow-wrap: anywhere;
    box-shadow: inset 0 calc(-1 * var(--px)) 0 0 var(--btn-edge), inset 0 var(--px) 0 0 var(--btn-hi);
  }
  .seg button:active:not(:disabled) { box-shadow: inset 0 var(--px) 0 0 var(--btn-edge); }
  .seg button.on {
    background: var(--primary); color: var(--primary-text); font-weight: 900;
    box-shadow: inset 0 var(--px) 0 0 var(--primary-lo);
  }
  .seg button:disabled { opacity: .45; cursor: default; }
  .seg.disabled button.on { background: var(--btn-hover); color: var(--muted); box-shadow: inset 0 var(--px) 0 0 var(--btn-edge); }
  @media (hover: hover) { .seg button:hover:not(:disabled):not(.on) { background: var(--btn-hover); } }
  .seg.layout-seg { display: inline-grid; grid-auto-columns: auto; }
  .layout-seg button { min-width: calc(52px * var(--z)); padding: 4px 10px; white-space: nowrap; }
  /* 선택 표시는 html[data-layout] 기준 (JS 연결 전에도 맞게 보임) */
  :root[data-layout="mobile"] .layout-seg button[data-v="mobile"],
  :root[data-layout="pc"] .layout-seg button[data-v="pc"] {
    background: var(--primary); color: var(--primary-text); font-weight: 900;
    box-shadow: inset 0 var(--px) 0 0 var(--primary-lo);
  }
  .set-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .help-card { display: flex; flex-direction: column; gap: 8px; }
  .help-text { margin: 0; font-size: calc(14px * var(--z)); line-height: 1.5; }
  .help-text::before { content: "\25B6\00a0"; color: var(--primary); font-size: .75em; }

  /* ===== 프로필 아바타 (K1): JS 가 .gx-avatar 안에 8×8 SVG(rect.av-x / .av-o / .av-w)를 넣음. 비어 있으면 숨김 ===== */
  .gx-avatar {
    width: calc(32px * var(--z)); height: calc(32px * var(--z)); flex: none; padding: 2px;
    background: var(--btn); box-shadow: inset 0 0 0 2px var(--ink);
    --av-c: var(--av-red);
  }
  .gx-avatar:empty { display: none; }
  .gx-avatar svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
  .gx-avatar[data-av-color="orange"] { --av-c: var(--av-orange); }
  .gx-avatar[data-av-color="yellow"] { --av-c: var(--av-yellow); }
  .gx-avatar[data-av-color="green"]  { --av-c: var(--av-green); }
  .gx-avatar[data-av-color="cyan"]   { --av-c: var(--av-cyan); }
  .gx-avatar[data-av-color="blue"]   { --av-c: var(--av-blue); }
  .gx-avatar[data-av-color="purple"] { --av-c: var(--av-purple); }
  .gx-avatar[data-av-color="pink"]   { --av-c: var(--av-pink); }
  .gx-avatar .av-x { fill: var(--av-c); }
  .gx-avatar .av-o { fill: var(--ink); }
  .gx-avatar .av-w { fill: var(--av-white); }
  .gx-player.active .gx-avatar { background: var(--hud-edge); box-shadow: inset 0 0 0 2px var(--hud-muted); }

  /* ===== 오목판 테마 (K4): svg.board[data-board] 가 --wood/--wood-line 을 바꿈 (wood = 기본) ===== */
  svg.board[data-board="bamboo"] { --wood: var(--gb-bamboo); --wood-line: var(--gb-bamboo-line); }
  svg.board[data-board="slate"]  { --wood: var(--gb-slate);  --wood-line: var(--gb-slate-line); }
  svg.board[data-board="retro"]  { --wood: var(--gb-retro);  --wood-line: var(--gb-retro-line); }
  /* 돌 세트 훅 (K4): classic = 지금 그대로(url(#gb)/url(#gw)).
     pixel/gem 은 JS 가 돌을 <g class="st st-px"> / <g class="st st-gem"> 안의 도형으로 그리고
     아래 class 로 색을 받음(.b = 흑, .w = 백). CSS fill 이 SVG fill 속성보다 우선. */
  svg.board .st-px { shape-rendering: crispEdges; }
  svg.board .st-edge.b { fill: var(--stone-b-edge); }
  svg.board .st-edge.w { fill: var(--stone-w-edge); }
  svg.board .st-body.b { fill: var(--stone-b-lo); }
  svg.board .st-body.w { fill: var(--stone-w-lo); }
  svg.board .st-hi.b   { fill: var(--stone-b-hi); }
  svg.board .st-hi.w   { fill: var(--stone-w-hi); }
  svg.board .st-shine  { fill: var(--stone-w-hi); }
  svg.board .st-gem .st-hi { opacity: .85; }
  svg.board .st-gem .st-shine { opacity: .9; }
  svg.board .st.ghost { opacity: .45; }
  svg.board .st { transform-box: fill-box; transform-origin: center; }

  /* ===== 설정 시트: 넓은 줄(라벨 위, 선택지 아래) · UI 테마 스와치 · 꾸미기 ===== */
  .gx-opt.wide { grid-template-columns: minmax(0, 1fr); }
  .gx-subhead {
    margin: 6px 0 0; font-size: calc(16px * var(--z)); font-weight: 900; letter-spacing: .06em;
    color: var(--title-from); text-shadow: 2px 2px 0 var(--ink);
  }
  .gx-swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .gx-swatches .gx-btn {
    flex-direction: column; gap: 4px; padding: 6px 2px; min-width: 0;
    font-size: calc(11px * var(--z)); overflow-wrap: anywhere;
  }
  .gx-swatches .gx-btn[aria-pressed="true"] { background: var(--btn-hover); outline: 3px solid var(--primary); outline-offset: 2px; }
  .gx-swatches .gx-btn[aria-pressed="true"]:focus-visible { outline-color: var(--focus); outline-offset: 6px; }
  .sw-chip { display: block; width: 100%; max-width: 44px; height: calc(18px * var(--z)); box-shadow: inset 0 0 0 2px var(--ink); }
  .sw-chip[data-v="classic"] { background: linear-gradient(90deg, var(--sw-classic-a) 0 50%, var(--sw-classic-b) 50% 100%); }
  .sw-chip[data-v="gameboy"] { background: linear-gradient(90deg, var(--sw-gameboy-a) 0 50%, var(--sw-gameboy-b) 50% 100%); }
  .sw-chip[data-v="neon"]    { background: linear-gradient(90deg, var(--sw-neon-a) 0 50%, var(--sw-neon-b) 50% 100%); }
  .sw-chip[data-v="famicom"] { background: linear-gradient(90deg, var(--sw-famicom-a) 0 50%, var(--sw-famicom-b) 50% 100%); }
  /* 꾸미기 세그먼트 안 미리보기 칩 (판 색 / 돌 모양) */
  .bd-chip, .st-chip { display: block; margin: 0 auto 4px; pointer-events: none; }
  .bd-chip { width: 24px; height: 12px; box-shadow: inset 0 0 0 2px var(--ink); }
  .bd-chip[data-v="wood"]   { background: linear-gradient(90deg, var(--wood) 0 70%, var(--wood-line) 70% 100%); }
  .bd-chip[data-v="bamboo"] { background: linear-gradient(90deg, var(--gb-bamboo) 0 70%, var(--gb-bamboo-line) 70% 100%); }
  .bd-chip[data-v="slate"]  { background: linear-gradient(90deg, var(--gb-slate) 0 70%, var(--gb-slate-line) 70% 100%); }
  .bd-chip[data-v="retro"]  { background: linear-gradient(90deg, var(--gb-retro) 0 70%, var(--gb-retro-line) 70% 100%); }
  .st-chip { width: 14px; height: 14px; }
  .st-chip[data-v="classic"] { clip-path: circle(50%); background: radial-gradient(circle at 35% 30%, var(--stone-b-hi) 0 25%, var(--stone-b-lo) 25%); }
  .st-chip[data-v="pixel"]   { clip-path: var(--px-round); background: linear-gradient(135deg, var(--stone-b-hi) 0 30%, var(--stone-b-lo) 30%); }
  .st-chip[data-v="gem"]     { clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%); background: linear-gradient(135deg, var(--stone-w-hi) 0 20%, var(--stone-b-hi) 20% 45%, var(--stone-b-lo) 45%); }

  /* ===== 결과 화면 ===== */
  .gx-result {
    position: fixed; inset: 0; z-index: 40;
    display: none; place-items: center; padding: 16px; overflow: hidden;
    background: var(--scrim);
  }
  .gx-result.show { display: grid; }
  .gx-rays {
    position: absolute; left: 50%; top: 50%; width: 200vmax; height: 200vmax; translate: -50% -50%;
    background: repeating-conic-gradient(var(--ray) 0 10deg, transparent 10deg 20deg);
    pointer-events: none; display: none;
    animation: gx-spin 12s steps(36, end) infinite;
  }
  .gx-result[data-outcome="win"] .gx-rays { display: block; }
  .gx-result-box {
    position: relative; text-align: center;
    width: min(100%, calc(440px * var(--z)));
    margin: var(--px); padding: 22px 18px 14px;
    background: var(--panel); color: var(--text);
    box-shadow: var(--pxbox), var(--pxdrop),
      inset 0 calc(-1 * var(--px)) 0 0 var(--btn-edge), inset 0 var(--px) 0 0 var(--panel-hi);
  }
  .gx-stars {
    position: absolute; left: 50%; top: calc(-28px * var(--z)); translate: -50% 0;
    width: calc(160px * var(--z)); height: auto; display: none;
  }
  .gx-stars rect { fill: var(--gold-hi); }
  .gx-stars .s2 rect { fill: var(--gold); }
  .gx-result[data-outcome="win"] .gx-stars { display: block; animation: gx-blink 1s steps(2, jump-none) infinite; }
  .gx-outcome {
    margin: 0 0 6px; font-size: calc(40px * var(--z)); font-weight: 900; letter-spacing: .08em; line-height: 1.1;
    text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 var(--title-edge);
  }
  .gx-outcome span { display: none; }
  .gx-result[data-outcome="win"] .gx-outcome [data-o="win"],
  .gx-result[data-outcome="lose"] .gx-outcome [data-o="lose"],
  .gx-result[data-outcome="draw"] .gx-outcome [data-o="draw"] { display: inline; }
  .gx-result[data-outcome="win"] .gx-outcome { color: var(--win); }
  .gx-result[data-outcome="lose"] .gx-outcome { color: var(--lose); }
  .gx-result[data-outcome="draw"] .gx-outcome { color: var(--draw); }
  .gx-result.show .gx-outcome { animation: gx-banner .4s steps(4, end) both; }
  .gx-result h2 { margin: 0 0 4px; font-size: calc(20px * var(--z)); font-weight: 900; letter-spacing: .06em; }
  .gx-result p.gx-result-text { margin: 0 0 12px; color: var(--muted); font-size: calc(14px * var(--z)); }
  .gx-result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
  .gx-result-actions .gx-btn { flex: 1 1 110px; }

  /* ===== 페이지 진입/퇴장 전환 (블록 와이프) ===== */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 100; pointer-events: none;
    background: var(--hud-bg); clip-path: inset(0 0 100% 0);
  }
  html.gx-enter body::before { animation: gx-wipe-in .25s steps(5, end) both; }
  html.gx-leave body::before { animation: gx-wipe-out .25s steps(5, end) both; }

  /* ===== PC 배치 (넓은 화면): [판 | 오른쪽: 위 패널 / 빈칸 / 아래 패널 / 도크] ===== */
  @container (min-width: 821px) {
    :root[data-layout="pc"] .app {
      max-width: calc(1040px * var(--z));
      padding: 16px 24px;
      grid-template-columns: minmax(0, 1fr) calc(280px * var(--z));
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      grid-template-areas: "hud hud" "board top" "board ." "board bottom" "board dock";
      gap: 12px 24px;
    }
    :root[data-layout="pc"] .dock { justify-content: stretch; }
    :root[data-layout="pc"] .dock .gx-btn { flex: 1; min-width: 0; }
  }

  /* ===== 모바일 가로(높이 ≤500px): [왼쪽: HUD / 패널 / 도크 | 오목판] ===== */
  @media (orientation: landscape) and (max-height: 500px) {
    :root[data-layout="mobile"] body { max-width: none; }
    :root[data-layout="mobile"] .app {
      max-width: 1000px;
      padding: 8px 16px;
      grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      grid-template-areas: "hud board" "top board" ". board" "bottom board" "dock board";
      gap: 6px 16px;
    }
    :root[data-layout="mobile"] .dock .gx-btn { flex: 1; min-width: 0; }
    :root[data-layout="mobile"] .hud-count { padding: 0; }
  }

  /* ===== 애니메이션 (steps 위주) ===== */
  @keyframes gx-blink { 50% { opacity: 0; } }
  @keyframes gx-dim { 50% { opacity: .35; } }
  @keyframes gx-nudge { 50% { translate: 3px -50%; } }
  @keyframes gx-stone { 0% { transform: scale(1.5); opacity: .3; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes gx-pulse { 50% { transform: scale(1.6); } }
  @keyframes gx-draw { from { stroke-dashoffset: 360; } to { stroke-dashoffset: 0; } }
  @keyframes gx-pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes gx-banner { from { transform: scale(2.2); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes gx-spin { to { transform: rotate(360deg); } }
  @keyframes gx-toast {
    0% { transform: scale(.6); opacity: 0; } 15% { transform: scale(1.1); opacity: 1; }
    25%, 80% { transform: none; opacity: 1; } 100% { opacity: 0; }
  }
  @keyframes gx-wipe-in { from { clip-path: inset(0); } to { clip-path: inset(100% 0 0 0); } }
  @keyframes gx-wipe-out { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }

  /* 움직임 줄이기: 모든 연출 끔 (전환 덮개도 안 보이게) */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html.gx-enter body::before, html.gx-leave body::before { clip-path: inset(0 0 100% 0); }
    .gx-toast.show { opacity: 1; }
  }
</style>

  <div class="gx-menu" id="gxMenu" role="dialog" aria-modal="true" aria-labelledby="gxPauseTitle" hidden>

      <section class="gx-sheet" id="gxPause" data-sheet="pause">

        <div class="gx-menu-list">
          <button type="button" class="gx-btn" id="menuResume" data-i18n="resume" aria-current="true">계속하기</button>

          <h2 class="gx-title" id="gxSettingsTitle" data-i18n="settings">설정</h2>
        </div>
        <div class="gx-opt">
          <span class="gx-opt-label" id="soundLbl" data-i18n="sound">소리</span>
          <button type="button" class="gx-btn gx-toggle" id="soundToggle" aria-labelledby="soundLbl" aria-pressed="true">
            <span class="v-on" data-i18n="on">켜짐</span><span class="v-off" data-i18n="off">꺼짐</span>
          </button>
        </div>
        <div class="gx-opt">
          <span class="gx-opt-label" id="langLbl" data-i18n="langLabel">언어</span>
          <button type="button" class="gx-btn gx-cycle" id="langCycle" aria-labelledby="langLbl langCycleVal">

            <span class="gx-cycle-val" id="langCycleVal">한국어</span>
            <span class="gx-cycle-arrow" aria-hidden="true">&#9654;</span>

        </div>
        <section class="set-body" id="panelControls" data-panel-id="controls" aria-labelledby="gxSetupTitle">
          <div>
            <div class="field-label" id="modeLbl" data-i18n="mode">대전 방식</div>
            <div class="seg" id="modeSeg" role="group" aria-labelledby="modeLbl">
              <button data-v="me-b" data-i18n="modeB">나: 흑(먼저)</button>
              <button data-v="me-w" data-i18n="modeW">나: 백</button>
              <button data-v="pvp" data-i18n="modePvp">2인 대전</button>

          <div>
            <div class="field-label" id="levelLbl" data-i18n="level">AI 난이도</div>

        </div>

    </div>
  </div>

</div>

<script>

const I18N = {

// ===== [공유] 효과음 시작 =====
// WebAudio 로 그 자리에서 만드는 8비트 효과음(외부 파일 없음). 사이트 공통 키 games-sound = 'on'|'off' (기본 on).
// - 첫 pointerdown/keydown 때 AudioContext 를 만들거나 깨움 → 그 전에는 소리 없음. WebAudio 가 없으면 조용히 무시.
// - Sfx.play(name, delay?)  : 등록된 소리 재생 (delay 초 뒤).
// - Sfx.define(name, fn, gapMs?) : 소리 등록. fn(S, t) 안에서 S.tone / S.noise / S.seq 로 t(시작 시각)부터 예약.
//   gapMs 를 주면 그 간격 안의 반복 재생은 건너뜀 (예: 공 배틀 hit 은 80).
// - Sfx.toggle() / Sfx.set(on) : 켜기·끄기 + 저장. #soundBtn / #soundToggle 이 있으면 aria-pressed 를 맞춤.
// - 다른 탭에서 바꾸면 storage 이벤트로 따라감. 블록 끝의 Sfx.boot() 가 이 연결을 모두 함.
const Sfx = {
  KEY: 'games-sound',
  on: true, ctx: null, out: null, defs: {}, gaps: {}, last: {}, noiseBuf: null,
  load() {
    try { this.on = localStorage.getItem(this.KEY) !== 'off'; } catch (e) {}
  },
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        this.out = this.ctx.createGain();
        this.out.gain.value = 0.25; // 마스터 볼륨
        this.out.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; return; }
    }
    if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
  },
  set(on) {
    this.on = !!on;
    try { localStorage.setItem(this.KEY, this.on ? 'on' : 'off'); } catch (e) {}
    this.sync();
  },
  toggle() {
    this.set(!this.on);
    if (this.on) { this.init(); this.play('ui-ok'); }
  },
  sync() {
    document.querySelectorAll('#soundBtn, #soundToggle').forEach(b => b.setAttribute('aria-pressed', String(this.on)));
  },
  define(name, fn, gapMs) {
    this.defs[name] = fn;
    if (gapMs) this.gaps[name] = gapMs;
  },
  play(name, delay) {
    // 깨우는 중(suspended)이어도 예약해 두면 깨어날 때 울림
    if (!this.on || !this.ctx || this.ctx.state === 'closed') return;
    const fn = this.defs[name];
    if (!fn) return;
    const gap = this.gaps[name];
    if (gap) {
      const now = Date.now();
      if (now - (this.last[name] || 0) < gap) return;
      this.last[name] = now;
    }
    try { fn(this, this.ctx.currentTime + 0.01 + (delay || 0)); } catch (e) {}
  },
  // 기본 음 하나: o = { type: square|triangle|sawtooth|sine, vol 0..1, to: 끝 주파수(미끄러짐), hold: 유지 비율 }
  tone(t, f, dur, o) {
    o = o || {};
    const c = this.ctx, osc = c.createOscillator(), g = c.createGain();
    const v = o.vol == null ? 0.5 : o.vol;
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + 0.005);
    g.gain.setValueAtTime(v, t + Math.max(0.006, dur * (o.hold == null ? 0.4 : o.hold)));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.out);
    osc.start(t); osc.stop(t + dur + 0.02);
  },
  // 잡음(타격·착지 느낌): o = { vol, hp: 고역 통과 Hz, lp: 저역 통과 Hz }
  noise(t, dur, o) {
    o = o || {};
    const c = this.ctx;
    if (!this.noiseBuf) {
      const n = (c.sampleRate * 0.5) | 0, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
    }
    const src = c.createBufferSource(), g = c.createGain();
    const v = o.vol == null ? 0.4 : o.vol;
    src.buffer = this.noiseBuf; src.loop = true;
    let node = src;
    if (o.hp || o.lp) {
      const f = c.createBiquadFilter();
      f.type = o.hp ? 'highpass' : 'lowpass';
      f.frequency.value = o.hp || o.lp;
      src.connect(f); node = f;
    }
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(this.out);
    src.start(t); src.stop(t + dur + 0.02);
  },
  // 음 여러 개를 step 초 간격으로 (0 은 쉼표)
  seq(t, freqs, step, o) {
    freqs.forEach((f, i) => { if (f) this.tone(t + i * step, f, (o && o.dur) || step * 0.9, o); });
  },
  boot() {
    this.load();
    const wake = () => this.init();
    for (const ev of ['pointerdown', 'pointerup', 'keydown']) window.addEventListener(ev, wake, true);
    window.addEventListener('storage', e => {
      if (e.key !== this.KEY && e.key !== null) return;
      this.load();
      this.sync();
    });
    this.sync();
  },
};
// 공통 소리 (게임별 소리는 각 페이지에서 Sfx.define 으로 추가)
Sfx.define('ui-move', (S, t) => S.tone(t, 880, 0.04, { vol: 0.22 }));
Sfx.define('ui-ok', (S, t) => S.seq(t, [660, 990], 0.05, { vol: 0.3, dur: 0.07 }));
Sfx.define('ui-back', (S, t) => S.seq(t, [520, 330], 0.05, { vol: 0.3, dur: 0.07 }));
Sfx.define('menu-open', (S, t) => S.tone(t, 300, 0.12, { type: 'triangle', to: 900, vol: 0.5, hold: 0.7 }));
Sfx.define('menu-close', (S, t) => S.tone(t, 900, 0.12, { type: 'triangle', to: 300, vol: 0.5, hold: 0.7 }));
Sfx.define('start', (S, t) => {
  S.seq(t, [523, 659, 784], 0.07, { vol: 0.35, dur: 0.08 });
  S.tone(t + 0.21, 1047, 0.25, { vol: 0.35 });
});
Sfx.define('win', (S, t) => {
  S.seq(t, [523, 659, 784, 1047, 784, 1047], 0.09, { vol: 0.32, dur: 0.1 });
  S.tone(t + 0.54, 1319, 0.45, { vol: 0.32, hold: 0.6 });
  S.tone(t + 0.54, 659, 0.45, { type: 'triangle', vol: 0.4, hold: 0.6 });
});
Sfx.define('lose', (S, t) => {
  S.seq(t, [523, 415, 349], 0.15, { type: 'triangle', vol: 0.5, dur: 0.16 });
  S.tone(t + 0.45, 262, 0.6, { type: 'triangle', to: 196, vol: 0.5, hold: 0.5 });
});
Sfx.define('draw', (S, t) => {
  S.seq(t, [440, 0, 440], 0.12, { vol: 0.3, dur: 0.1 });
  S.tone(t + 0.36, 392, 0.35, { vol: 0.3 });
});
Sfx.boot();

const N = 15;
const EMPTY = 0, BLACK = 1, WHITE = 2;
const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
const other = p => 3 - p;

// idx 위치에 p 의 돌이 있다고 보고, 5개 이상 이어진 줄을 돌려줌 (없으면 null)
function fiveAt(b, idx, p) {
  const r = (idx / N) | 0, c = idx % N;
  for (const [dr, dc] of DIRS) {
    const line = [idx];
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (rr >= 0 && rr < N && cc >= 0 && cc < N && b[rr * N + cc] === p) {
        line.push(rr * N + cc);
        rr += dr * s; cc += dc * s;
      }
    }
    if (line.length >= 5) return line;
  }
  return null;
}

// 패턴 점수표 (x=내 돌, _=빈칸). 높은 점수부터 검사해서 처음 맞는 것을 사용.
const PATS = [
  ['xxxxx', 1000000],
  ['_xxxx_', 100000],
  ['xxxx_', 10000], ['_xxxx', 10000], ['xxx_x', 10000], ['x_xxx', 10000], ['xx_xx', 10000],
  ['_xxx_', 3000], ['_xx_x_', 3000], ['_x_xx_', 3000],
  ['xxx__', 300], ['__xxx', 300], ['xx_x_', 300], ['_x_xx', 300], ['x_xx_', 300], ['_xx_x', 300],
  ['x__xx', 300], ['xx__x', 300], ['x_x_x', 300],
  ['__xx__', 100], ['_xx__', 60], ['__xx_', 60], ['_x_x_', 60], ['_x__x_', 30],
  ['__x__', 8], ['_x_', 2],

function lineScore(str) {

// idx 를 중심으로 한 방향 9칸 문자열
function windowStr(b, idx, dr, dc, p, place) {
  const r = (idx / N) | 0, c = idx % N;
  let s = '';
  for (let k = -4; k <= 4; k++) {
    const rr = r + dr * k, cc = c + dc * k;
    if (rr < 0 || rr >= N || cc < 0 || cc >= N) { s += 'o'; continue; }
    if (k === 0) { s += place ? 'x' : '_'; continue; }
    const v = b[rr * N + cc];
    s += v === p ? 'x' : v === EMPTY ? '_' : 'o';
  }
  return s;
}
// p 가 idx 에 두었을 때 얻는 이득
function cellScore(b, idx, p) {
  let total = 0, strong = 0;
  for (const [dr, dc] of DIRS) {
    const withS = lineScore(windowStr(b, idx, dr, dc, p, true));
    const d = withS - lineScore(windowStr(b, idx, dr, dc, p, false));
    if (d > 0) {
      total += d;
      if (withS >= 3000) strong++;

    if (b[i] !== EMPTY) continue;
    const r = (i / N) | 0, c = i % N;
    let near = false;
    for (let dr = -2; dr <= 2 && !near; dr++) {
      for (let dc = -2; dc <= 2; dc++) {

function chooseMove(b, me, level) {

  const scored = cands.map(i => ({ i, s: moveValue(b, i, me) })).sort((a, b) => b.s - a.s);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)].i;
  const top = scored[0];
  const opp = other(me);
  // 점수표와 별개로 먼저 확인: ① 내가 바로 5목 완성 ② 상대가 다음 수에 5목 완성 → 막기
  // (막는 칸의 점수는 ×0.9 라서 점수 기준만으로는 놓칠 수 있음)
  const winNow = threatCells(b, me);
  const mustBlock = threatCells(b, opp);
  // 막을 칸이 여럿(열린 4 등)이면 그중 점수가 가장 높은 칸
  const blockCell = () => (scored.find(x => mustBlock.includes(x.i)) || { i: mustBlock[0] }).i;

  if (level === 0) {
    // 입문: 5목 완성/막기는 각각 절반 확률로만 챙김
    if (winNow.length && Math.random() < 0.5) return winNow[0];
    if (mustBlock.length && Math.random() < 0.5) return blockCell();
    return pick(scored.slice(0, 6));
  }
  if (winNow.length) return winNow[0];
  if (mustBlock.length) return blockCell();
  if (level === 1) {
    if (top.s >= 90000) return top.i;
    return pick(scored.filter(x => x.s >= top.s * 0.5).slice(0, 4));
  }
  if (level === 2) {
    return pick(scored.filter(x => x.s === top.s));
  }

  // ----- 어려움 -----
  // 1) 5목 완성 / 상대 5목 막기는 위에서 이미 처리
  // 2) 상대가 지금 5목 위협이 없으면, 4를 연달아 두어 이기는 수순(VCF)을 찾음
  if (!mustBlock.length) {
    vcfBudget = 4000;
    const v = vcf(b, me, 10);
    if (v >= 0) return v;
  }
  // 3) 상위 후보마다: 상대의 VCF 허용 여부 + 상대 최선 응수 + 내 다음 기회
  let best = null, bestV = -Infinity;
  for (const { i, s } of scored.slice(0, 12)) {
    b[i] = me;
    let v = s;
    const myThreat = threatCells(b, me).length > 0; // 4를 만들었으면 상대는 막아야만 함
    if (!myThreat) {
      vcfBudget = 1500;
      if (vcf(b, opp, 8) >= 0) v -= 500000;
    }
    let oppBest = 0, myNext = 0;
    for (const j of candidates(b)) {
      const a = cellScore(b, j, opp);
      if (a > oppBest) oppBest = a;
      const m = cellScore(b, j, me);
      if (m > myNext) myNext = m;
    }
    b[i] = EMPTY;
    v += (myThreat ? 0 : -0.6 * oppBest) + 0.25 * myNext + Math.random();
    if (v > bestV) { bestV = v; best = i; }
  }
  return best;
}

// p 가 다음 수에 5목을 완성할 수 있는 빈칸들
function threatCells(b, p) {
  const out = [];
  for (let i = 0; i < N * N; i++) {
    if (b[i] !== EMPTY) continue;
    b[i] = p;
    if (fiveAt(b, i, p)) out.push(i);
    b[i] = EMPTY;
  }
  return out;
}
// idx 주변에서 p 가 5목을 완성할 수 있는 빈칸들 (idx 에 방금 둔 돌 기준)
function winCellsNear(b, idx, p) {
  const res = new Set();
  const r = (idx / N) | 0, c = idx % N;
  for (const [dr, dc] of DIRS) {
    for (let k = -4; k <= 4; k++) {
      if (!k) continue;
      const rr = r + dr * k, cc = c + dc * k;
      if (rr < 0 || rr >= N || cc < 0 || cc >= N) continue;
      const j = rr * N + cc;
      if (b[j] !== EMPTY) continue;
      b[j] = p;
      if (fiveAt(b, j, p)) res.add(j);
      b[j] = EMPTY;
    }
  }
  return [...res];
}
// VCF 탐색: p 가 4(5목 위협)만 연속으로 두어 이길 수 있으면 첫 수를 반환, 아니면 -1
let vcfBudget = 0;
function vcf(b, p, depth) {
  if (depth <= 0) return -1;
  const q = other(p);
  for (const i of candidates(b)) {
    if (--vcfBudget < 0) return -1;
    b[i] = p;
    if (fiveAt(b, i, p)) { b[i] = EMPTY; return i; }
    const w = winCellsNear(b, i, p);
    if (w.length >= 2) { b[i] = EMPTY; return i; }       // 막을 수 없는 쌍4 / 열린4
    if (w.length === 1) {
      const blk = w[0];
      b[blk] = q;                                         // 상대는 강제로 막음
      let ok = false;
      if (!fiveAt(b, blk, q) && winCellsNear(b, blk, q).length === 0) ok = vcf(b, p, depth - 1) >= 0;
      b[blk] = EMPTY;
      if (ok) { b[i] = EMPTY; return i; }
    }
    b[i] = EMPTY;
  }
  return -1;
}

// --- 정적인 판 그리기 ---
function el(tag, attrs, parent) {

  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// stonesLayer: 돌·마지막 수·승리선 (판이 바뀔 때만 다시 그림 → 착수/승리 애니메이션이 끊기지 않음)
// fxLayer: 미리보기 돌·키보드 커서 (매번 다시 그림)
let stonesLayer, fxLayer;
function drawBoard() {
  svg.setAttribute('viewBox', `0 0 ${SIZE} ${SIZE}`);

  // CSS 변수는 SVG 속성에서 안 먹으므로 style 로 지정

  const lines = el('g', { style: 'stroke: var(--wood-line)', 'stroke-width': 1.2 }, svg);
  for (let k = 0; k < N; k++) {
    const p = M + k * G;
    el('line', { x1: M, y1: p, x2: SIZE - M, y2: p }, lines);

// 픽셀 돌: 9×9 칸(한 칸 4) — e 테두리, b 몸통, h 하이라이트
const PX_STONE = [
  '..eeeee..',
  '.ebbbbbe.',
  'ebhhbbbbe',
  'ebhbbbbbe',
  'ebbbbbbbe',
  'ebbbbbbbe',
  'ebbbbbbbe',
  '.ebbbbbe.',
  '..eeeee..',
];
// 격자에서 글자 ch 인 칸들을 한 path 로 (가로로 이어진 칸은 합침). 좌표를 직접 넣음: CSS 애니메이션 transform 과 겹치지 않게
function runsPath(ch, x0, y0, u) {
  let d = '';
  PX_STONE.forEach((row, r) => {
    for (let c = 0; c < row.length;) {
      let n = 0;
      while (row[c + n] === ch) n++;
      if (n) { d += `M${x0 + c * u} ${y0 + r * u}h${n * u}v${u}h${-n * u}z`; c += n; } else c++;
    }
  });
  return d;
}
// 보석 돌: 팔각형
function octPts(cx, cy, R, from, to) {
  const pts = [];
  for (let k = from; k <= to; k++) {
    const a = (22.5 + 45 * k) * Math.PI / 180;
    pts.push((cx + R * Math.cos(a)).toFixed(1) + ',' + (cy + R * Math.sin(a)).toFixed(1));
  }
  return pts;
}
// 돌 하나 (skin.stones 에 따라). o = { parent, cls, opacity }
function stone(i, color, o) {
  o = o || {};
  const [x, y] = pos(i);
  const parent = o.parent || stonesLayer;
  const c = color === BLACK ? 'b' : 'w';
  let node;
  if (skin.stones === 'pixel') {
    node = el('g', { class: 'st st-px' }, parent);
    const x0 = x - 18, y0 = y - 18;
    el('path', { class: 'st-edge ' + c, d: runsPath('e', x0, y0, 4) }, node);
    el('path', { class: 'st-body ' + c, d: runsPath('b', x0, y0, 4) }, node);
    el('path', { class: 'st-hi ' + c, d: runsPath('h', x0, y0, 4) }, node);
  } else if (skin.stones === 'gem') {
    node = el('g', { class: 'st st-gem' }, parent);
    el('polygon', { class: 'st-edge ' + c, points: octPts(x, y, 18.5, 0, 7).join(' ') }, node);
    el('polygon', { class: 'st-body ' + c, points: octPts(x, y, 15, 0, 7).join(' ') }, node);
    // 왼쪽 위 면 (꼭짓점 4·5·6 + 가운데)
    el('polygon', { class: 'st-hi ' + c, points: octPts(x, y, 15, 4, 6).concat([`${x - 2},${y - 2}`]).join(' ') }, node);
    el('rect', { class: 'st-shine', x: x - 9, y: y - 11, width: 4, height: 4 }, node);
  } else {
    node = el('circle', {
      cx: x, cy: y, r: G * 0.45,
      fill: color === BLACK ? 'url(#gb)' : 'url(#gw)',
      style: color === BLACK ? 'stroke: var(--stone-b-edge)' : 'stroke: var(--stone-w-edge)', 'stroke-width': 1,
    }, parent);
  }
  if (o.cls) for (const k of o.cls.split(' ')) if (k) node.classList.add(k);
  if (o.opacity != null) node.setAttribute('opacity', o.opacity);
  return node;
}

let stonesKey = '', drawnLen = -1, drawnSkin = '';
function drawStones() {
  const key = history.join(',') + '|' + skin.stones + '|' + (winLine ? 1 : 0);
  if (key === stonesKey) return;
  // 한 수가 막 늘었으면 그 돌에만 .stone-new (스킨만 바뀐 경우는 제외)
  const grew = drawnSkin === skin.stones && history.length === drawnLen + 1;
  stonesKey = key; drawnLen = history.length; drawnSkin = skin.stones;
  stonesLayer.replaceChildren();
  const last = history[history.length - 1];
  const wins = winLine ? new Set(winLine) : null;
  for (let i = 0; i < N * N; i++) {
    if (!board[i]) continue;
    const cls = (grew && i === last ? 'stone-new ' : '') + (wins && wins.has(i) ? 'win-stone' : '');
    stone(i, board[i], { cls });
  }
  if (last != null && !winLine) {
    const [x, y] = pos(last);
    el('circle', { class: 'last-mark', cx: x, cy: y, r: 5, style: 'fill: var(--mark)' }, stonesLayer);
  }
  if (winLine) {
    const sorted = winLine.slice().sort((a, b) => a - b);
    const [x1, y1] = pos(sorted[0]), [x2, y2] = pos(sorted[sorted.length - 1]);
    // pathLength 360 = CSS stroke-dasharray 값 → 줄 길이(장목 포함)와 관계없이 끝까지 그려짐
    el('line', { class: 'win-line', x1, y1, x2, y2, pathLength: 360, style: 'stroke: var(--mark)', 'stroke-width': 6, 'stroke-linecap': 'round', opacity: .85 }, stonesLayer);
  }
}

// 플레이어 패널: 아래 = 나(2인 대전이면 흑·1P), 위 = 상대

  if (over) {

    $('statusSub').textContent = thinking ? t('thinking')
      : preview >= 0 ? t('tapAgain')
      : (ready && aiColor() && tc !== aiColor() ? t('yourTurn') : '');
  }
  $('moveCount').textContent = history.length;
  $('undoBtn').disabled = thinking || history.length === 0;
  renderPlayers();
  renderSetup();
}

function humanTurn() {
  return ready && !over && !thinking && turn() !== aiColor();
}

// 메뉴·결과 화면이 열려 있으면 판 입력 무시
const blocked = () => Menu.isOpen() || Result.isOpen();

function newGame() {
  gen++;
  clearTimeout(resultTimer);
  pendingResult = false;
  board = new Array(N * N).fill(EMPTY);
  history = [];
  over = null;
  winLine = null;
  thinking = false;
  preview = -1;
  Result.close(false);
  render();
  maybeAI();
}

// 준비 시트 "대국 시작" / 결과 화면 "새 게임"
function startMatch() {
  mode = setupMode;
  ready = true;
  saveSettings();
  pendingResult = false;
  Menu.close({ restore: false, silent: true });
  newGame();
  Sfx.play('start');
  toast(t('startToast'));
  GxUI.focusSafe(svg);
}

function place(i) {
  const p = turn();
  board[i] = p;
  history.push(i);
  preview = -1;
  announce(t(p === BLACK ? 'cellB' : 'cellW') + ' ' + coordName(i)); // 예: "흑돌 H8"
  const line = fiveAt(board, i, p);
  if (line) {
    winLine = line;
    over = { title: p === BLACK ? 'winB' : 'winW', text: 'five', winner: p };
  } else if (history.length === N * N) {
    over = { title: 'draw', text: 'full', winner: 0 };
  }
  render();
  Sfx.play('stone');
  if (over) finishGame();
  else maybeAI();
}

// 끝난 판: 승리선·토스트를 잠깐 보여 준 뒤 결과 화면
function finishGame() {
  if (over.winner) {
    Sfx.play('five', 0.08);
    toast(t('fiveToast'));
  }
  const myGen = gen;
  clearTimeout(resultTimer);
  resultTimer = setTimeout(() => { if (myGen === gen && over) showResult(); }, GxUI.reduced() ? 300 : 1100);
}
function outcomeOf() {
  if (!over || !over.winner) return 'draw';
  if (mode === 'pvp') return 'win';
  return over.winner === aiColor() ? 'lose' : 'win';
}
function showResult() {
  if (Menu.isOpen()) { pendingResult = true; return; }
  pendingResult = false;
  const o = outcomeOf();
  $('endOverlay').dataset.outcome = o;
  Result.open($('endNew'));
  Sfx.play(o);
}

function maybeAI() {
  if (!ready || over || turn() !== aiColor()) return;
  thinking = true;
  render();
  const myGen = gen;
  setTimeout(() => {
    if (myGen !== gen) return;
    const i = chooseMove(board.slice(), aiColor(), level);
    if (myGen !== gen) return;
    thinking = false;
    place(i);
  }, 350);
}

function undo() {
  if (thinking || !history.length) return;
  gen++;
  clearTimeout(resultTimer);
  pendingResult = false;
  const pop = () => { board[history.pop()] = EMPTY; };
  pop();
  if (aiColor() && turn() === aiColor() && history.length) pop();
  over = null;
  winLine = null;
  preview = -1;
  Result.close(false);
  Sfx.play('ui-back');
  render();
  maybeAI();
}

function pointToIdx(e) {
  const rect = svg.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * SIZE;
  const y = (e.clientY - rect.top) / rect.height * SIZE;
  const c = Math.round((x - M) / G), r = Math.round((y - M) / G);
  if (r < 0 || r >= N || c < 0 || c >= N) return -1;
  if (Math.hypot(x - (M + c * G), y - (M + r * G)) > G * 0.55) return -1;
  return r * N + c;
}

// 마우스: 클릭하면 바로 착수 / 터치: 첫 탭은 미리보기, 같은 곳을 다시 탭하면 착수
svg.addEventListener('pointerdown', () => {
  if (kbdOn) { kbdOn = false; render(); } // 마우스·터치를 쓰면 키보드 커서 숨김
});
svg.addEventListener('pointerup', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return; // 왼쪽 버튼만 (우클릭·휠클릭 무시)
  if (blocked() || !humanTurn()) return;
  const i = pointToIdx(e);
  if (i < 0 || board[i]) { preview = -1; render(); return; }
  if (e.pointerType === 'mouse') { place(i); return; }
  if (preview === i) place(i);
  else { preview = i; Sfx.play('ui-move'); render(); }
});
svg.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || blocked()) return;
  const i = pointToIdx(e);
  if (i !== hover) { hover = i; render(); }
});
svg.addEventListener('pointerleave', () => { if (hover !== -1) { hover = -1; render(); } });

// 키보드: 방향키로 커서 이동, Enter/Space 로 착수
function startKbd() {
  kbdOn = true;
  preview = -1;
  if (cursor < 0) {
    const last = history[history.length - 1];
    cursor = last != null ? last : ((N / 2) | 0) * N + ((N / 2) | 0);
  }
}
const ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
svg.addEventListener('keydown', e => {
  if (blocked()) return;
  const d = ARROWS[e.key];
  if (d) {
    e.preventDefault();
    if (kbdOn && cursor >= 0) {
      const r = Math.min(N - 1, Math.max(0, ((cursor / N) | 0) + d[0]));
      const c = Math.min(N - 1, Math.max(0, (cursor % N) + d[1]));
      cursor = r * N + c;
    }
    startKbd(); // 처음 누른 방향키는 커서만 보여 줌
    announce(cellInfo(cursor));
    Sfx.play('ui-move');
    render();
  } else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (e.repeat) return;
    if (!kbdOn || cursor < 0) { startKbd(); announce(cellInfo(cursor)); render(); return; }
    if (!humanTurn()) return;
    if (board[cursor]) { announce(cellInfo(cursor)); return; } // 이미 돌이 있는 자리
    place(cursor);
  }
});
// Tab 으로 들어오면 커서를 바로 보여 줌 (마우스 클릭으로 생긴 포커스는 제외)
svg.addEventListener('focus', () => {
  let byKey = true;
  try { byKey = svg.matches(':focus-visible'); } catch (e) {}
  if (!byKey) return;
  startKbd();
  announce(cellInfo(cursor));
  render();
});
svg.addEventListener('blur', () => { if (kbdOn) { kbdOn = false; render(); } });

// ===== 결과 화면 (.show + data-outcome, 포커스 이동·Tab 가두기, Esc = 판 보기) =====
const Result = GxUI.modal($('endOverlay'), { showClass: 'show', fallbackFocus: () => svg });
$('endNew').addEventListener('click', () => { Result.close(false); setupMode = mode; startMatch(); });
$('endClose').addEventListener('click', () => { Result.close(); Sfx.play('ui-back'); });
$('endExit').addEventListener('click', leave);

// ===== 일시정지 메뉴 (html[data-menu] = pause|settings|help|setup) =====
const Menu = GxMenu($('gxMenu'), {
  button: $('menuBtn'),
  fallbackFocus: () => svg,
  focusFor: name => (name === 'setup' ? $('setupStart') : null),
  onShow(name) {
    $('exitConfirm').hidden = true;
    if (name === 'setup') { setupMode = mode; renderSetup(); }
  },
  onEscape() {
    if ($('exitConfirm').hidden) return false;
    hideExitConfirm();
    return true;
  },
  onClose() { if (pendingResult && over) showResult(); },
});
function openPause() {
  if (Result.isOpen() || Menu.isOpen()) return;
  Menu.open('pause', { returnTo: document.activeElement });
}
const inProgress = () => ready && history.length > 0 && !over;
function leave() {
  Sfx.play('ui-ok');
  GxUI.leave(EXIT_HREF);
}
function hideExitConfirm() {
  $('exitConfirm').hidden = true;
  GxUI.focusSafe($('menuExit'));
  Sfx.play('ui-back');
}
$('menuBtn').addEventListener('click', openPause);
$('menuResume').addEventListener('click', () => Menu.close());
$('menuRestart').addEventListener('click', () => Menu.push('setup'));
$('menuSettings').addEventListener('click', () => Menu.push('settings'));
$('menuHelp').addEventListener('click', () => Menu.push('help'));
$('settingsSetup').addEventListener('click', () => Menu.push('setup'));
$('setupStart').addEventListener('click', startMatch);
// 나가기: 진행 중이면 메뉴 안에서 한 번 더 확인
$('menuExit').addEventListener('click', () => {
  if (!inProgress()) { leave(); return; }
  $('exitConfirm').hidden = false;
  GxUI.focusSafe($('exitNo'));
  Sfx.play('ui-move');
});
$('exitYes').addEventListener('click', leave);
$('exitNo').addEventListener('click', hideExitConfirm);

// Esc·P: 메뉴 열기 (메뉴·결과 화면이 열려 있으면 그쪽이 먼저 처리)
document.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (blocked()) return;
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P' || e.code === 'KeyP') {
    if (e.repeat) return;
    e.preventDefault();
    openPause();
  }
});

$('undoBtn').addEventListener('click', undo);
$('levelSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  level = +b.dataset.v;
  saveSettings();
  Sfx.play('ui-move');
  render();
});
$('modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  setupMode = b.dataset.v; // "대국 시작"을 눌러야 적용
  Sfx.play('ui-move');
  renderSetup();
});

// 소리
$('soundBtn').addEventListener('click', () => Sfx.toggle());
$('soundToggle').addEventListener('click', () => Sfx.toggle());

// 언어: 숨긴 <select id="lang"> 를 #langCycle(◀ 이름 ▶)이 바꾸고 change 이벤트를 보냄
const LANGS = Object.keys(I18N);
for (const code of LANGS) {
  const o = document.createElement('option');
  o.value = code;
  o.textContent = I18N[code].name;
  $('lang').appendChild(o);
}
$('lang').addEventListener('change', e => {
  lang = e.target.value;
  saveSettings();
  applyLang();
  render();
});
function cycleLang(dir) {
  const s = $('lang');
  s.value = LANGS[(LANGS.indexOf(lang) + dir + LANGS.length) % LANGS.length];
  s.dispatchEvent(new Event('change'));
  Sfx.play('ui-move');
}
$('langCycle').addEventListener('click', e => {
  // 왼쪽 ◀ 를 누르면 이전 언어, 나머지는 다음 언어
  const a = e.target.closest('.gx-cycle-arrow');
  cycleLang(a && a === $('langCycle').querySelector('.gx-cycle-arrow') ? -1 : 1);
});
$('langCycle').addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  cycleLang(e.key === 'ArrowLeft' ? -1 : 1);
});

// 꾸미기 (K4): 즉시 반영
$('skinStones').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (!b || !SKIN_STONES.includes(b.dataset.v)) return;
  skin.stones = b.dataset.v;
  saveSkin(); applySkin(); render();
  Sfx.play('ui-move');
});
$('skinBoard').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (!b || !SKIN_BOARDS.includes(b.dataset.v)) return;
  skin.board = b.dataset.v;
  saveSkin(); applySkin(); render();
  Sfx.play('ui-move');
});

// 화면 배치(모바일/PC): 상태는 html[data-layout], 저장은 사이트 공통 키 games-layout
function syncLayoutSeg() {
  document.querySelectorAll('#layoutSeg button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.v === document.documentElement.dataset.layout));
  });
}
$('layoutSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  applyLayout(b.dataset.v);
  try { localStorage.setItem('games-layout', b.dataset.v); } catch (err) {}
  syncLayoutSeg();
  Sfx.play('ui-move');
});
// 다른 탭에서 바꾸면 따라감 (배치·프로필·스킨·언어. 소리·UI 테마는 공유 블록이 처리)
window.addEventListener('storage', e => {
  const all = e.key === null; // localStorage.clear()
  if (e.key === 'games-layout' && (e.newValue === 'mobile' || e.newValue === 'pc')) {
    applyLayout(e.newValue);
    syncLayoutSeg();
  }
  if (all || e.key === PROFILE_KEY) { profile = loadProfile(); render(); }
  if (all || e.key === SKIN_KEY) { skin = loadSkin(); applySkin(); render(); }
  if (e.key === 'games-lang' && I18N[e.newValue] && e.newValue !== lang) { lang = e.newValue; applyLang(); render(); }
});

// ===== 시작: 판은 초기 배치, 준비 시트(대전 방식·난이도 + "대국 시작")를 먼저 엶 =====
drawBoard();
applySkin();
applyLang();
syncLayoutSeg();
newGame();
Menu.open('setup', { locked: true, returnTo: svg });
GxUI.enter();
</script>
</body>
</html>
